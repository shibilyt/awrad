# Local services for the rebuild projects (docs/rebuild-plan.md, item 0.5).
# Optional: use this when the machine has no Postgres 18 of its own (Postgres.app or Homebrew on 5432 is the default).
#   docker compose up -d postgres     # start
#   docker compose down               # stop (data kept in the named volume)
# Dev-only credentials, reachable from this machine only (bound to 127.0.0.1).
name: awrad

services:
  postgres:
    # Major 18 everywhere: local, CI and the Dokploy database (MEMORY.md, durable facts).
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 by default, so it doesn't collide with a Postgres.app or Homebrew server on 5432.
      - "127.0.0.1:${AWRAD_POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/; mount the parent.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
