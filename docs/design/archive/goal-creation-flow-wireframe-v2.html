<body>
  <div id="root"></div>
  <script>
    const reactCreateElement = (tag, props, ...children) => {
      if (props && (Object.prototype.hasOwnProperty.call(props, 'class') || Object.prototype.hasOwnProperty.call(props, 'for'))) {
        props = { ...props, className: props.class ?? props.className, htmlFor: props.for ?? props.htmlFor };
        delete props.class;
        delete props.for;
      }
      const normalizedChildren = [];
      const flatten = values => values.forEach(value => Array.isArray(value) ? flatten(value) : normalizedChildren.push(value));
      flatten(children);
      return React.createElement(tag, props, ...normalizedChildren);
    };
    const html = htm.bind(reactCreateElement);
    const { useEffect, useMemo, useRef, useState } = React;

    /* Prototype question: does a decision-led advanced flow feel clearer than the
       current single long composer? Three variants are switchable via ?variant=. */
    const STORAGE_KEY = 'awrad-goal-creation-wireframe-v2';
    const VARIANTS = [
      { id: 'guided', name: 'Guided steps', hint: 'one decision per screen' },
      { id: 'advanced', name: 'Advanced builder', hint: 'rules-first guided flow' },
      { id: 'adaptive', name: 'Adaptive builder', hint: 'progressive disclosure' },
      { id: 'power', name: 'Power review', hint: 'configure in any order' },
    ];
    const STEPS = [
      { id: 'intent', label: 'Goal type', title: 'What are you trying to accomplish?' },
      { id: 'cadence', label: 'Schedule', title: 'When is this goal scheduled?' },
      { id: 'timing', label: 'Practice times', title: 'When will you practice?' },
      { id: 'success', label: 'Requirements', title: 'What must this goal achieve?' },
      { id: 'support', label: 'Support', title: 'How should this goal be supported?' },
    ];
    const ADVANCED_STEPS = [
      { id: 'cadence', label: 'Schedule', title: 'When should progress be evaluated?' },
      { id: 'timing', label: 'Sessions', title: 'When can you count?' },
      { id: 'requirements', label: 'Requirements', title: 'What must happen?' },
      { id: 'support', label: 'Support', title: 'How should we support it?' },
    ];
    const LIBRARY = [
      { id: 'astaghfirullah', arabic: 'أَسْتَغْفِرُ ٱللَّٰهَ ٱلْعَظِيمَ', tr: 'Astaghfirullah al-ʿAẓīm', en: 'I seek forgiveness from Allah, the Magnificent', tag: 'Forgiveness' },
      { id: 'subhanallah', arabic: 'سُبْحَانَ ٱللَّٰهِ', tr: 'Subḥān Allāh', en: 'Glory be to Allah', tag: 'Tasbih' },
      { id: 'alhamdulillah', arabic: 'ٱلْحَمْدُ لِلَّٰهِ', tr: 'Alḥamdulillāh', en: 'All praise is for Allah', tag: 'Praise' },
      { id: 'salawat', arabic: 'ٱللَّٰهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ', tr: 'Allāhumma ṣalli ʿalā Muḥammad', en: 'O Allah, send blessings upon Muhammad', tag: 'Salawat' },
      { id: 'lailahaillallah', arabic: 'لَا إِلَٰهَ إِلَّا ٱللَّٰهُ', tr: 'Lā ilāha illā Allāh', en: 'There is no god but Allah', tag: 'Tawhid' },
    ];
    const PRAYERS = [
      { id: 'fajr', label: 'Fajr' }, { id: 'dhuhr', label: 'Dhuhr' }, { id: 'asr', label: 'Asr' },
      { id: 'maghrib', label: 'Maghrib' }, { id: 'isha', label: 'Isha' },
    ];
    const WEEKDAYS = [
      { id: 'mon', label: 'Mon' }, { id: 'tue', label: 'Tue' }, { id: 'wed', label: 'Wed' },
      { id: 'thu', label: 'Thu' }, { id: 'fri', label: 'Fri' }, { id: 'sat', label: 'Sat' }, { id: 'sun', label: 'Sun' },
    ];
    const TIMES = ['05:30', '06:00', '07:00', '08:00', '09:00', '12:00', '15:00', '18:00', '19:00', '20:00', '21:00'];
    const REQUIREMENT_WINDOWS = [
      ['day', 'Every day'], ['week', 'Every week'], ['month', 'Every month'], ['lifetime', 'Whole goal'],
    ];
    const REQUIREMENT_OPERATORS = [
      ['atLeast', 'At least'], ['exactly', 'Exactly'], ['atMost', 'At most'],
    ];

    const clone = value => JSON.parse(JSON.stringify(value));
    const fmt = value => Number(value || 0).toLocaleString('en-US');
    const positive = value => Number.isInteger(Number(value)) && Number(value) > 0;
    const clockMinutes = value => {
      const [h, m] = String(value || '').split(':').map(Number);
      return Number.isFinite(h) && Number.isFinite(m) ? h * 60 + m : NaN;
    };
    const defaultPerPrayer = () => ({ fajr: '33', dhuhr: '33', asr: '33', maghrib: '33', isha: '33' });
    const defaultSessions = () => [
      { id: 1, label: 'Morning', start: '06:00', end: '07:00', count: '33' },
      { id: 2, label: 'Evening', start: '18:00', end: '19:00', count: '33' },
    ];
    const newRequirement = (window = 'day', amount = '100', contributesToStreak = true) => ({
      id: 'req-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      window,
      operator: 'atLeast',
      amount,
      contributesToStreak,
      purpose: contributesToStreak ? 'consistency' : 'completion',
    });
    const initialDraft = () => ({
      intent: 'custom',
      cadence: { kind: 'daily', weekdays: ['fri'], interval: '3', calendar: 'gregorian', month: '1', monthDays: ['1'], season: 'ramadan', dates: ['2026-08-20'] },
      timing: { kind: 'anytime', relation: 'after', beforeLead: '10', prayers: PRAYERS.map(p => p.id), uniform: true, sharedCount: '33', perPrayer: defaultPerPrayer(), morning: { time: '06:00', count: '50' }, evening: { time: '18:00', count: '50' }, sessions: defaultSessions(), customizeSessionTargets: false },
      rule: { mode: 'target', minimum: '10', target: '33', maximum: '100', cap: 'allow' },
      requirements: [],
      support: { reminders: false, reminderType: 'fixed', fixedTime: '08:00', offset: '10', duration: false, durationDays: '40', streak: false, streakCount: '100' },
      startDate: '2026-08-15',
    });

    function applyIntent(draft, intent) {
      const next = clone(draft);
      next.intent = intent;
      if (intent === 'daily') {
        next.cadence = { ...next.cadence, kind: 'daily' };
        next.timing = { ...next.timing, kind: 'anytime' };
        next.rule = { ...next.rule, mode: 'target', target: '33' };
      }
      if (intent === 'prayer') {
        next.cadence = { ...next.cadence, kind: 'daily' };
        next.timing = { ...next.timing, kind: 'prayer', relation: 'after', prayers: PRAYERS.map(p => p.id), uniform: true, sharedCount: '33' };
        next.rule = { ...next.rule, mode: 'target', target: '33' };
        next.support = { ...next.support, reminders: true, reminderType: 'prayer', offset: '10' };
      }
      if (intent === 'sessions') {
        next.cadence = { ...next.cadence, kind: 'daily' };
        next.timing = { ...next.timing, kind: 'sessions', sessions: defaultSessions() };
        next.rule = { ...next.rule, mode: 'target', target: '33' };
        next.support = { ...next.support, reminders: true, reminderType: 'session' };
      }
      if (intent === 'oneTime') {
        next.cadence = { ...next.cadence, kind: 'oneTime' };
        next.timing = { ...next.timing, kind: 'anytime' };
        next.rule = { ...next.rule, mode: 'target', target: '70000' };
        next.support = { ...next.support, reminders: false, streak: false, streakCount: '100' };
      }
      if (intent === 'tracker') {
        next.cadence = { ...next.cadence, kind: 'daily' };
        next.timing = { ...next.timing, kind: 'anytime' };
        next.rule = { ...next.rule, mode: 'tracker', target: '', minimum: '', maximum: '' };
      }
      return next;
    }

    function validate(draft, dhikr) {
      const errors = [];
      const add = (step, message, detail) => errors.push({ step, message, detail });
      if (!dhikr) add('practice', 'Choose a dhikr', 'Select the remembrance you want to track.');
      const cadence = draft.cadence;
      if ((cadence.kind === 'weekdays' || cadence.kind === 'weekly') && cadence.weekdays.length === 0) add('cadence', 'Choose at least one day', 'A selected-days goal needs one or more weekdays.');
      if (cadence.kind === 'interval' && !positive(cadence.interval)) add('cadence', 'Enter a valid interval', 'Every 1 day or more.');
      if (cadence.kind === 'monthly' && cadence.monthDays.length === 0) add('cadence', 'Choose a day of the month', 'Select at least one calendar day.');
      if (cadence.kind === 'yearly' && cadence.monthDays.length === 0) add('cadence', 'Choose a day of the year', 'Select at least one day in the chosen month.');
      if (cadence.kind === 'season' && !cadence.season) add('cadence', 'Choose a season', 'Select the Islamic season for this goal.');
      if (cadence.kind === 'dates' && cadence.dates.length === 0) add('cadence', 'Add at least one date', 'A date-based goal needs a date to repeat on.');

      const timing = draft.timing;
      if (timing.kind === 'prayer') {
        if (timing.prayers.length === 0) add('timing', 'Choose at least one prayer', 'Select where this practice belongs in the day.');
        if ((timing.relation === 'before' || timing.relation === 'both') && (!positive(timing.beforeLead) && timing.beforeLead !== '0')) add('timing', 'Set a valid lead time', 'Enter how many minutes before prayer.');
        if (!timing.uniform) timing.prayers.forEach(id => { if (!positive(timing.perPrayer[id])) add('timing', `${id[0].toUpperCase() + id.slice(1)} needs a count`, 'Each selected prayer needs a positive count.'); });
        if (timing.uniform && draft.rule.mode !== 'tracker' && !positive(timing.sharedCount)) add('timing', 'Set the count per prayer', 'Use a positive number or switch to a tracker.');
      }
      if (timing.kind === 'morningEvening' && draft.rule.mode !== 'tracker') {
        if (!positive(timing.morning.count)) add('timing', 'Set the morning count', 'Morning practice needs a positive count.');
        if (!positive(timing.evening.count)) add('timing', 'Set the evening count', 'Evening practice needs a positive count.');
      }
      if (timing.kind === 'sessions') {
        if (timing.sessions.length === 0) add('timing', 'Add a session', 'Custom timing needs at least one practice window.');
        const sorted = timing.sessions.map((s, index) => ({ ...s, index, start: clockMinutes(s.start), end: clockMinutes(s.end) })).sort((a, b) => a.start - b.start);
        sorted.forEach(s => {
          if (!(s.start < s.end)) add('timing', `${s.label || 'Session ' + (s.index + 1)} has an invalid window`, 'End time must be after start time.');
          if (draft.rule.mode !== 'tracker' && timing.customizeSessionTargets && !positive(s.count)) add('timing', `${s.label || 'Session ' + (s.index + 1)} needs a count`, 'Each customized session needs a positive count.');
        });
        sorted.slice(1).forEach((s, i) => { if (s.start < sorted[i].end) add('timing', 'Sessions overlap', 'Adjust the windows so each session has its own time.'); });
      }

      const rule = draft.rule;
      if (rule.mode === 'target' && !positive(rule.target)) add('success', 'Enter a target', 'The target must be a positive number.');
      if (rule.mode === 'minimum' && !positive(rule.minimum)) add('success', 'Enter a minimum', 'The minimum must be a positive number.');
      if (rule.mode === 'stretch') {
        if (!positive(rule.minimum)) add('success', 'Enter a minimum', 'The minimum must be a positive number.');
        if (!positive(rule.target)) add('success', 'Enter a target', 'The target must be a positive number.');
        if (positive(rule.minimum) && positive(rule.target) && Number(rule.minimum) >= Number(rule.target)) add('success', 'Target must exceed minimum', 'Give the stretch target room above the minimum.');
      }
      if (rule.mode === 'exact' && !positive(rule.maximum)) add('success', 'Enter an exact count', 'The exact count must be positive.');
      if (rule.mode === 'bounded') {
        if (!positive(rule.minimum)) add('success', 'Enter a minimum', 'The minimum must be positive.');
        if (!positive(rule.target)) add('success', 'Enter a target', 'The target must be positive.');
        if (!positive(rule.maximum)) add('success', 'Enter a maximum', 'The maximum must be positive.');
        if (positive(rule.minimum) && positive(rule.target) && positive(rule.maximum) && !(Number(rule.minimum) <= Number(rule.target) && Number(rule.target) <= Number(rule.maximum))) add('success', 'Keep the range ordered', 'Use minimum ≤ target ≤ maximum.');
      }

      (draft.requirements || []).forEach((requirement, index) => {
        if (!positive(requirement.amount)) add('success', `Requirement ${index + 1} needs an amount`, 'Use a positive count for this requirement.');
        if (requirement.contributesToStreak && requirement.window !== 'day') add('success', 'Streak requirements must be daily', 'Choose Every day or turn off streak eligibility.');
      });

      const support = draft.support;
      if (support.reminders && (support.reminderType === 'prayer' || support.reminderType === 'session') && (!positive(support.offset) && support.offset !== '0')) add('support', 'Set a valid reminder offset', 'Use 0 or more minutes.');
      if (support.duration && !positive(support.durationDays)) add('support', 'Set a valid duration', 'Duration must be a positive number of days.');
      if (support.streak && !positive(support.streakCount)) add('support', 'Set a valid streak minimum', 'The streak minimum must be positive.');
      return errors;
    }

    function cadenceSummary(c) {
      if (c.kind === 'oneTime') return 'One-time total';
      if (c.kind === 'daily') return 'Every day';
      if (c.kind === 'week') return 'Every week · any day';
      if (c.kind === 'weekdays' || c.kind === 'weekly') return c.weekdays.length ? 'Every ' + c.weekdays.join(', ') : 'Choose weekdays';
      if (c.kind === 'interval') return 'Every ' + (c.interval || '…') + ' days';
      if (c.kind === 'monthly') return 'Monthly on day ' + (c.monthDays.join(', ') || '…');
      if (c.kind === 'yearly') return 'Yearly on ' + c.month + '/' + (c.monthDays.join(', ') || '…');
      if (c.kind === 'season') return c.season === 'ramadan' ? 'Throughout Ramadan' : c.season === 'last10' ? 'Last 10 nights of Ramadan' : 'Dhul-Hijjah 1–10';
      return c.dates.length ? 'On ' + c.dates.join(', ') : 'Add specific dates';
    }

    function intentSummary(intent) {
      return ({ daily: 'Daily habit', prayer: 'Around prayers', sessions: 'Named sessions', oneTime: 'Reach a total', tracker: 'Track practice', custom: 'Custom goal' })[intent] || 'Custom goal';
    }

    function timingSummary(t) {
      if (t.kind === 'anytime') return 'Anytime';
      if (t.kind === 'prayer') return (t.prayers.length ? t.prayers.map(p => p[0].toUpperCase() + p.slice(1)).join(' + ') : 'Choose prayers') + ' · ' + t.relation;
      if (t.kind === 'morningEvening') return 'Morning at ' + t.morning.time + ' + evening at ' + t.evening.time;
      return t.sessions.length ? t.sessions.map(s => `${s.label || 'Session'} ${s.start}–${s.end}`).join(' · ') + (t.customizeSessionTargets ? ' · custom targets' : ' · shared target') : 'Add time windows';
    }

    function successSummary(r, t, c) {
      if (r.mode === 'tracker') return 'Track every count · no target';
      if (r.mode === 'minimum') return 'Do at least ' + fmt(r.minimum) + ' counts';
      if (r.mode === 'stretch') return 'At least ' + fmt(r.minimum) + ' · aim for ' + fmt(r.target);
      if (r.mode === 'exact') return 'Complete exactly ' + fmt(r.maximum) + ' counts';
      if (r.mode === 'bounded') return fmt(r.minimum) + '–' + fmt(r.maximum) + ' counts · aim for ' + fmt(r.target);
      if (t.kind === 'prayer' && !t.uniform) return 'A different target for each prayer';
      return c?.kind === 'oneTime' ? 'Reach ' + fmt(r.target) + ' total' : 'Reach ' + fmt(r.target) + ' each time';
    }

    function primaryWindow(c) {
      if (c.kind === 'oneTime') return 'lifetime';
      if (c.kind === 'week' || c.kind === 'weekly') return 'week';
      if (c.kind === 'weekdays') return 'day';
      if (c.kind === 'monthly' || c.kind === 'yearly' || c.kind === 'season') return 'month';
      return 'day';
    }

    function windowLabel(window) {
      return ({ day: 'every day', week: 'every week', month: 'every month', lifetime: 'whole goal' })[window] || 'each period';
    }

    function operatorLabel(operator) {
      return ({ atLeast: 'At least', exactly: 'Exactly', atMost: 'At most' })[operator] || 'At least';
    }

    function requirementSummary(requirement) {
      return `${operatorLabel(requirement.operator)} ${fmt(requirement.amount)} · ${windowLabel(requirement.window)}${requirement.contributesToStreak ? ' · counts toward streak' : ''}`;
    }

    function milestoneMeta(requirement) {
      if (requirement.operator === 'atMost') return { label: 'Daily ceiling', description: 'Optional upper limit for today', tone: 'limit' };
      if (requirement.contributesToStreak) return { label: 'Streak minimum', description: 'The day qualifies once you reach this', tone: 'complete' };
      return { label: 'Daily target', description: 'Your preferred count for today', tone: 'target' };
    }

    function milestoneShortLabel(requirement) {
      if (requirement.operator === 'atMost') return 'ceiling';
      if (requirement.contributesToStreak) return 'streak floor';
      return 'daily target';
    }

    function milestoneState(requirement, status) {
      if (requirement.operator === 'atMost') {
        if (status.current > status.target) return { reached: false, tone: 'limit', label: fmt(status.current - status.target) + ' over limit', percent: 100 };
        if (status.current === status.target) return { reached: false, tone: 'limit', label: 'Limit reached', percent: 100 };
        return { reached: false, tone: 'limit', label: fmt(status.target - status.current) + ' room left', percent: status.percent };
      }
      if (status.met) return { reached: true, tone: 'complete', label: requirement.contributesToStreak ? 'Streak protected' : 'Target reached', percent: 100 };
      return { reached: false, tone: 'target', label: '+' + fmt(status.target - status.current) + ' to unlock', percent: status.percent };
    }

    function milestoneExampleDraft() {
      const base = initialDraft();
      const streak = newRequirement('day', '11', true);
      const ceiling = { ...newRequirement('day', '313', false), operator: 'atMost', purpose: 'limit' };
      return { ...base, intent: 'daily', cadence: { ...base.cadence, kind: 'daily' }, rule: { ...base.rule, mode: 'target', target: '100' }, requirements: [streak, ceiling] };
    }

    function additionalRequirementsSummary(requirements) {
      const items = requirements || [];
      if (!items.length) return 'No additional requirements';
      return items.length + ' additional requirement' + (items.length === 1 ? '' : 's') + ' · ' + items.map(requirementSummary).join(' · ');
    }

    function requirementsSummary(draft) {
      const primary = successSummary(draft.rule, draft.timing, draft.cadence);
      const extras = draft.requirements || [];
      return extras.length ? primary + ' · ' + extras.map(requirementSummary).join(' · ') : primary;
    }

    function allRequirements(draft) {
      const r = draft.rule;
      if (r.mode === 'tracker') return draft.requirements || [];
      const primaryAmount = r.mode === 'minimum' ? r.minimum : r.mode === 'exact' ? r.maximum : r.target;
      return [{ id: 'primary', window: primaryWindow(draft.cadence), operator: r.mode === 'minimum' ? 'atLeast' : r.mode === 'exact' ? 'exactly' : 'atLeast', amount: primaryAmount, purpose: 'completion', contributesToStreak: false }, ...(draft.requirements || [])];
    }

    function requirementProgress(requirement, progress) {
      return progress[requirement.window] ?? progress.day ?? 0;
    }

    function supportSummary(s, timing) {
      const values = [];
      if (s.reminders) values.push(s.reminderType === 'fixed' ? 'Reminder at ' + s.fixedTime : (s.reminderType === 'prayer' ? s.offset + 'm around prayers' : 'At session start'));
      if (s.duration) values.push(s.durationDays + ' days');
      return values.length ? values.join(' · ') : 'No reminders or limits';
    }

    function contractText(draft, dhikr) {
      if (!dhikr) return 'Choose a dhikr to preview your goal.';
      const extras = (draft.requirements || []).length ? ' · +' + draft.requirements.length + ' requirement' + (draft.requirements.length === 1 ? '' : 's') : '';
      return `${dhikr.tr} · ${cadenceSummary(draft.cadence)} · ${timingSummary(draft.timing)} · ${successSummary(draft.rule, draft.timing, draft.cadence)}${extras}`;
    }

    function countingBadge(draft) {
      const r = draft.rule;
      if (r.mode === 'tracker') return 'Track counts';
      const amount = r.mode === 'minimum' ? r.minimum : r.mode === 'exact' ? r.maximum : r.target;
      if (draft.cadence.kind === 'oneTime') return fmt(amount) + ' total';
      const suffix = ({ daily: 'times daily', week: 'weekly', weekly: 'weekly', weekdays: 'on selected days', monthly: 'monthly', yearly: 'yearly', season: 'in season' })[draft.cadence.kind] || 'per occurrence';
      return fmt(amount) + ' ' + suffix;
    }

    function AppBar({ title, onBack, right, counting, goalPill }) {
      return html`<div class=${'appbar' + (counting ? ' counting' : '')} data-testid=${counting ? 'goal-screen-header' : null}>
        <button class="back" aria-label="Back" onClick=${onBack}>←</button>
        ${counting ? html`<div class="count-title"><h2>${title}</h2><span class="count-pill">${goalPill}</span></div><div class="count-actions"><button class="count-action" aria-label="Text size">Aa</button><button class="count-action menu" aria-label="More options">⋮</button></div>` : html`<h2>${title}</h2>${right ? html`<span class="status-pill">${right}</span>` : null}`}
      </div>`;
    }

    function keyed(nodes) {
      return React.createElement(React.Fragment, null, nodes.map((node, index) => React.isValidElement(node) ? React.cloneElement(node, { key: index }) : node));
    }

    function StepProgress({ index }) {
      return html`<div class="progress" aria-label=${'Step ' + (index + 1) + ' of ' + STEPS.length}>
        ${keyed(STEPS.map((step, i) => html`<span class=${i < index ? 'done' : i === index ? 'current' : ''}></span>`))}
      </div>`;
    }

    function StepIntro({ step, body }) {
      return html`<div>
        <div class="kicker">${step.label}</div>
        <h1>${step.title}</h1>
        <p class="lede">${body}</p>
      </div>`;
    }

    function Choice({ selected, title, desc, example, onClick, full }) {
      return html`<button class=${'choice' + (selected ? ' selected' : '') + (full ? ' full-choice' : '')} onClick=${onClick} aria-pressed=${selected}>
        ${selected ? html`<span class="check">✓</span>` : null}
        <span class="title">${title}</span>
        ${desc ? html`<span class="desc">${desc}</span>` : null}
        ${example ? html`<span class="example">${example}</span>` : null}
      </button>`;
    }

    function Stepper({ value, onChange, label, quick = [] }) {
      const current = Number(value) || 0;
      const set = next => onChange(String(Math.max(0, Math.min(999999999, next))));
      return html`<div>
        ${label ? html`<span class="label">${label}</span>` : null}
        <div class="stepper">
          <button aria-label=${'Decrease ' + (label || 'value')} onClick=${() => set(current - 1)}>−</button>
          <input type="number" min="0" value=${value} aria-label=${label || 'value'} onInput=${e => onChange(e.target.value.replace(/[^0-9]/g, ''))}/>
          <button aria-label=${'Increase ' + (label || 'value')} onClick=${() => set(current + 1)}>+</button>
        </div>
        ${quick.length ? html`<div class="pill-row" style=${{marginTop: '7px'}}>${keyed(quick.map(n => html`<button class=${'pill' + (String(n) === String(value) ? ' selected' : '')} onClick=${() => onChange(String(n))}>${fmt(n)}</button>`))}</div>` : null}
      </div>`;
    }

    function Switch({ checked, onChange, label, desc }) {
      return html`<div class="toggle-row">
        <div class="grow"><b>${label}</b>${desc ? html`<div class="subtle">${desc}</div>` : null}</div>
        <button class=${'switch' + (checked ? ' on' : '')} role="switch" aria-checked=${checked} aria-label=${label} onClick=${() => onChange(!checked)}><i></i></button>
      </div>`;
    }

    function DhikrItem({ dhikr, onPick }) {
      return React.createElement('button', { className: 'dhikr', onClick: () => onPick(dhikr) },
        React.createElement('div', { className: 'arabic' }, dhikr.arabic),
        React.createElement('div', null,
          React.createElement('b', null, dhikr.tr),
          React.createElement('div', { className: 'english' }, dhikr.en),
          React.createElement('span', { className: 'tag' }, dhikr.tag),
        ),
      );
    }

    function DhikrAddModal({ newName, setNewName, create, onClose }) {
      return html`<div class="modal-layer"><div class="modal" role="dialog" aria-modal="true" aria-label="Add a new dhikr">
        <h3>Add a new dhikr</h3><p>Prototype only: this adds a local item to the picker.</p>
        <label class="label" for="new-dhikr">Name</label><input id="new-dhikr" value=${newName} placeholder="e.g. My morning dhikr" onInput=${e => setNewName(e.target.value)} />
        <div class="actions" style=${{marginTop: '12px'}}><button class="button primary" disabled=${!newName.trim()} onClick=${create}>Add and select</button><button class="button ghost" onClick=${onClose}>Cancel</button></div>
      </div></div>`;
    }

    function DhikrPicker({ library, query, setQuery, onPick, onBack, onCreate }) {
      const [newOpen, setNewOpen] = useState(false);
      const [newName, setNewName] = useState('');
      const filtered = library.filter(d => [d.tr, d.en, d.arabic].some(v => v.toLowerCase().includes(query.toLowerCase())));
      const create = () => {
        if (!newName.trim()) return;
        onCreate({ id: 'custom-' + Date.now(), arabic: 'ذِكْر', tr: newName.trim(), en: 'Custom dhikr', tag: 'Custom' });
        setNewName('');
        setNewOpen(false);
      };
      return html`<div class="picker-root"><div class="scroll"><div class="content">
        <div class="kicker">Practice</div><h1>What would you like to practice?</h1>
        <p class="lede">Choose a dhikr first. The next steps shape when and how this practice becomes a goal.</p>
        <input class="picker-search" placeholder="Search dhikr…" value=${query} aria-label="Search dhikr" onInput=${e => setQuery(e.target.value)} />
        ${filtered.length ? React.createElement(React.Fragment, null, filtered.map(d => React.createElement(DhikrItem, { key: d.id, dhikr: d, onPick }))) : html`<div class="card soft"><b>No dhikr found</b><p class="subtle" style=${{margin: '4px 0 12px'}}>Try another spelling or add your own remembrance.</p><button class="button tonal" onClick=${() => setNewOpen(true)}>Add a new dhikr</button></div>`}
        ${filtered.length ? html`<button class="button ghost full" onClick=${() => setNewOpen(true)}>＋ Add a new dhikr</button>` : null}
      </div></div>
      ${newOpen ? React.createElement(DhikrAddModal, { newName, setNewName, create, onClose: () => setNewOpen(false) }) : null}</div>`;
    }

    function IntentStep({ draft, update }) {
      const intents = [
        ['daily', 'Build a daily habit', 'One clear target every day.', '100 each day'],
        ['prayer', 'Practice around prayers', 'Create a place for dhikr around salah.', '33 after each prayer'],
        ['sessions', 'Split it into sessions', 'Use named time windows through the day.', '50 morning + 50 evening'],
        ['oneTime', 'Reach a total', 'One finish line, no recurring goal instances.', '70,000 total'],
        ['tracker', 'Track without a target', 'Record every count without a denominator.', 'Just count'],
        ['custom', 'Start from a blank canvas', 'Keep full control over every decision.', 'Custom schedule'],
      ];
      return html`<div class="stack loose">
        <${StepIntro} step=${STEPS[0]} body="Start with the outcome you have in mind. We’ll use it to suggest sensible defaults; every detail stays editable."></${StepIntro}>
        <div class="choice-grid">${keyed(intents.map(([id, title, desc, example]) => html`<${Choice} selected=${draft.intent === id} title=${title} desc=${desc} example=${example} onClick=${() => update(applyIntent(draft, id))}></${Choice}>`))}</div>
        <div class="step-note"><b>Why this helps:</b> “Advanced” describes the app, not your intention. Choose the practice you mean; the controls appear only when they become relevant.</div>
      </div>`;
    }

    function CadenceStep({ draft, update }) {
      const c = draft.cadence;
      const choose = kind => update({ ...draft, cadence: { ...c, kind } });
      const toggleDay = day => update({ ...draft, cadence: { ...c, weekdays: c.weekdays.includes(day) ? c.weekdays.filter(x => x !== day) : [...c.weekdays, day] } });
      const toggleMonthDay = day => update({ ...draft, cadence: { ...c, monthDays: c.monthDays.includes(day) ? c.monthDays.filter(x => x !== day) : [...c.monthDays, day] } });
      const addDate = e => { const value = e.target.value; if (value && !c.dates.includes(value)) update({ ...draft, cadence: { ...c, dates: [...c.dates, value].sort() } }); };
      const kinds = [
        ['oneTime', 'One time', 'One finish line, no recurring instances'],
        ['daily', 'Every day', 'A steady daily rhythm'], ['week', 'Every week', 'Reach the total any day in the week'],
        ['weekdays', 'Selected weekdays', 'Every Friday or a few days'],
        ['interval', 'Every N days', 'A repeating interval'], ['season', 'Islamic season', 'Ramadan or Dhul-Hijjah'],
        ['monthly', 'Monthly', 'One or more calendar days'], ['yearly', 'Monthly each year', 'A yearly occasion'],
        ['dates', 'Specific dates', 'A finite set of dates'],
      ];
      return html`<div class="stack loose">
        <${StepIntro} step=${STEPS[1]} body="Choose whether this goal has one finish line or creates a recurring goal instance. Practice times and requirements are separate."></${StepIntro}>
        <div class="choice-grid">${keyed(kinds.map(([id, title, desc]) => html`<${Choice} selected=${c.kind === id} title=${title} desc=${desc} onClick=${() => choose(id)}></${Choice}>`))}</div>
        ${c.kind === 'oneTime' ? html`<div class="card emphasis"><b>One-time total</b><p class="subtle" style=${{margin: '4px 0 0'}}>This goal has one finish line. If you want a streak while you work toward it, add a daily minimum under Requirements.</p></div>` : null}
        ${c.kind === 'weekdays' || c.kind === 'weekly' ? html`<div class="card soft"><span class="label">Which weekdays?</span><div class="pill-row">${keyed(WEEKDAYS.map(day => html`<button class=${'pill' + (c.weekdays.includes(day.id) ? ' selected' : '')} onClick=${() => toggleDay(day.id)}>${day.label}</button>`))}</div></div>` : null}
        ${c.kind === 'interval' ? html`<div class="card soft"><${Stepper} label="Every (days)" value=${c.interval} quick=${[2, 3, 7, 10]} onChange=${value => update({ ...draft, cadence: { ...c, interval: value } })}></${Stepper}></div>` : null}
        ${c.kind === 'season' ? html`<div class="card soft"><span class="label">Which season?</span><div class="pill-row">${keyed([['ramadan','Ramadan'], ['last10','Last 10 nights'], ['dhulHijjah','Dhul-Hijjah 1–10']].map(([id, label]) => html`<button class=${'pill' + (c.season === id ? ' selected' : '')} onClick=${() => update({ ...draft, cadence: { ...c, season: id } })}>${label}</button>`))}</div><p class="subtle" style=${{margin: '10px 0 0'}}>A season gives the goal a meaningful window without requiring an end date.</p></div>` : null}
        ${c.kind === 'monthly' || c.kind === 'yearly' ? html`<div class="card soft">
          <div class="row between"><span class="label" style=${{margin: 0}}>Calendar</span><div class="pill-row"><button class=${'pill' + (c.calendar === 'gregorian' ? ' selected' : '')} onClick=${() => update({ ...draft, cadence: { ...c, calendar: 'gregorian' } })}>Gregorian</button><button class=${'pill' + (c.calendar === 'hijri' ? ' selected' : '')} onClick=${() => update({ ...draft, cadence: { ...c, calendar: 'hijri' } })}>Hijri</button></div></div>
          ${c.kind === 'yearly' ? html`<div class="field"><label class="label">Month</label><select value=${c.month} onChange=${e => update({ ...draft, cadence: { ...c, month: e.target.value } })}>${keyed(Array.from({length: 12}, (_, i) => html`<option value=${String(i + 1)}>Month ${i + 1}</option>`))}</select></div>` : null}
          <div class="field"><span class="label">Days of the month</span><div class="pill-row">${keyed([1, 5, 10, 15, 20, 25, 30].map(day => html`<button class=${'pill' + (c.monthDays.includes(String(day)) ? ' selected' : '')} onClick=${() => toggleMonthDay(String(day))}>${day}</button>`))}</div></div>
        </div>` : null}
        ${c.kind === 'dates' ? html`<div class="card soft"><label class="label" for="specific-date">Add a date</label><input id="specific-date" type="date" onChange=${addDate}/><div class="pill-row" style=${{marginTop: '9px'}}>${keyed(c.dates.map(date => html`<button class="pill selected" onClick=${() => update({ ...draft, cadence: { ...c, dates: c.dates.filter(x => x !== date) } })}>${date} ×</button>`))}</div></div>` : null}
        <div class="step-note"><b>Preview:</b> ${cadenceSummary(c)}${c.kind === 'oneTime' ? ' · no recurring goal instances' : ' · starts ' + draft.startDate + '. Change the start date later in Support.'}</div>
      </div>`;
    }

    function PrayerTiming({ draft, update }) {
      const t = draft.timing;
      const togglePrayer = id => update({ ...draft, timing: { ...t, prayers: t.prayers.includes(id) ? t.prayers.filter(x => x !== id) : [...t.prayers, id] } });
      return html`<div class="card soft stack">
        <span class="label">Prayer anchor</span>
        <div class="pill-row">${keyed([['after','After'], ['before','Before'], ['both','Before + after']].map(([id, label]) => html`<button class=${'pill' + (t.relation === id ? ' selected' : '')} onClick=${() => update({ ...draft, timing: { ...t, relation: id } })}>${label}</button>`))}</div>
        ${(t.relation === 'before' || t.relation === 'both') ? html`<${Stepper} label="Minutes before prayer" value=${t.beforeLead} quick=${[5, 10, 15]} onChange=${value => update({ ...draft, timing: { ...t, beforeLead: value } })}></${Stepper}>` : null}
        <span class="label">Which prayers?</span><div class="pill-row">${keyed(PRAYERS.map(p => html`<button class=${'pill' + (t.prayers.includes(p.id) ? ' selected' : '')} onClick=${() => togglePrayer(p.id)}>${p.label}</button>`))}</div>
        <div class="divider"></div>
        <div class="row between"><div><b>Same count for all</b><div class="subtle">Or set a separate amount below.</div></div><button class=${'switch' + (t.uniform ? ' on' : '')} role="switch" aria-checked=${t.uniform} onClick=${() => update({ ...draft, timing: { ...t, uniform: !t.uniform } })}><i></i></button></div>
        ${t.uniform ? html`<${Stepper} label="Count after each selected prayer" value=${t.sharedCount} quick=${[3, 33, 100]} onChange=${value => update({ ...draft, timing: { ...t, sharedCount: value }, rule: { ...draft.rule, target: value } })}></${Stepper}>` : html`<div class="stack">${keyed(t.prayers.map(id => html`<${Stepper} label=${id[0].toUpperCase() + id.slice(1) + ' count'} value=${t.perPrayer[id]} quick=${[3, 33, 100]} onChange=${value => update({ ...draft, timing: { ...t, perPrayer: { ...t.perPrayer, [id]: value } } })}></${Stepper}>`))}${!t.prayers.length ? html`<div class="subtle">Choose a prayer to add its count.</div>` : null}</div>`}
      </div>`;
    }

    function SessionEditor({ draft, update }) {
      const t = draft.timing;
      const customTargets = Boolean(t.customizeSessionTargets);
      const updateSession = (id, patch) => update({ ...draft, timing: { ...t, sessions: t.sessions.map(s => s.id === id ? { ...s, ...patch } : s) } });
      const add = () => update({ ...draft, timing: { ...t, sessions: [...t.sessions, { id: Date.now(), label: 'New session', start: '12:00', end: '13:00', count: '33' }] } });
      return html`<div class="card soft">
        <div class="row between"><div><b>Named practice windows</b><div class="subtle">${customTargets ? 'Each window can have its own target.' : 'Each window follows the primary target.'}</div></div><span class="tag">${t.sessions.length} slots</span></div>
        <div class="field" style=${{marginTop: '11px'}}><${Switch} label="Customize target per session" desc="Turn this on only when each session needs a different count." checked=${customTargets} onChange=${value => update({ ...draft, timing: { ...t, customizeSessionTargets: value } })}></${Switch}></div>
        <div style=${{marginTop: '10px'}}>${keyed(t.sessions.map((s, index) => html`<div class="session">
          <div class="row between"><b>Session ${index + 1}</b>${t.sessions.length > 1 ? html`<button class="button ghost" style=${{minHeight: '30px', padding: '4px 7px'}} onClick=${() => update({ ...draft, timing: { ...t, sessions: t.sessions.filter(x => x.id !== s.id) } })}>Remove</button>` : null}</div>
          <div class="field"><label class="label">Name</label><input value=${s.label} onInput=${e => updateSession(s.id, { label: e.target.value })}/></div>
          <div class="session-grid field"><div><label class="label">Starts</label><select value=${s.start} onChange=${e => updateSession(s.id, { start: e.target.value })}>${keyed(TIMES.map(time => html`<option>${time}</option>`))}</select></div><div><label class="label">Ends</label><select value=${s.end} onChange=${e => updateSession(s.id, { end: e.target.value })}>${keyed(TIMES.concat(['22:00', '23:00']).map(time => html`<option>${time}</option>`))}</select></div><div class="wide">${customTargets ? html`<${Stepper} label="Count for this session" value=${s.count} quick=${[33, 50, 100]} onChange=${value => updateSession(s.id, { count: value })}></${Stepper}>` : html`<div class="session-target-note"><span class="label">Session target</span><b>Uses primary target</b><div class="subtle">Change it once under Requirements.</div></div>`}</div></div>
          ${!(clockMinutes(s.start) < clockMinutes(s.end)) ? html`<div class="inline-error">End must be after start.</div>` : null}
        </div>`))}</div>
        <button class="button tonal full" style=${{marginTop: '10px'}} onClick=${add}>＋ Add session</button>
      </div>`;
    }

    function TimingStep({ draft, update }) {
      const t = draft.timing;
      const setKind = kind => update({ ...draft, timing: { ...t, kind } });
      return html`<div class="stack loose">
        <${StepIntro} step=${STEPS[2]} body="Schedule says when the goal is due. Practice times say where the remembrance fits in your day."></${StepIntro}>
        <div class="choice-grid">
          <${Choice} selected=${t.kind === 'anytime'} title="Anytime" desc="Leave the moment open." onClick=${() => setKind('anytime')}></${Choice}>
          <${Choice} selected=${t.kind === 'prayer'} title="Around prayers" desc="Before, after, or both." onClick=${() => setKind('prayer')}></${Choice}>
          <${Choice} selected=${t.kind === 'morningEvening'} title="Morning + evening" desc="Two gentle anchors." onClick=${() => setKind('morningEvening')}></${Choice}>
          <${Choice} selected=${t.kind === 'sessions'} title="Custom windows" desc="Name your own sessions." onClick=${() => setKind('sessions')}></${Choice}>
        </div>
        ${t.kind === 'prayer' ? html`<${PrayerTiming} draft=${draft} update=${update}></${PrayerTiming}>` : null}
        ${t.kind === 'morningEvening' ? html`<div class="card soft stack"><div class="row start"><div class="grow"><b>Morning</b><div class="subtle">A calm start to the day.</div></div><input type="time" value=${t.morning.time} onChange=${e => update({ ...draft, timing: { ...t, morning: { ...t.morning, time: e.target.value } } })}/></div><${Stepper} label="Morning count" value=${t.morning.count} quick=${[33, 50, 100]} onChange=${value => update({ ...draft, timing: { ...t, morning: { ...t.morning, count: value } } })}></${Stepper}><div class="divider"></div><div class="row start"><div class="grow"><b>Evening</b><div class="subtle">A closing anchor after the day.</div></div><input type="time" value=${t.evening.time} onChange=${e => update({ ...draft, timing: { ...t, evening: { ...t.evening, time: e.target.value } } })}/></div><${Stepper} label="Evening count" value=${t.evening.count} quick=${[33, 50, 100]} onChange=${value => update({ ...draft, timing: { ...t, evening: { ...t.evening, count: value } } })}></${Stepper}></div>` : null}
        ${t.kind === 'sessions' ? html`<${SessionEditor} draft=${draft} update=${update}></${SessionEditor}>` : null}
        <div class="step-note"><b>What changes when you choose a timing?</b> We create visible practice slots and keep the count decision separate. Switching modes is explicit; it never silently deletes a previous value.</div>
      </div>`;
    }

    function SuccessStep({ draft, update }) {
      const r = draft.rule;
      const requirements = draft.requirements || [];
      const oneTime = draft.cadence.kind === 'oneTime';
      const setMode = mode => update({ ...draft, rule: { ...r, mode } });
      const updateRequirement = (id, patch) => update({ ...draft, requirements: requirements.map(requirement => requirement.id === id ? { ...requirement, ...patch } : requirement) });
      const removeRequirement = id => update({ ...draft, requirements: requirements.filter(requirement => requirement.id !== id) });
      const addRequirement = (window = 'day', amount = '100', contributesToStreak = true) => update({ ...draft, requirements: [...requirements, newRequirement(window, amount, contributesToStreak)] });
      const loadMilestoneLadder = () => {
        const streak = newRequirement('day', '11', true);
        const ceiling = { ...newRequirement('day', '313', false), operator: 'atMost', purpose: 'limit' };
        update({ ...draft, rule: { ...r, mode: 'target', target: '100' }, requirements: [...requirements.filter(requirement => requirement.window !== 'day'), streak, ceiling] });
      };
      const simple = [['target', 'Reach a target', 'Complete the target to mark the occurrence done.'], ['minimum', 'Do at least', 'Any count above the minimum is enough.'], ['tracker', 'Just track', 'Record counts without a target.']];
      const advanced = [['stretch', 'Minimum + target', 'A floor for consistency and a higher aim.'], ['exact', 'Exact count', 'Stop the goal at one exact number.'], ['bounded', 'Flexible range', 'Minimum ≤ target ≤ maximum.']];
      return html`<div class="stack loose">
        <${StepIntro} step=${STEPS[3]} body=${oneTime ? 'Set the finish line, then add independent daily or weekly requirements if this goal needs a rhythm while it is active.' : 'Set the primary outcome first. Add another requirement only when one target is not enough.'}></${StepIntro}>
        ${draft.intent === 'tracker' ? html`<div class="card emphasis"><b>This is a tracker</b><p class="subtle" style=${{margin: '4px 0 0'}}>There is no denominator. Every count is recorded and the goal never blocks you at a target.</p></div>` : null}
        <div class="rule-list">${keyed(simple.map(([mode, title, desc]) => html`<button class=${'rule' + (r.mode === mode ? ' selected' : '')} onClick=${() => setMode(mode)}><span class="radio"></span><span><span class="rtitle">${title}</span><span class="rdesc">${desc}</span></span></button>`))}</div>
        <details open=${['stretch', 'exact', 'bounded'].includes(r.mode)}><summary class="button ghost" style=${{padding: '8px 0'}}>＋ More control</summary><div class="rule-list" style=${{marginTop: '8px'}}>${keyed(advanced.map(([mode, title, desc]) => html`<button class=${'rule' + (r.mode === mode ? ' selected' : '')} onClick=${() => setMode(mode)}><span class="radio"></span><span><span class="rtitle">${title}</span><span class="rdesc">${desc}</span></span></button>`))}</div></details>
        ${r.mode === 'target' ? html`<div class="card soft"><${Stepper} label=${oneTime ? 'Total to reach' : 'Primary target'} value=${r.target} quick=${oneTime ? [1000, 10000, 70000] : [33, 100, 313]} onChange=${value => update({ ...draft, rule: { ...r, target: value } })}></${Stepper}></div>` : null}
        ${r.mode === 'minimum' ? html`<div class="card soft"><${Stepper} label="Primary minimum" value=${r.minimum} quick=${[10, 33, 100]} onChange=${value => update({ ...draft, rule: { ...r, minimum: value } })}></${Stepper}></div>` : null}
        ${r.mode === 'stretch' ? html`<div class="card soft stack"><${Stepper} label="Minimum" value=${r.minimum} quick=${[10, 33]} onChange=${value => update({ ...draft, rule: { ...r, minimum: value } })}></${Stepper}><${Stepper} label="Target" value=${r.target} quick=${[33, 100, 313]} onChange=${value => update({ ...draft, rule: { ...r, target: value } })}></${Stepper}></div>` : null}
        ${r.mode === 'exact' ? html`<div class="card soft"><${Stepper} label="Exact count" value=${r.maximum} quick=${[33, 100, 313]} onChange=${value => update({ ...draft, rule: { ...r, maximum: value } })}></${Stepper}></div>` : null}
        ${r.mode === 'bounded' ? html`<div class="card soft stack"><${Stepper} label="Minimum" value=${r.minimum} onChange=${value => update({ ...draft, rule: { ...r, minimum: value } })}></${Stepper}><${Stepper} label="Target" value=${r.target} onChange=${value => update({ ...draft, rule: { ...r, target: value } })}></${Stepper}><${Stepper} label="Maximum" value=${r.maximum} onChange=${value => update({ ...draft, rule: { ...r, maximum: value } })}></${Stepper}><div class="subtle">The order is enforced at review: minimum ≤ target ≤ maximum.</div></div>` : null}

        <div class="card soft">
          <div class="row between"><div><span class="label">Additional requirements</span><b>${requirements.length ? requirements.length + ' extra check' + (requirements.length === 1 ? '' : 's') : 'One target is enough'}</b><div class="subtle">Each requirement checks the same counts over its own time window.</div></div><span class="tag">${requirements.length}</span></div>
          ${requirements.length ? html`<div class="requirement-list" style=${{marginTop: '11px'}}>${keyed(requirements.map((requirement, index) => html`<div class="requirement-card">
            <div class="row between"><div class="grow"><div class="requirement-name">Requirement ${index + 1}</div><div class="requirement-summary">${requirementSummary(requirement)}</div></div><button class="button ghost" style=${{minHeight: '30px', padding: '4px 7px'}} aria-label=${'Remove requirement ' + (index + 1)} onClick=${() => removeRequirement(requirement.id)}>Remove</button></div>
            <div class="requirement-grid">
              <div><label class="label" for=${requirement.id + '-operator'}>Rule</label><select id=${requirement.id + '-operator'} value=${requirement.operator} onChange=${e => updateRequirement(requirement.id, { operator: e.target.value })}>${keyed(REQUIREMENT_OPERATORS.map(([id, label]) => html`<option value=${id}>${label}</option>`))}</select></div>
              <div><label class="label" for=${requirement.id + '-amount'}>Amount</label><input id=${requirement.id + '-amount'} type="number" min="1" value=${requirement.amount} onInput=${e => updateRequirement(requirement.id, { amount: e.target.value.replace(/[^0-9]/g, '') })}/></div>
              <div class="wide"><label class="label" for=${requirement.id + '-window'}>Time window</label><select id=${requirement.id + '-window'} value=${requirement.window} onChange=${e => updateRequirement(requirement.id, { window: e.target.value, contributesToStreak: e.target.value === 'day' ? requirement.contributesToStreak : false, purpose: e.target.value === 'day' && requirement.contributesToStreak ? 'consistency' : 'completion' })}>${keyed(REQUIREMENT_WINDOWS.map(([id, label]) => html`<option value=${id}>${label}</option>`))}</select></div>
            </div>
            <div class="field"><${Switch} label="Counts toward daily streak" desc=${requirement.window === 'day' ? 'A day qualifies once this requirement is met.' : 'Streaks are based on daily requirements.'} checked=${Boolean(requirement.contributesToStreak)} onChange=${value => updateRequirement(requirement.id, { contributesToStreak: value, purpose: value ? 'consistency' : 'completion' })}></${Switch}></div>
          </div>`))}</div>` : html`<div class="step-note" style=${{marginTop: '10px'}}><b>Keep it simple by default.</b> Add a requirement for cases such as “at least 313 every day” alongside a larger weekly or monthly target.</div>`}
          <div class="pill-row" style=${{marginTop: '11px'}}><button class="button tonal" onClick=${() => addRequirement('day', '100', true)}>＋ Daily minimum</button><button class="button tonal" onClick=${() => addRequirement('week', '10000', false)}>＋ Weekly target</button><button class="button tonal" onClick=${() => addRequirement('month', '100000', false)}>＋ Monthly target</button></div>
          ${!oneTime ? html`<div class="step-note" style=${{marginTop: '10px'}}><b>Milestone ladder:</b> protect the streak at 11, aim for 100, and keep 313 as the daily ceiling. <button class="button ghost" data-testid="load-milestone-example" style=${{marginTop: '6px', padding: '5px 0'}} onClick=${loadMilestoneLadder}>Load this example →</button></div>` : null}
          <div class="step-note" style=${{marginTop: '11px'}}><b>Same count, multiple checks:</b> a count logged today can advance the day, week, month, and lifetime requirements at the same time.</div>
        </div>
      </div>`;
    }

    function AdvancedRequirementsStep({ draft, update }) {
      const r = draft.rule;
      const cadence = draft.cadence;
      const requirements = draft.requirements || [];
      const streaks = requirements.filter(requirement => requirement.contributesToStreak);
      const checkpoints = requirements.filter(requirement => !requirement.contributesToStreak);
      const setMode = mode => update({ ...draft, rule: { ...r, mode } });
      const updateRequirement = (id, patch) => update({
        ...draft,
        requirements: requirements.map(requirement => requirement.id === id ? { ...requirement, ...patch } : requirement),
      });
      const removeRequirement = id => update({
        ...draft,
        requirements: requirements.filter(requirement => requirement.id !== id),
      });
      const addRequirement = (window, amount, contributesToStreak) => update({
        ...draft,
        requirements: [...requirements, newRequirement(window, amount, contributesToStreak)],
      });
      const loadPattern = pattern => {
        const next = clone(draft);
        if (pattern === 'weekly') {
          next.cadence = { ...next.cadence, kind: 'week' };
          next.rule = { ...next.rule, mode: 'target', target: '10000' };
          next.requirements = [newRequirement('day', '313', true)];
        }
        if (pattern === 'monthly') {
          next.cadence = { ...next.cadence, kind: 'monthly', monthDays: ['1'] };
          next.rule = { ...next.rule, mode: 'target', target: '100000' };
          next.requirements = [newRequirement('day', '100', true), newRequirement('week', '20000', false)];
        }
        if (pattern === 'oneTime') {
          next.cadence = { ...next.cadence, kind: 'oneTime' };
          next.rule = { ...next.rule, mode: 'target', target: '70000' };
          next.requirements = [newRequirement('day', '100', true)];
        }
        update(next);
      };
      const primaryLabel = cadence.kind === 'oneTime' ? 'One-time total' : cadenceSummary(cadence);
      return html`<div class="stack loose">
        <${StepIntro} step=${ADVANCED_STEPS[2]} body="Separate the finish line from the rules that keep the practice on track. Each rule evaluates the same count entries over its own period."></${StepIntro}>
        <div class="advanced-rule-card primary-rule" data-testid="advanced-primary-rule">
          <div class="rule-heading"><div><span class="label">Goal completion</span><b>What completes this goal?</b><p>${primaryLabel}</p></div><span class="tag">Required</span></div>
          <div class="advanced-rule-fields"><div class="wide"><label class="label" for="advanced-completion-rule">Completion rule</label><select id="advanced-completion-rule" value=${r.mode} onChange=${e => setMode(e.target.value)}>
            <option value="target">Reach a target</option><option value="minimum">Do at least</option><option value="stretch">Minimum + target</option><option value="exact">Exact count</option><option value="bounded">Flexible range</option><option value="tracker">Just track</option>
          </select></div></div>
          ${r.mode === 'target' ? html`<div class="field"><${Stepper} label=${cadence.kind === 'oneTime' ? 'Total to reach' : 'Target count'} value=${r.target} quick=${cadence.kind === 'oneTime' ? [1000, 10000, 70000] : [33, 100, 313]} onChange=${value => update({ ...draft, rule: { ...r, target: value } })}></${Stepper}></div>` : null}
          ${r.mode === 'minimum' ? html`<div class="field"><${Stepper} label="Minimum count" value=${r.minimum} quick=${[10, 33, 100]} onChange=${value => update({ ...draft, rule: { ...r, minimum: value } })}></${Stepper}></div>` : null}
          ${r.mode === 'stretch' ? html`<div class="field stack"><${Stepper} label="Minimum count" value=${r.minimum} quick=${[10, 33, 100]} onChange=${value => update({ ...draft, rule: { ...r, minimum: value } })}></${Stepper}><${Stepper} label="Target count" value=${r.target} quick=${[100, 313, 1000]} onChange=${value => update({ ...draft, rule: { ...r, target: value } })}></${Stepper}></div>` : null}
          ${r.mode === 'exact' ? html`<div class="field"><${Stepper} label="Exact count" value=${r.maximum} quick=${[33, 100, 313]} onChange=${value => update({ ...draft, rule: { ...r, maximum: value } })}></${Stepper}></div>` : null}
          ${r.mode === 'bounded' ? html`<div class="field stack"><${Stepper} label="Minimum count" value=${r.minimum} onChange=${value => update({ ...draft, rule: { ...r, minimum: value } })}></${Stepper}><${Stepper} label="Target count" value=${r.target} onChange=${value => update({ ...draft, rule: { ...r, target: value } })}></${Stepper}><${Stepper} label="Maximum count" value=${r.maximum} onChange=${value => update({ ...draft, rule: { ...r, maximum: value } })}></${Stepper}></div>` : null}
          ${r.mode === 'tracker' ? html`<div class="step-note"><b>No finish line.</b> Every count is recorded, while optional rules can still show consistency.</div>` : html`<div class="subtle">This primary rule follows ${primaryLabel.toLowerCase()}.</div>`}
        </div>

        <div class="advanced-rule-card" data-testid="advanced-streak-rules">
          <div class="rule-heading"><div><span class="label">Streak protection</span><b>What keeps the streak going?</b><p>Optional daily rules can qualify a day even when the main goal uses a weekly, monthly, or one-time total.</p></div><span class="tag">Optional</span></div>
          ${streaks.length ? keyed(streaks.map((requirement, index) => html`<div class="advanced-rule-row">
            <div class="row-top"><b>Streak rule ${index + 1}</b><button class="button ghost" onClick=${() => removeRequirement(requirement.id)}>Remove</button></div>
            <div class="advanced-rule-fields"><div><label class="label" for=${requirement.id + '-operator'}>Rule</label><select id=${requirement.id + '-operator'} value=${requirement.operator} onChange=${e => updateRequirement(requirement.id, { operator: e.target.value })}><option value="atLeast">At least</option><option value="exactly">Exactly</option></select></div><div><label class="label" for=${requirement.id + '-amount'}>Count</label><input id=${requirement.id + '-amount'} type="number" min="1" value=${requirement.amount} onInput=${e => updateRequirement(requirement.id, { amount: e.target.value.replace(/[^0-9]/g, '') })}/></div><div class="wide"><div class="rule-period"><span>Every day</span><span class="tag">Streak</span></div></div></div>
            <div class="tiny">The day qualifies once this rule is met.</div>
          </div>`)) : html`<div class="step-note"><b>No streak rule yet.</b> Add one only if missing a daily minimum should break the streak.</div>`}
          <button class="advanced-add" onClick=${() => addRequirement('day', '1', true)}>＋ Add streak requirement</button>
        </div>

        <div class="advanced-rule-card" data-testid="advanced-checkpoints">
          <div class="rule-heading"><div><span class="label">Additional checkpoints</span><b>Need another progress check?</b><p>Use these for weekly or monthly pacing alongside the main goal.</p></div><span class="tag">Optional</span></div>
          ${checkpoints.length ? keyed(checkpoints.map((requirement, index) => html`<div class="advanced-rule-row">
            <div class="row-top"><b>Checkpoint ${index + 1}</b><button class="button ghost" onClick=${() => removeRequirement(requirement.id)}>Remove</button></div>
            <div class="advanced-rule-fields"><div><label class="label" for=${requirement.id + '-operator'}>Rule</label><select id=${requirement.id + '-operator'} value=${requirement.operator} onChange=${e => updateRequirement(requirement.id, { operator: e.target.value })}>${keyed(REQUIREMENT_OPERATORS.map(([id, label]) => html`<option value=${id}>${label}</option>`))}</select></div><div><label class="label" for=${requirement.id + '-amount'}>Count</label><input id=${requirement.id + '-amount'} type="number" min="1" value=${requirement.amount} onInput=${e => updateRequirement(requirement.id, { amount: e.target.value.replace(/[^0-9]/g, '') })}/></div><div class="wide"><label class="label" for=${requirement.id + '-window'}>Evaluation period</label><select id=${requirement.id + '-window'} value=${requirement.window} onChange=${e => updateRequirement(requirement.id, { window: e.target.value })}>${keyed(REQUIREMENT_WINDOWS.filter(([id]) => id !== 'day').map(([id, label]) => html`<option value=${id}>${label}</option>`))}</select></div></div>
          </div>`)) : html`<div class="step-note"><b>One completion rule is enough for most goals.</b> Add a checkpoint when you need pacing, such as 20,000 every week inside a monthly goal.</div>`}
          <div class="advanced-example-row"><button class="advanced-add" style="width: auto; flex: 1" onClick=${() => addRequirement('week', '20000', false)}>＋ Weekly checkpoint</button><button class="advanced-add" style="width: auto; flex: 1" onClick=${() => addRequirement('month', '100000', false)}>＋ Monthly checkpoint</button></div>
        </div>

        <div class="card soft"><span class="label">Start from an example</span><div class="subtle">These are starting points for the advanced cases we expect to support.</div><div class="advanced-example-row">
          <button class="advanced-example" onClick=${() => loadPattern('weekly')}>10,000 weekly<br><span class="tiny">+ 313 daily streak</span></button>
          <button class="advanced-example" onClick=${() => loadPattern('monthly')}>100,000 monthly<br><span class="tiny">+ daily + weekly checks</span></button>
          <button class="advanced-example" onClick=${() => loadPattern('oneTime')}>70,000 one time<br><span class="tiny">+ 100 daily streak</span></button>
        </div></div>
        <div class="step-note"><b>One count, multiple rules:</b> a count entered on the counting screen updates the applicable daily, weekly, monthly, and whole-goal progress together.</div>
      </div>`;
    }
    function SupportStep({ draft, update }) {
      const s = draft.support;
      const setSupport = patch => update({ ...draft, support: { ...s, ...patch } });
      return html`<div class="stack loose">
        <${StepIntro} step=${STEPS[4]} body="Set reminders and the active period here. Progress requirements stay together so the counting screen can explain every rule in one place."></${StepIntro}>
        <div class="card soft">
          <${Switch} label="Reminders" desc="We’ll ask for permission only when you create the goal." checked=${s.reminders} onChange=${reminders => setSupport({ reminders })}></${Switch}>
          ${s.reminders ? html`<div class="field"><span class="label">Remind me</span><div class="pill-row"><button class=${'pill' + (s.reminderType === 'fixed' ? ' selected' : '')} onClick=${() => setSupport({ reminderType: 'fixed' })}>At a fixed time</button><button class=${'pill' + (s.reminderType === 'prayer' ? ' selected' : '')} onClick=${() => setSupport({ reminderType: 'prayer' })}>Around prayers</button><button class=${'pill' + (s.reminderType === 'session' ? ' selected' : '')} onClick=${() => setSupport({ reminderType: 'session' })}>At session start</button></div></div>` : null}
          ${s.reminders && s.reminderType === 'fixed' ? html`<div class="field"><label class="label">Time</label><input type="time" value=${s.fixedTime} onChange=${e => setSupport({ fixedTime: e.target.value })}/></div>` : null}
          ${s.reminders && s.reminderType !== 'fixed' ? html`<div class="field"><${Stepper} label=${s.reminderType === 'prayer' ? 'Minutes around prayer' : 'Minutes before session'} value=${s.offset} quick=${[0, 5, 10, 15]} onChange=${offset => setSupport({ offset })}></${Stepper}></div>` : null}
        </div>
        <div class="card soft"><${Switch} label="Set an active period" desc=${s.duration ? s.durationDays + ' days' : 'Keep this goal ongoing'} checked=${s.duration} onChange=${duration => setSupport({ duration })}></${Switch}>${s.duration ? html`<${Stepper} label="Number of days" value=${s.durationDays} quick=${[7, 30, 40, 100]} onChange=${durationDays => setSupport({ durationDays })}></${Stepper}>` : null}</div>
        <div class="card emphasis"><b>Streaks come from requirements</b><p class="subtle" style=${{margin: '4px 0 0'}}>Open Requirements and mark a daily requirement as “Counts toward daily streak.” This keeps reminders, active periods, and progress rules separate.</p></div>
        <div class="card soft"><label class="label" for="start-date">Start date</label><input id="start-date" type="date" value=${draft.startDate} onChange=${e => update({ ...draft, startDate: e.target.value })}/><div class="subtle" style=${{marginTop: '6px'}}>Useful for seasonal, yearly, or date-based goals.</div></div>
        <div class="step-note"><b>Permission promise:</b> choosing reminders does not interrupt setup. We explain why, then ask after you tap Create goal. Declining still creates the goal without reminders.</div>
      </div>`;
    }

    function PracticeSummary({ dhikr, onChange }) {
      return html`<div class="card soft"><div class="row start"><div class="grow"><span class="label">Practice</span><div class="arabic">${dhikr ? dhikr.arabic : '—'}</div><b>${dhikr ? dhikr.tr : 'No dhikr selected'}</b><div class="subtle">${dhikr ? dhikr.en : 'Choose a remembrance to continue.'}</div></div><button class="button ghost" onClick=${onChange}>Change</button></div></div>`;
    }

    function Review({ draft, dhikr, errors, onEdit, onCreate, saving, saveError }) {
      return html`<div class="review-root"><div class="scroll"><div class="content">
        <${StepIntro} step=${{label: 'Review', title: 'Review your goal'}} body="Read the contract before saving. Every row is editable, and nothing important is hidden behind the Create button."></${StepIntro}>
        <div class="contract"><div class="contract-label">This creates</div><strong>${contractText(draft, dhikr)}</strong><small>Start: ${draft.startDate} · ${additionalRequirementsSummary(draft.requirements)} · ${supportSummary(draft.support, draft.timing)}</small></div>
        ${saveError ? html`<div class="card error" role="alert"><b>We couldn’t save this goal.</b><p class="subtle" style=${{margin: '4px 0 10px'}}>Your draft is safe. Check again or retry when ready.</p><button class="button danger" onClick=${onCreate}>Retry create</button></div>` : null}
        ${errors.length ? html`<div class="card error" role="alert" aria-live="polite"><b>${errors.length} item${errors.length === 1 ? '' : 's'} need attention</b><div class="error-list" style=${{marginTop: '10px'}}>${keyed(errors.map((e, i) => html`<button class="error-item" onClick=${() => onEdit(e.step)}>${e.message}<span>${e.detail} · Fix now →</span></button>`))}</div></div>` : null}
        <div class="card"><${PracticeSummary} dhikr=${dhikr} onChange=${() => onEdit('practice')}></${PracticeSummary}><div class="review-row"><div class="icon">↻</div><div class="value"><b>Schedule</b><span>${cadenceSummary(draft.cadence)}</span></div><button onClick=${() => onEdit('cadence')}>Edit</button></div><div class="review-row"><div class="icon">◷</div><div class="value"><b>Practice times</b><span>${timingSummary(draft.timing)}</span></div><button onClick=${() => onEdit('timing')}>Edit</button></div><div class="review-row"><div class="icon">✓</div><div class="value"><b>Requirements</b><span>${requirementsSummary(draft)}</span></div><button onClick=${() => onEdit('success')}>Edit</button></div><div class="review-row"><div class="icon">⌁</div><div class="value"><b>Support</b><span>${supportSummary(draft.support, draft.timing)}</span></div><button onClick=${() => onEdit('support')}>Edit</button></div></div>
      </div></div><div class="bottom-bar"><button class="button primary full" disabled=${saving} onClick=${onCreate}>${saving ? 'Saving…' : errors.length ? 'Review ' + errors.length + ' item' + (errors.length === 1 ? '' : 's') : 'Create goal'}</button></div></div>`;
    }

    function StepBody({ id, draft, update }) {
      if (id === 'intent') return html`<${IntentStep} draft=${draft} update=${update}></${IntentStep}>`;
      if (id === 'cadence') return html`<${CadenceStep} draft=${draft} update=${update}></${CadenceStep}>`;
      if (id === 'timing') return html`<${TimingStep} draft=${draft} update=${update}></${TimingStep}>`;
      if (id === 'success') return html`<${SuccessStep} draft=${draft} update=${update}></${SuccessStep}>`;
      return html`<${SupportStep} draft=${draft} update=${update}></${SupportStep}>`;
    }

    function Guided({ draft, update, index, setIndex, onReview }) {
      const step = STEPS[index];
      const hasNextErrors = false;
      return html`<div class="guided-root"><div class="scroll"><div class="content">
        <${StepProgress} index=${index}></${StepProgress}>
        <${StepBody} id=${step.id} draft=${draft} update=${update}></${StepBody}>

        const percent = requirement.operator === 'atMost' ? (met ? 100 : Math.max(0, Math.min(100, target / Math.max(current, 1) * 100))) : Math.max(0, Math.min(100, current / Math.max(target, 1) * 100));
        return { current, target, met, remaining, percent };
      };

      const primaryStatus = tracker ? { current: progress.day, target: 0, met: true, remaining: 'All counts recorded', percent: 0 } : statusFor(primary);
      const primaryWindow = tracker ? 'day' : primary.window;
      const primaryTarget = tracker ? 'Tracked' : 'of ' + fmt(primaryStatus.target);
      const dailyDescription = draft.cadence.kind === 'oneTime' ? 'Build your total at your own pace.' : 'Every count contributes to this goal.';
      const dailyMilestones = requirements.filter(requirement => requirement.window === 'day').sort((a, b) => {
        const order = requirement => requirement.operator === 'atMost' ? 2 : requirement.contributesToStreak ? 0 : 1;
        return order(a) - order(b) || Number(a.amount) - Number(b.amount);
      });
      const achievedMilestones = dailyMilestones.filter(requirement => milestoneState(requirement, statusFor(requirement)).reached).length;
      const completionMilestones = dailyMilestones.filter(requirement => requirement.operator !== 'atMost').length;
      const lastAchievedIndex = dailyMilestones.reduce((latest, requirement, index) => milestoneState(requirement, statusFor(requirement)).reached ? index : latest, -1);
      const timelineFill = lastAchievedIndex < 0 ? 0 : (lastAchievedIndex / Math.max(dailyMilestones.length - 1, 1)) * 100;
      const selectedIndex = dailyMilestones.length ? Math.min(selectedMilestone, dailyMilestones.length - 1) : 0;
      const selectedRequirement = dailyMilestones[selectedIndex];
      const selectedStatus = selectedRequirement ? statusFor(selectedRequirement) : null;

      const addManualCount = () => addCount(entry);
      return html`<div class="scroll goal-count-screen" data-testid="counting-screen"><div class="goal-count-content">

        <div class="count-action-row">

          <button class=${'count-icon-button' + (timerOn ? ' active' : '')} aria-label="Timer" aria-pressed=${timerOn} onClick=${() => setTimerOn(!timerOn)}>⏱</button>

        </div>
        ${dailyMilestones.length > 1 ? html`<div class="milestone-panel" data-testid="milestone-rail" role="region" aria-label="Today's milestones">
          <div class="milestone-heading"><div><span class="label">Today’s milestones</span><b>One count, multiple clear milestones</b></div><span class="milestone-summary">${completionMilestones ? achievedMilestones + '/' + completionMilestones + ' achieved' : 'Limits visible'}</span></div>

            <span class="milestone-dot">${state.reached ? '✓' : index + 1}</span><span class="milestone-amount">${fmt(status.target)}</span><span class="milestone-label">${milestoneShortLabel(requirement)}</span>
          </button>`; }))}</div>
          ${selectedRequirement ? html`<div class=${'milestone-selected ' + selectedMeta.tone} data-testid="selected-milestone"><span class="milestone-selected-label">${selectedMeta.label} · ${selectedRequirement.operator === 'atMost' ? 'up to' : 'at least'} ${fmt(selectedStatus.target)}</span><strong>${selectedState.label}</strong><span>${fmt(selectedStatus.current)} today</span></div>` : null}
          <div class="milestone-note">${keyed(dailyMilestones.map(requirement => html`<span>${fmt(requirement.amount)} ${milestoneShortLabel(requirement)}</span>`))}</div>
        </div>` : null}
        <div class="count-shortcuts"><button onClick=${() => addCount(33)}>+33</button><button onClick=${() => addCount(100)}>+100</button><button onClick=${() => addCount(313)}>+313</button><button onClick=${() => addCount(1000)}>+1,000</button></div>
        ${audioOn ? html`<div class="step-note" style=${{margin: '0 0 11px', textAlign: 'left'}}><b>Audio count is on.</b> The next spoken repetition can be captured without touching the ring.</div>` : null}
        ${timerOn ? html`<div class="step-note" style=${{margin: '0 0 11px', textAlign: 'left'}}><b>Timer ready.</b> Start a focused session from the timer control.</div>` : null}
        <div class="count-details">
          <button class="count-details-toggle" data-testid="toggle-progress-details" onClick=${() => setDetailsOpen(!detailsOpen)}>
            <div><b>Progress details</b><div><span>${tracker ? 'Tracking mode · no completion target' : requirements.length + ' active requirement' + (requirements.length === 1 ? '' : 's') + ' · ' + windowLabel(primaryWindow)}</span></div></div>
            <span>${detailsOpen ? 'Hide ↑' : 'View ↓'}</span>

            <div class="card emphasis"><b>One log, multiple updates</b><p class="subtle" style=${{margin: '4px 0 0'}}>A single tap or logged count updates every applicable requirement. Daily minimums can qualify the streak while weekly, monthly, or whole-goal totals keep accumulating.</p></div>

              <div class="status-line"><span class="status-title">${requirement.id === 'primary' ? 'Primary goal' : requirement.contributesToStreak ? 'Daily minimum' : requirement.operator === 'atMost' ? 'Daily ceiling' : 'Additional requirement'}</span><span class=${'status-chip' + (withinLimit ? ' met' : '')}>${chipText}</span></div>
              <div class="subtle" style=${{marginTop: '3px'}}>${operatorLabel(requirement.operator)} ${fmt(status.target)} · ${windowLabel(requirement.window)}${requirement.contributesToStreak ? ' · streak' : ''}</div>
              <div class="status-value">${fmt(status.current)} <span>/ ${fmt(status.target)}</span></div>
              <div class="requirement-bar" role="progressbar" aria-label=${requirementSummary(requirement)} aria-valuemin="0" aria-valuemax=${status.target} aria-valuenow=${Math.min(status.current, status.target)}><i style=${{width: status.percent + '%'}}></i></div>
              <div class="status-foot"><span>${status.remaining}</span>${requirement.contributesToStreak ? html`<span>${status.met ? '✓ Streak day qualifies' : 'Day not qualified yet'}</span>` : html`<span>${windowLabel(requirement.window)}</span>`}</div>
            </div>`; }) ) : html`<div class="card soft"><b>Tracker mode</b><p class="subtle" style=${{margin: '4px 0 0'}}>Every count is recorded. There is no completion requirement to satisfy.</p></div>`}</div>
            <div class="count-manual"><div><label class="label" for="count-entry">Add larger count</label><input id="count-entry" type="number" min="1" value=${entry} onInput=${e => setEntry(e.target.value.replace(/[^0-9]/g, ''))}/></div><button class="button" data-testid="log-count" onClick=${addManualCount}>Log count</button></div>

        <button class="button ghost full" style=${{marginTop: '10px'}} onClick=${onBackToGoal}>← Back to goal</button>

    function SuccessScreen({ draft, dhikr, onAgain, onDone, onCounting }) {

    function App() {
      const initialVariant = new URLSearchParams(location.search).get('variant') || 'guided';
      const initialDemo = new URLSearchParams(location.search).get('demo') === 'milestones';
      const initialReset = new URLSearchParams(location.search).get('reset') === '1';
      const saved = useMemo(() => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (_) { return null; } }, []);
      const [variant, setVariant] = useState(VARIANTS.some(v => v.id === initialVariant) ? initialVariant : 'guided');
      const [view, setView] = useState(initialDemo ? 'counting' : initialReset ? 'picker' : saved?.view || 'picker');
      const [returnTo, setReturnTo] = useState(VARIANTS.some(v => v.id === initialVariant) ? initialVariant : 'guided');
      const [dhikr, setDhikr] = useState(initialDemo ? LIBRARY[0] : initialReset ? null : saved?.dhikr || null);
      const [library, setLibrary] = useState(LIBRARY);
      const [query, setQuery] = useState('');
      const [draft, setDraft] = useState(initialDemo ? milestoneExampleDraft() : initialReset ? initialDraft() : saved?.draft || initialDraft());
      const [index, setIndex] = useState(initialReset ? 0 : saved?.index || 0);

      const [active, setActive] = useState(null);
      const [saving, setSaving] = useState(false);
      const [saveError, setSaveError] = useState(false);
      const [permissionOpen, setPermissionOpen] = useState(false);
      const [discardOpen, setDiscardOpen] = useState(false);
      const [simulateFailure, setSimulateFailure] = useState(false);
      const [toast, setToast] = useState(initialDemo ? '' : saved ? 'Autosaved draft restored.' : '');
      const toastTimer = useRef(null);
      const errors = useMemo(() => validate(draft, dhikr), [draft, dhikr]);
      const hasWork = Boolean(dhikr) && (view !== 'picker' || JSON.stringify(draft) !== JSON.stringify(initialDraft()));

      const notify = message => { setToast(message); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(''), 3000); };
      const update = next => { setDraft(next); setSaveError(false); };
      useEffect(() => {
        if (initialDemo || !dhikr || view === 'success') return;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ dhikr, draft, view, index })); } catch (_) {}
      }, [dhikr, draft, view, index]);
      useEffect(() => () => clearTimeout(toastTimer.current), []);
      useEffect(() => {
        const onKey = e => { if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return; if (e.key === 'ArrowLeft') cycleVariant(-1); if (e.key === 'ArrowRight') cycleVariant(1); };
        window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey);
      });

      function cycleVariant(delta) {
        const current = VARIANTS.findIndex(v => v.id === variant);
        const next = VARIANTS[(current + delta + VARIANTS.length) % VARIANTS.length].id;
        setVariant(next); if (view === 'picker' && !dhikr) setReturnTo(next); history.replaceState(null, '', '?variant=' + next); notify('Switched to ' + VARIANTS.find(v => v.id === next).name + '.');

      function startChange() { setReturnTo(view === 'review' ? 'review' : variant); setView('picker'); setQuery(''); }
      function back() {
        if (view === 'picker') { if (returnTo !== 'picker' && dhikr) { setView(returnTo); return; } notify('Nothing saved — left goal creation.'); return; }
        if (view === 'review') { setView(variant); return; }

        if (hasWork) { setDiscardOpen(true); return; }
        setView('picker');

      function chooseReview() { setView('review'); setSaveError(false); }

      const title = view === 'picker' ? 'New goal' : view === 'review' ? 'Review goal' : view === 'success' ? 'Goal created' : view === 'counting' ? (dhikr ? dhikr.tr : 'Your goal') : variantLabel;

                ? React.createElement(Adaptive, { draft, dhikr, update, open, setOpen, onReview: chooseReview })

      return html`<div>
