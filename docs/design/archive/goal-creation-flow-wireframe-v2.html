<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Awrad — Goal creation flow v2 wireframe</title>
  <link rel="icon" href="data:," />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
  <style>
    :root {
      --bg: #ebe8e0;
      --paper: #fffefa;
      --paper-2: #f5f2eb;
      --paper-3: #efebe2;
      --ink: #203029;
      --muted: #68746d;
      --line: #d9d6cc;
      --primary: #1d6b4f;
      --primary-soft: #dceee5;
      --primary-deep: #124b35;
      --warning: #876016;
      --warning-soft: #fff2c9;
      --danger: #b33c33;
      --danger-soft: #fce8e5;
      --success: #1d6b4f;
      --shadow: 0 20px 56px rgba(32, 48, 41, .16);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(29, 107, 79, .28);
      outline-offset: 2px;
    }
    .stage {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 28px;
      padding: 28px 28px 104px;
      min-height: 100vh;
    }
    .phone {
      width: 394px;
      min-width: 394px;
      padding: 8px;
      border: 1px solid #c9c5b8;
      border-radius: 42px;
      background: #dedbd2;
      box-shadow: var(--shadow);
    }
    .phone-screen {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 800px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 34px;
      background: var(--paper);
    }
    .status {
      display: flex;
      justify-content: space-between;
      padding: 8px 18px 5px;
      font-size: 11px;
      font-weight: 700;
      background: var(--paper);
    }
    .appbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      z-index: 4;
    }
    .appbar .back {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      color: var(--ink);
      background: var(--paper-2);
      font-size: 19px;
    }
    .appbar h2 {
      flex: 1;
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
    }
    .appbar .status-pill {
      color: var(--primary);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .appbar.counting {
      align-items: flex-start;
      padding: 13px 13px 11px;
      border-bottom: 0;
      background: #f1f4f1;
    }
    .appbar.counting .back { margin-top: 4px; color: #18231e; background: transparent; font-size: 32px; font-weight: 300; }
    .appbar.counting h2 { overflow: hidden; font-size: 18px; line-height: 1.1; text-overflow: ellipsis; white-space: nowrap; }
    .appbar.counting .count-title { flex: 1; min-width: 0; }
    .appbar.counting .count-pill { display: inline-flex; margin-top: 6px; padding: 5px 12px; border-radius: 18px; color: #2d7a58; background: #cfeedd; font-size: 12px; font-weight: 800; }
    .appbar.counting .count-actions { display: flex; align-items: center; gap: 8px; margin-left: 8px; }
    .appbar.counting .count-action { display: grid; place-items: center; width: 43px; height: 43px; border: 0; border-radius: 14px; color: #073c26; background: #cfeedd; font-size: 21px; font-weight: 850; }
    .appbar.counting .count-action.menu { width: 26px; color: #17241d; background: transparent; font-size: 25px; }
    .scroll {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .scroll::-webkit-scrollbar { width: 0; }
    .content {
      padding: 16px 16px 118px;
    }
    .content.compact { padding: 14px 14px 116px; }
    .kicker {
      margin-bottom: 4px;
      color: var(--primary);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1, h3, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-size: 24px; line-height: 1.15; }
    h3 { margin-bottom: 4px; font-size: 17px; line-height: 1.2; }
    .lede { margin-bottom: 18px; color: var(--muted); line-height: 1.55; }
    .subtle { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .tiny { color: var(--muted); font-size: 11px; }
    .card {
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--paper);
    }
    .card.soft { background: var(--paper-2); }
    .card.emphasis {

    }
    .card.warning { border-color: #e8cc82; background: var(--warning-soft); }
    .card.error { border-color: #e7ada8; background: var(--danger-soft); }
    .row { display: flex; align-items: center; gap: 10px; }
    .row.start { align-items: flex-start; }
    .row.between { justify-content: space-between; }
    .grow { flex: 1; min-width: 0; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .stack.tight { gap: 5px; }
    .stack.loose { gap: 16px; }
    .label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .field { margin-top: 10px; }
    input[type="text"], input[type="number"], input[type="date"], input[type="time"], select {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: var(--paper);
    }
    input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--danger); background: #fff8f7; }
    .button {
      min-height: 42px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: var(--paper);
      font-weight: 750;
    }
    .button:hover { border-color: var(--primary); }
    .button.primary { border-color: var(--primary); color: white; background: var(--primary); }
    .button.primary:hover { background: var(--primary-deep); }
    .button.tonal { border-color: transparent; color: var(--primary-deep); background: var(--primary-soft); }
    .button.ghost { border-color: transparent; color: var(--primary); background: transparent; }
    .button.danger { border-color: transparent; color: var(--danger); background: var(--danger-soft); }
    .button:disabled { cursor: not-allowed; opacity: .55; }
    .full { width: 100%; }
    .picker-search { margin: 14px 0 12px; }
    .dhikr {
      width: 100%;
      margin-bottom: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--ink);
      text-align: left;
      background: var(--paper);
    }
    .dhikr:hover { border-color: var(--primary); }
    .arabic { font-size: 20px; line-height: 1.35; }
    .dhikr .english { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .tag {
      display: inline-flex;
      margin-top: 7px;
      padding: 3px 7px;
      border-radius: 9px;
      color: var(--primary-deep);
      background: var(--primary-soft);
      font-size: 10px;
      font-weight: 800;
    }
    .progress {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      margin: 2px 0 18px;
    }
    .progress span { height: 4px; border-radius: 10px; background: var(--paper-3); }
    .progress span.done, .progress span.current { background: var(--primary); }
    .step-note {
      margin: 12px 0 14px;
      padding: 10px 12px;
      border-left: 3px solid var(--primary);
      border-radius: 10px;
      color: var(--primary-deep);
      background: var(--primary-soft);
      font-size: 12px;
      line-height: 1.5;
    }
    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .choice {
      position: relative;
      min-height: 94px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--ink);
      text-align: left;
      background: var(--paper);
    }
    .choice:hover { border-color: var(--primary); }
    .choice.selected { border: 2px solid var(--primary); padding: 11px; background: var(--primary-soft); }
    .choice .check { position: absolute; top: 9px; right: 9px; color: var(--primary); font-weight: 900; }
    .choice .title { display: block; padding-right: 16px; font-weight: 800; }
    .choice .desc { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .choice .example { display: inline-block; margin-top: 8px; color: var(--primary); font-size: 10px; font-weight: 800; }
    .choice.full-choice { grid-column: 1 / -1; min-height: auto; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .pill {
      min-height: 34px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 99px;
      color: var(--ink);
      background: var(--paper);
      font-size: 12px;
      font-weight: 750;
    }
    .pill.selected { border-color: var(--primary); color: white; background: var(--primary); }
    .stepper { display: flex; align-items: stretch; gap: 5px; }
    .stepper button { width: 42px; border: 1px solid var(--line); border-radius: 11px; color: var(--primary); background: var(--paper-2); font-size: 20px; font-weight: 800; }
    .stepper input { min-width: 0; text-align: center; font-weight: 800; }
    .rule-list { display: flex; flex-direction: column; gap: 8px; }
    .rule {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--ink);
      text-align: left;
      background: var(--paper);
    }
    .rule.selected { border-color: var(--primary); background: var(--primary-soft); }
    .radio { width: 18px; height: 18px; margin-top: 1px; border: 2px solid var(--line); border-radius: 50%; }
    .rule.selected .radio { border: 5px solid var(--primary); }
    .rule .rtitle { font-weight: 800; }
    .rule .rdesc { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .requirement-list { display: flex; flex-direction: column; gap: 8px; }
    .requirement-card { padding: 11px; border: 1px solid var(--line); border-radius: 13px; background: var(--paper); }
    .requirement-card .requirement-name { font-size: 12px; font-weight: 800; }
    .requirement-card .requirement-summary { margin-top: 2px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .requirement-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .requirement-grid .wide { grid-column: 1 / -1; }
    .requirement-status { padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
    .requirement-status.met { border-color: rgba(29, 107, 79, .35); background: var(--primary-soft); }
    .requirement-status .status-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .requirement-status .status-title { font-size: 12px; font-weight: 850; }
    .status-chip { display: inline-flex; padding: 3px 7px; border-radius: 9px; color: var(--warning); background: var(--warning-soft); font-size: 10px; font-weight: 850; }
    .status-chip.met { color: var(--primary-deep); background: white; }
    .requirement-status .status-value { margin-top: 7px; font-size: 18px; font-weight: 850; }
    .requirement-status .status-value span { color: var(--muted); font-size: 11px; font-weight: 600; }
    .requirement-bar { height: 6px; margin-top: 9px; overflow: hidden; border-radius: 10px; background: var(--paper-3); }
    .requirement-bar i { display: block; height: 100%; border-radius: inherit; background: var(--primary); }
    .requirement-status .status-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 7px; color: var(--muted); font-size: 10px; }
    .count-hero { margin-bottom: 12px; padding: 16px; border-radius: 17px; color: white; background: var(--primary-deep); }
    .count-hero .label { color: #cce5d8; }
    .count-hero strong { display: block; margin: 2px 0 12px; font-size: 34px; line-height: 1; }
    .count-hero .subtle { color: #cce5d8; }
    .count-entry { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
    .count-entry .button { min-width: 106px; color: var(--primary-deep); background: white; }
    .count-quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .count-quick button { padding: 5px 8px; border: 1px solid rgba(255,255,255,.3); border-radius: 9px; color: white; background: transparent; font-size: 11px; font-weight: 800; }
    .counting-header { margin-bottom: 12px; }
    .counting-header h1 { margin-bottom: 5px; }
    .counting-header .lede { margin-bottom: 0; }
    .goal-count-screen { background: #f1f4f1; }
    .goal-count-content { min-height: 100%; padding: 6px 18px 36px; text-align: center; }
    .arabic-hero { display: grid; place-items: center; min-height: 92px; margin: 2px 0 14px; padding: 15px 18px; border-radius: 22px; color: #111a15; background: white; font-family: serif; font-size: 28px; line-height: 1.5; }
    .count-action-row { display: grid; grid-template-columns: minmax(0, 1fr) 58px 58px; gap: 8px; margin-bottom: 15px; }
    .audio-count-button { min-height: 62px; border: 0; border-radius: 30px; color: white; background: #3c865f; font-size: 16px; font-weight: 750; box-shadow: 0 5px 0 rgba(23, 88, 56, .12); }
    .audio-count-button.active { background: #1f6845; }
    .count-icon-button { display: grid; place-items: center; min-height: 62px; border: 0; border-radius: 22px; color: #073c26; background: #cfeedd; font-size: 23px; font-weight: 800; }
    .count-icon-button.active { color: white; background: #3c865f; }
    .count-ring-wrap { display: flex; flex-direction: column; align-items: center; margin: 28px 0 18px; }
    .count-ring { --ring-progress: 22%; position: relative; display: grid; place-items: center; width: 275px; height: 275px; padding: 17px; border: 0; border-radius: 50%; background: conic-gradient(#efa900 0 var(--ring-progress), #e1e5e2 var(--ring-progress) 100%); box-shadow: 0 0 0 7px #eef1ef, 0 0 0 15px #e4e8e5; }
    .count-ring::after { position: absolute; inset: 10px; border: 2px solid rgba(255,255,255,.75); border-radius: 50%; content: ''; pointer-events: none; }
    .count-ring .ring-inner { display: grid; place-items: center; align-content: center; width: 100%; height: 100%; border-radius: 50%; background: #d7eee1; }
    .count-ring .ring-current { display: block; color: #004d2c; font-size: 58px; font-weight: 850; line-height: .95; }
    .count-ring .ring-target { display: block; margin-top: 12px; color: #656b68; font-size: 24px; font-weight: 750; }
    .count-hint { margin-top: 19px; color: #656b68; font-size: 15px; }
    .count-shortcuts { display: flex; justify-content: center; flex-wrap: wrap; gap: 7px; margin: 20px 0 16px; }
    .count-shortcuts button { min-height: 36px; padding: 6px 13px; border: 1px solid #cdd9d1; border-radius: 18px; color: #236d4b; background: #e2f2e8; font-size: 12px; font-weight: 800; }
    .count-details { margin-top: 10px; text-align: left; }
    .count-details-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 14px 15px; border: 1px solid #d6dfd9; border-radius: 16px; color: #18372a; background: white; text-align: left; }
    .count-details-toggle b { font-size: 13px; }
    .count-details-toggle span { color: #648071; font-size: 11px; }
    .count-details-body { margin-top: 8px; }
    .count-details-body .requirement-status { background: white; }
    .count-details-body .card.emphasis { text-align: left; }
    .count-manual { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; margin-top: 11px; padding: 11px; border-radius: 15px; background: white; text-align: left; }
    .count-manual .button { min-height: 42px; color: white; background: #3c865f; }
    .milestone-panel { margin: 4px 0 16px; padding: 13px 13px 11px; border: 1px solid #d6dfd9; border-radius: 18px; background: rgba(255,255,255,.86); text-align: left; }
    .milestone-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .milestone-heading .label { margin-bottom: 3px; color: #3c865f; }
    .milestone-heading b { display: block; font-size: 13px; line-height: 1.25; }
    .milestone-summary { flex: none; padding: 5px 8px; border-radius: 10px; color: #2d7a58; background: #e2f2e8; font-size: 10px; font-weight: 850; }
    .milestone-timeline { position: relative; display: grid; gap: 4px; margin: 17px 0 10px; }
    .milestone-timeline::before, .milestone-timeline::after { position: absolute; top: 10px; right: 16.5%; left: 16.5%; height: 3px; border-radius: 99px; content: ''; }
    .milestone-timeline::before { background: #e0e8e2; }
    .milestone-timeline::after { right: auto; width: var(--milestone-fill, 0%); background: #3c865f; }
    .milestone-node-button { position: relative; z-index: 1; display: flex; min-width: 0; flex-direction: column; align-items: center; padding: 0 2px; border: 0; color: #6b7971; background: transparent; text-align: center; }
    .milestone-node-button:focus-visible { outline-offset: 3px; }
    .milestone-node-button.selected .milestone-dot { box-shadow: 0 0 0 4px rgba(60, 134, 95, .12); }
    .milestone-dot { display: grid; place-items: center; width: 22px; height: 22px; border: 2px solid #c8d8ce; border-radius: 50%; color: #6d7b73; background: #f7faf8; font-size: 10px; font-weight: 900; }
    .milestone-node-button.complete .milestone-dot { border-color: #3c865f; color: white; background: #3c865f; }
    .milestone-node-button.limit .milestone-dot { border-color: #e6a700; color: #8b6300; background: #fff8df; }
    .milestone-amount { display: block; margin-top: 6px; color: #263a30; font-size: 12px; font-weight: 900; }
    .milestone-label { display: block; max-width: 88px; margin-top: 1px; overflow: hidden; color: #718078; font-size: 9px; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
    .milestone-selected { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-height: 26px; padding: 7px 9px; border-radius: 11px; background: #f1f7f3; }
    .milestone-selected-label { color: #526a5d; font-size: 10px; font-weight: 800; }
    .milestone-selected strong { color: #2d7a58; font-size: 11px; }
    .milestone-selected span:last-child { color: #718078; font-size: 10px; }
    .milestone-selected.limit { background: #fff8df; }
    .milestone-selected.limit strong { color: #8b6300; }
    .milestone-note { display: flex; justify-content: space-between; gap: 5px; margin-top: 10px; color: #718078; font-size: 9px; line-height: 1.35; }
    .divider { height: 1px; margin: 14px 0; background: var(--line); }

    .switch.on i { left: 22px; }

    .session-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .session-grid .wide { grid-column: 1 / -1; }

    .error-list { display: flex; flex-direction: column; gap: 7px; margin: 0 0 12px; }
    .error-item { width: 100%; padding: 9px 10px; border: 1px solid #e7ada8; border-radius: 11px; color: var(--danger); text-align: left; background: var(--danger-soft); font-size: 12px; font-weight: 750; }
    .error-item span { display: block; margin-top: 2px; color: #8d332c; font-size: 11px; font-weight: 500; }

    .review-row .value span { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .review-row button { border: 0; color: var(--primary); background: transparent; font-size: 12px; font-weight: 800; }
    .contract {
      position: sticky;
      top: 0;
      z-index: 2;
      margin: -2px -2px 14px;
      padding: 13px 14px;
      border: 1px solid rgba(29, 107, 79, .3);
      border-radius: 16px;
      color: var(--primary-deep);
      background: var(--primary-soft);
    }
    .contract .contract-label { margin-bottom: 4px; font-size: 10px; font-weight: 900; letter-spacing: .11em; text-transform: uppercase; }
    .contract strong { display: block; color: var(--ink); font-size: 15px; line-height: 1.4; }
    .contract small { display: block; margin-top: 5px; color: var(--primary-deep); font-size: 11px; }

      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 3;
      padding: 10px 14px 14px;
