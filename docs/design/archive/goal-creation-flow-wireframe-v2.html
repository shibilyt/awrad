              ${screen}
              ${toast ? html`<div class="toast" style=${{position: 'absolute', left: '14px', right: '14px', bottom: '83px', zIndex: 8, padding: '10px 12px', borderRadius: '12px', color: 'white', background: '#26332d', fontSize: '12px', fontWeight: 700}} role="status">${toast}</div>` : null}
              ${discardOpen ? html`<div class="modal-layer"><div class="modal" role="alertdialog" aria-modal="true"><h3>Leave this goal?</h3><p>Your draft is autosaved, but it has not been created yet. Keep it for later or leave without saving?</p><div class="actions"><button class="button primary" onClick=${() => setDiscardOpen(false)}>Keep editing</button><button class="button danger" onClick=${() => { setDiscardOpen(false); setView('picker'); setDhikr(null); notify('Draft kept for later.'); }}>Leave — keep draft</button><button class="button ghost" onClick=${() => { setDiscardOpen(false); reset(); }}>Discard draft</button></div></div></div>` : null}
              ${permissionOpen ? html`<div class="modal-layer"><div class="modal" role="dialog" aria-modal="true"><h3>Allow reminders for this goal?</h3><p>This goal will remind you ${draft.support.reminderType === 'fixed' ? 'at ' + draft.support.fixedTime : draft.support.reminderType === 'prayer' ? 'around your selected prayers' : 'at the start of each session'}. You can change this later. We ask now because you chose reminders — never while you were making decisions.</p><div class="actions"><button class="button primary" onClick=${saveGoal}>Allow reminders &amp; create</button><button class="button tonal" onClick=${createWithoutReminders}>Create without reminders</button><button class="button ghost" onClick=${() => setPermissionOpen(false)}>Not now — keep editing</button></div></div></div>` : null}
            </div>
          </div>
          <aside class="aside">
            <div class="kicker">UX review · prototype v2</div>
            <h1>Turn configuration into a goal contract.</h1>
            <p class="lede">The native flow has a capable domain model, but its Advanced screen makes users understand recurrence, slots, counting rules, reminders, duration, and streaks at once. This wireframe tests a calmer decision order.</p>
            <div class="aside-card"><h3>The core change</h3><p>Guide the user through the mental model: <b>goal type → schedule → practice times → requirements → support → review → count</b>. The advanced capability stays; the cognitive load moves later.</p><div class="flow"><b>Goal type</b><i>→</i><b>Schedule</b><i>→</i><b>Practice times</b><i>→</i><b>Requirements</b><i>→</i><b>Support</b><i>→</i><b>Review</b><i>→</i><b>Count</b></div></div>
            <div class="aside-card"><h3>Current gaps → fixes</h3>
              <div class="gap"><div class="gap-num">1</div><div><strong>“Advanced” is a catch-all</strong><span>Replace it with goal types: daily habit, around prayers, sessions, reach a total, tracker, custom.</span></div></div>
              <div class="gap"><div class="gap-num">2</div><div><strong>Schedule and practice times are separate</strong><span>Offer One time alongside recurring schedules, then show daily streak consistency as its own rule.</span></div></div>
              <div class="gap"><div class="gap-num">3</div><div><strong>Powerful count rules arrive too early</strong><span>Show target / minimum / tracker first. Put stretch, exact, and range under More control.</span></div></div>
              <div class="gap"><div class="gap-num">4</div><div><strong>Defaults can change meaning silently</strong><span>Surface the contract and explain slot creation whenever timing changes.</span></div></div>
              <div class="gap"><div class="gap-num">5</div><div><strong>No true review or recovery state</strong><span>Review lists every invalid decision, maps each error back to its step, and supports retry without losing the draft.</span></div></div>
              <div class="gap"><div class="gap-num">6</div><div><strong>Complex goals disappear after creation</strong><span>Counting shows every daily, weekly, monthly, or lifetime requirement from one shared count entry.</span></div></div>
            </div>
            <div class="aside-card"><h3>Try these paths</h3><div class="test-row"><input type="checkbox" /> Choose a weekly target → Requirements → add a daily minimum → Review.</div><div class="test-row"><input type="checkbox" /> Create the goal → Open counting screen → log +313 → inspect every requirement.</div><div class="test-row"><input type="checkbox" /> Select “Practice around prayers” → turn off all prayers → Review goal.</div><div class="test-row"><input type="checkbox" /> Choose “Flexible range” → set minimum above maximum.</div><div class="test-row"><input type="checkbox" /> Choose “Custom windows” → make two sessions overlap.</div><div class="test-row"><input type="checkbox" /> Turn on reminders → Create goal → decline reminders.</div><div class="test-row"><input type="checkbox" /> Use the toolbar to simulate a save failure, then retry.</div></div>
            <div class="aside-card"><h3>Prototype controls</h3><p>Use the bottom switcher to compare four interaction models. The URL is shareable with <code>?variant=advanced</code>, <code>?variant=guided</code>, <code>?variant=adaptive</code>, or <code>?variant=power</code>.</p><p class="subtle"><a href="?variant=advanced&amp;reset=1">Open the advanced builder</a> · <a href="?variant=power&amp;demo=milestones">Open the milestone ladder example</a> · 11 streak minimum, 100 daily target, 313 daily ceiling.</p><div class="toolbar"><button class="button" onClick=${reset}>↺ Reset demo</button><button class="button" onClick=${restore} disabled=${!saved}>Restore saved draft</button><button class=${'button ' + (simulateFailure ? 'danger' : '')} onClick=${() => setSimulateFailure(!simulateFailure)}>${simulateFailure ? '✓ Failure on' : 'Test save failure'}</button></div></div>
            <div class="aside-card"><h3>Scope note</h3><p>React is loaded from a CDN so this remains a single reviewable HTML file. It is intentionally a wireframe: the native Android domain remains the source of truth for schedules, requirements, prayer slots, reminders, validation, persistence, and counting.</p></div>
          </aside>
        </div>
        <div class="variant-switcher" aria-label="Flow variant switcher"><button aria-label="Previous variant" onClick=${() => cycleVariant(-1)}>←</button><b>${variantLabel}</b><span class="tiny" style=${{color: '#b9c6bf'}}>${VARIANTS.find(v => v.id === variant).hint}</span><button aria-label="Next variant" onClick=${() => cycleVariant(1)}>→</button></div>
      </div>`;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
