<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Awrad — Improved Goal Creation Flow (Wireframe)</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<style>
  :root{
    --bg:#ece7db; --paper:#fffdf7; --paper2:#f4efe3; --ink:#24312b; --muted:#6c756f;
    --primary:#1f6f50; --primary-soft:#dcefe4; --primary-deep:#155237;
    --danger:#b3372e; --danger-soft:#fbe7e4; --border:#e0d8c6; --gold:#c9a227;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .stage{display:flex; gap:28px; padding:28px; align-items:flex-start; justify-content:center; flex-wrap:wrap;}
  /* ---------- phone ---------- */
  .phone{width:392px; min-width:392px; background:var(--paper); border-radius:46px;
    border:1px solid #d3cbb6; box-shadow:0 24px 60px rgba(36,49,43,.18);
    overflow:hidden; position:relative;}
  .notch{height:34px; position:relative; background:var(--paper);}
  .statusbar{display:flex; justify-content:space-between; padding:8px 22px 4px; font-size:12px; font-weight:600; color:var(--ink);}
  .phone-screen{position:relative; height:780px; display:flex; flex-direction:column;
    border:1px solid var(--border); border-radius:34px; margin:0 6px 8px; overflow:hidden; background:var(--paper);}
  .appbar{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--border); background:var(--paper); z-index:5;}
  .appbar .backbtn{width:38px; height:38px; border-radius:50%; border:none; background:var(--paper2); color:var(--ink);
    font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none;}
  .appbar .title{font-weight:700; font-size:17px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .appbar .badge{font-size:10px; letter-spacing:1.5px; color:var(--primary); border:1px solid var(--primary); border-radius:20px; padding:3px 8px; font-weight:700;}
  .appbar .saveddot{width:9px; height:9px; border-radius:50%; background:var(--primary); box-shadow:0 0 0 4px var(--primary-soft);}
  /* scroll area */
  .scroll{flex:1; overflow-y:auto; position:relative; overscroll-behavior:contain;}
  .scroll::-webkit-scrollbar{width:0;}
  /* hero */
  .hero{position:sticky; top:0; z-index:4; background:linear-gradient(180deg,var(--primary-soft),rgba(220,239,228,.92));
    transition:padding .25s ease; padding:16px 18px;}
  .hero .eyebrow{font-size:10px; font-weight:800; letter-spacing:1.6px; color:var(--primary); text-transform:uppercase; margin-bottom:5px;}
  .hero .sentence{font-weight:700; font-size:17px; line-height:1.45; transition:font-size .25s ease;}
  .hero.collapsed{padding:8px 18px;}
  .hero.collapsed .eyebrow{display:none;}
  .hero.collapsed .sentence{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* body */
  .body{padding:14px 14px 130px; display:flex; flex-direction:column; gap:14px;}
  .card{background:var(--paper); border:1px solid var(--border); border-radius:18px; padding:14px;}
  .card.paper{background:var(--paper2);}
  .cardhead{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .cardhead .step{width:22px; height:22px; border-radius:50%; background:var(--primary); color:#fff; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex:none;}
  .cardhead .name{font-weight:800; font-size:14px; flex:1;}
  .cardhead .expand{background:none; border:none; color:var(--primary); font-weight:700; font-size:12px; cursor:pointer; padding:4px 6px; border-radius:8px;}
  .cardhead .expand:hover{background:var(--primary-soft);}
  .summaryrow{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);}
  .summaryrow b{color:var(--ink); font-weight:700;}
  .summaryrow .chev{margin-left:auto; color:var(--primary); font-weight:800;}
  .fieldlabel{font-size:12px; font-weight:700; color:var(--muted); margin:2px 0 6px; text-transform:uppercase; letter-spacing:.6px;}
  .stepper{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .stepper button{width:52px; height:52px; border-radius:16px; border:1px solid var(--border); background:var(--paper2);
    font-size:24px; font-weight:700; color:var(--primary); cursor:pointer; flex:none; touch-action:none;}
  .stepper button:active{background:var(--primary-soft);}
  .stepper input{flex:1; height:52px; border-radius:16px; border:1px solid var(--border); background:var(--paper);
    text-align:center; font-size:22px; font-weight:800; color:var(--ink); outline:none; min-width:0;}
  .stepper input:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft);}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1px solid var(--border); background:var(--paper); border-radius:20px; padding:7px 14px; font-size:13px; font-weight:700;
    color:var(--ink); cursor:pointer;}
  .chip:hover{background:var(--paper2);}
  .chip.on{background:var(--primary); border-color:var(--primary); color:#fff;}
  .err{display:flex; gap:6px; align-items:flex-start; color:var(--danger); font-size:12.5px; font-weight:600; margin-top:2px; line-height:1.4;}
  .err .dot{flex:none; margin-top:1px;}
  .fielderr{border-color:var(--danger) !important; box-shadow:0 0 0 3px var(--danger-soft) !important;}
  .note{display:flex; gap:8px; align-items:flex-start; background:var(--primary-soft); border-radius:14px; padding:10px 12px; font-size:12.5px; color:var(--primary-deep); line-height:1.5;}
  /* segmented */
  .seg{display:flex; gap:6px; background:var(--paper2); border-radius:14px; padding:5px; margin-bottom:12px;}
  .seg button{flex:1; border:none; background:transparent; padding:9px 4px; border-radius:10px; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer;}
  .seg button.on{background:var(--paper); color:var(--primary); box-shadow:0 1px 4px rgba(0,0,0,.12);}
  /* prayer rows */
  .prayrow{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .prayrow .pname{font-size:13px; font-weight:700; width:86px; flex:none;}
  .prayrow .mini{flex:1;}
  .toggle{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:10px 0 4px; cursor:pointer;}
  .toggle .tlabel{font-size:13.5px; font-weight:700;}
  .switch{width:46px; height:26px; border-radius:20px; background:#cfc7b2; position:relative; transition:background .18s; flex:none;}
  .switch.on{background:var(--primary);}
  .switch .knob{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .18s;}
  .switch.on .knob{left:23px;}
  /* sessions */
  .session{border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:10px; background:var(--paper);}
  .session .shead{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .session .shead b{font-size:13px; flex:1;}
  .session .shead .x{border:none; background:none; color:var(--danger); font-size:13px; font-weight:800; cursor:pointer; padding:4px 8px;}
  .selectrow{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:12.5px;}
  .selectrow label{color:var(--muted); font-weight:700; flex:none;}
  .selectrow select{flex:1; height:40px; border-radius:12px; border:1px solid var(--border); background:var(--paper); font-size:13.5px; font-weight:700; color:var(--ink); padding:0 10px;}
  .addbtn{border:1.5px dashed var(--primary); color:var(--primary); background:transparent; border-radius:14px; padding:11px;
    font-size:13.5px; font-weight:800; cursor:pointer; width:100%;}
  .addbtn:hover{background:var(--primary-soft);}
  /* shape chip */
  .shapechip{display:inline-flex; align-items:center; gap:6px; background:var(--primary-soft); color:var(--primary-deep);
    border-radius:20px; padding:6px 12px; font-size:12.5px; font-weight:800; margin-bottom:12px;}
  .shapechip button{background:none; border:none; color:var(--primary); font-weight:800; cursor:pointer; text-decoration:underline; font-size:12.5px; padding:0;}
  .dhikrrow{display:flex; align-items:center; gap:12px;}
  .dhikrrow .arabic{font-family:"Scheherazade New","Amiri","Traditional Arabic",serif; font-size:21px; line-height:1.3;}
  .dhikrrow .meta{font-size:12px; color:var(--muted); line-height:1.4;}
  .dhikrrow .meta b{color:var(--ink);}
  .dhikrrow .play{width:44px; height:44px; border-radius:50%; border:none; background:var(--primary); color:#fff; font-size:16px; cursor:pointer; flex:none; margin-left:auto;}
  .changetext{margin-top:6px; text-align:right;}
  .changetext button{background:none; border:none; color:var(--primary); font-size:12.5px; font-weight:800; cursor:pointer;}
  /* create bar */
  .createbar{position:absolute; left:0; right:0; bottom:0; background:var(--paper); border-top:1px solid var(--border);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom)); box-shadow:0 -8px 24px rgba(36,49,43,.08); z-index:6;}
  .errlist{display:flex; flex-direction:column; gap:5px; margin-bottom:8px;}
  .errlist button{display:flex; gap:6px; align-items:flex-start; text-align:left; background:var(--danger-soft); color:var(--danger);
    border:none; border-radius:10px; padding:7px 10px; font-size:12px; font-weight:700; cursor:pointer; width:100%; line-height:1.35;}
  .createbtn{width:100%; border:none; border-radius:16px; padding:15px; font-size:16px; font-weight:800; cursor:pointer; color:#fff;
    background:var(--primary); display:flex; align-items:center; justify-content:center; gap:8px;}
  .createbtn:disabled{background:#c9cfc9; cursor:not-allowed;}
  .createbtn.ok{background:var(--gold);}
  /* preset gallery */
  .presetgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .presetcard{border:1px solid var(--border); background:var(--paper); border-radius:18px; padding:13px; cursor:pointer; text-align:left;
    display:flex; flex-direction:column; gap:6px; transition:transform .12s, border-color .12s;}
  .presetcard:hover{border-color:var(--primary); transform:translateY(-1px);}
  .presetcard.selected{border:2px solid var(--primary); background:var(--primary-soft); padding:12px;}
  .presetcard .picon{font-size:20px;}
  .presetcard .ptitle{font-size:13.5px; font-weight:800;}
  .presetcard .pdesc{font-size:11.5px; color:var(--muted); line-height:1.4;}
  .presetcard .pex{font-size:10.5px; color:var(--primary); font-weight:700; background:rgba(31,111,80,.08); border-radius:8px; padding:3px 7px; align-self:flex-start;}
  .subtle{font-size:12px; color:var(--muted); line-height:1.5;}
  .pillrow{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .pill{border:1px solid var(--border); background:var(--paper); border-radius:14px; padding:6px 10px; font-size:11.5px; font-weight:700; color:var(--muted);}
  /* dhikr list */
  .search{width:100%; height:48px; border-radius:16px; border:1px solid var(--border); background:var(--paper2);
    padding:0 16px; font-size:15px; outline:none;}
  .search:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft);}
  .dhikritem{width:100%; display:flex; gap:12px; align-items:center; background:var(--paper); border:1px solid var(--border);
    border-radius:16px; padding:12px; cursor:pointer; margin-bottom:8px; text-align:left;}
  .dhikritem:hover{border-color:var(--primary);}
  .empty{background:var(--paper2); border:1px dashed var(--border); border-radius:16px; padding:20px; text-align:center; font-size:13px; color:var(--muted);}
  /* modals */
  .overlay{position:absolute; inset:0; background:rgba(24,32,28,.45); display:flex; align-items:center; justify-content:center; z-index:20; padding:22px; backdrop-filter:blur(2px);}
  .modal{background:var(--paper); border-radius:22px; padding:20px; width:100%; box-shadow:0 18px 50px rgba(0,0,0,.25);}
  .modal h3{margin:0 0 6px; font-size:17px;}
  .modal p{margin:0 0 14px; font-size:13px; color:var(--muted); line-height:1.55;}
  .modal .btns{display:flex; gap:8px;}
  .modal .btns button{flex:1; border-radius:14px; padding:13px; font-size:13.5px; font-weight:800; cursor:pointer; border:none;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-ghost{background:var(--paper2); color:var(--ink); border:1px solid var(--border) !important;}
  .btn-danger{background:var(--danger-soft); color:var(--danger);}
  /* success */
  .success{display:flex; flex-direction:column; align-items:center; text-align:center; padding:34px 24px 20px; gap:8px;}
  .checkwrap{width:92px; height:92px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; margin-bottom:6px; animation:pop .45s cubic-bezier(.2,1.4,.4,1);}
  @keyframes pop{0%{transform:scale(.4); opacity:0}100%{transform:scale(1); opacity:1}}
  .checkwrap span{color:#fff; font-size:44px; font-weight:800;}
  .success h2{margin:4px 0 2px; font-size:21px;}
  .success .chipsrow{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:10px 0 18px;}
  .bigbtn{width:100%; border:none; border-radius:16px; padding:15px; font-size:15px; font-weight:800; cursor:pointer; margin-top:8px;}
  /* counting */
  .ringwrap{display:flex; flex-direction:column; align-items:center; padding:40px 20px; gap:18px;}
  .ring{position:relative; width:230px; height:230px;}
  .ring svg{transform:rotate(-90deg);}
  .ring .center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;}
  .ring .center .n{font-size:52px; font-weight:800;}
  .ring .center .l{font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:1px;}
  .countbtn{width:230px; height:230px; border-radius:50%; background:var(--primary); color:#fff; border:none;
    font-size:20px; font-weight:800; cursor:pointer; box-shadow:0 14px 30px rgba(31,111,80,.35);}
  /* toasts */
  .toasts{position:absolute; left:14px; right:14px; bottom:92px; display:flex; flex-direction:column; gap:8px; z-index:30; pointer-events:none;}
  .toast{background:var(--ink); color:#fff; border-radius:14px; padding:11px 14px; font-size:12.5px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.25); animation:slide .25s ease;}
  @keyframes slide{from{transform:translateY(10px); opacity:0}to{transform:translateY(0); opacity:1}}
  /* aside */
  .aside{width:400px; min-width:340px; max-width:100%;}
  .aside h1{font-size:20px; margin:0 0 4px;}
  .aside .lede{font-size:13px; color:var(--muted); line-height:1.55; margin:0 0 14px;}
  .improve{background:var(--paper); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:10px;}
  .improve .ititle{display:flex; gap:8px; align-items:flex-start; font-size:13.5px; font-weight:800;}
  .improve .ititle .n{flex:none; width:20px; height:20px; border-radius:50%; background:var(--primary-soft); color:var(--primary);
    font-size:11px; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .improve .test{font-size:11.5px; color:var(--muted); margin:5px 0 0 28px; line-height:1.5;}
  .toolbar{display:flex; gap:8px; align-items:center; margin-top:14px; flex-wrap:wrap;}
  .toolbar button{background:var(--paper); border:1px solid var(--border); border-radius:12px; padding:9px 13px; font-size:12.5px; font-weight:800; cursor:pointer;}
  .toolbar button:hover{border-color:var(--primary); color:var(--primary);}
  .autosave{font-size:11.5px; font-weight:800; color:var(--primary); display:flex; align-items:center; gap:6px;}
  .autosave .dot{width:7px; height:7px; border-radius:50%; background:var(--primary); animation:blink 1.6s infinite;}
  @keyframes blink{50%{opacity:.25}}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
  @media(max-width:900px){ .phone{width:100%; min-width:0;} .phone-screen{height:72vh;} }
</style>
</head>
<body>
<div id="root"></div>
<script>
const html = htm.bind(React.createElement);
const {useState, useEffect, useRef, useCallback, useMemo} = React;

/* ============================== DATA ============================== */

const LIBRARY = [
  {id:'astaghfirullah', arabic:'أَسْتَغْفِرُ ٱللَّٰهَ ٱلْعَظِيمَ', tr:'Astaghfirullah al-ʼAẓīm', en:'I seek forgiveness from Allah, the Magnificent', tag:'Forgiveness'},
  {id:'subhanallah', arabic:'سُبْحَانَ ٱللَّٰهِ', tr:'Subḥān Allāh', en:'Glory be to Allah', tag:'Tasbih'},
  {id:'alhamdulillah', arabic:'ٱلْحَمْدُ لِلَّٰهِ', tr:'Alḥamdulillāh', en:'All praise is for Allah', tag:'Tasbih'},
  {id:'allahuakbar', arabic:'ٱللَّٰهُ أَكْبَرُ', tr:'Allāhu Akbar', en:'Allah is the Greatest', tag:'Tasbih'},
  {id:'lailahaillallah', arabic:'لَا إِلَٰهَ إِلَّا ٱللَّٰهُ', tr:'Lā ilāha illā Allāh', en:'There is no god but Allah', tag:'Tawhid'},
  {id:'salawat', arabic:'ٱللَّٰهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ', tr:'Allāhumma ṣalli ʿalā Muḥammad', en:'O Allah, send blessings upon Muhammad', tag:'Salawat'},
  {id:'surahikhlas', arabic:'قُلْ هُوَ ٱللَّٰهُ أَحَدٌ', tr:'Sūrat al-Ikhlāṣ', en:'Say: He is Allah, the One', tag:'Quran'},
  {id:'surahmulk', arabic:'تَبَارَكَ ٱلَّذِي بِيَدِهِ ٱلْمُلْكُ', tr:'Sūrat al-Mulk', en:'Blessed is He in Whose hand is the dominion', tag:'Quran'},
  {id:'duaadhani', arabic:'ٱللَّٰهُمَّ رَبَّ هَٰذِهِ ٱلدَّعْوَةِ ٱلتَّامَّةِ', tr:'Duʿāʾ after the Adhān', en:'O Allah, Lord of this perfect call', tag:'Duas'},
];

const PRAYERS = [
  {id:'fajr', n:'Fajr'}, {id:'dhuhr', n:'Dhuhr'}, {id:'asr', n:'Asr'},
  {id:'maghrib', n:'Maghrib'}, {id:'isha', n:'Isha'},
];
const PRAYER_NAME = Object.fromEntries(PRAYERS.map(p=>[p.id,p.n]));

const PRESETS = [
  {id:'daily',         icon:'🌅', title:'Every day',        desc:'A number to reach each day.',                  ex:'100 every day',           chips:[33,70,100,313]},
  {id:'prayer',        icon:'🕌', title:'After prayers',    desc:'Count after each prayer — same or per-prayer.', ex:'33 × 5 prayers',         chips:[3,33,100,313]},
  {id:'oneTime',       icon:'🎯', title:'One time',         desc:'Work toward a total, once.',                    ex:'70,000 total',            chips:[1000,10000,33000,70000]},
  {id:'weekly',        icon:'📅', title:'Weekly',           desc:'One or more days each week.',                   ex:'Every Friday',            chips:[100,1000,5000]},
  {id:'season',        icon:'🌙', title:'Seasonal',         desc:'A sacred window — Ramadan, Dhul-Hijjah…',       ex:'10,000 across Ramadan',   chips:[1000,10000,70000]},
  {id:'morningEvening',icon:'🌄', title:'Morning & evening',desc:'Split counts between dawn and dusk.',           ex:'50 morning / 50 evening', chips:[33,50,100]},
  {id:'tracker',       icon:'🪢', title:'Just count',       desc:'Track your dhikr without a target number.',     ex:'No goal number',          chips:[]},
  {id:'custom',        icon:'⚙️', title:'Advanced',         desc:'Schedule, timing, counting rules, duration & reminders.', ex:'Full control', chips:[33,100,1000]},
];
const PRESET = Object.fromEntries(PRESETS.map(p=>[p.id,p]));

const SEASONS = [
  {id:'ramadan', n:'Ramadan'}, {id:'ramadan_last_10', n:'Ramadan — last 10 nights'},
  {id:'dhul_hijjah_1_10', n:'Dhul-Hijjah 1–10'}, {id:'white_days', n:'White days'},
  {id:'ashura', n:'Ashura'}, {id:'arafah', n:'Arafah'},
];

let sessionCounter = 0;
function mkSession(i, over){
  return Object.assign({id:'s'+(++sessionCounter), name:null, start:'08:00', dur:60, count:'33'}, over||{});
}

function draftForPreset(presetId){
  const base = {
    preset: presetId, count:'100',
    schedule:{mode:'daily', days:[5], season:'ramadan'},
    timing:{mode:'anytime', prayerWhen:'after', prayers:['fajr','dhuhr','asr','maghrib','isha'], uniform:true,
      uniformCount:'33', perPrayer:{fajr:'33',dhuhr:'33',asr:'33',maghrib:'33',isha:'33'}, sessions:[mkSession(0)]},
    reminders:{enabled:false, hour:8, minute:0},
    duration:{enabled:false, days:''},
    streak:{enabled:false, count:''},
  };
  switch(presetId){
    case 'prayer': return Object.assign({}, base, {count:'33', timing:Object.assign({}, base.timing, {mode:'prayer'})},
      {reminders:Object.assign({}, base.reminders, {enabled:true})});
    case 'oneTime': return Object.assign({}, base, {count:'70000'});
    case 'weekly': return Object.assign({}, base, {count:'1000', schedule:Object.assign({}, base.schedule, {mode:'weekly'})});
    case 'season': return Object.assign({}, base, {count:'10000', schedule:Object.assign({}, base.schedule, {mode:'season'})});
    case 'morningEvening': return Object.assign({}, base, {
      count:'100',
      timing:Object.assign({}, base.timing, {mode:'custom',
        sessions:[mkSession(0,{name:'Morning',start:'06:00',dur:180,count:'50'}), mkSession(1,{name:'Evening',start:'18:00',dur:180,count:'50'})]}),
      reminders:Object.assign({}, base.reminders, {enabled:true})});
    case 'tracker': return Object.assign({}, base, {count:''});
    case 'custom': return Object.assign({}, base, {count:'33'});
    default: return base;
  }
}

/* Switch shape but keep the user's extras (reminders, duration, streak). */
function applyPreset(draft, presetId){
  const fresh = draftForPreset(presetId);
  return Object.assign({}, fresh, {
    reminders: draft.reminders, duration: draft.duration, streak: draft.streak,
  });
}

function fmt(s){ const n = parseInt(s,10); return isNaN(n) ? s : n.toLocaleString('en-US'); }

function getErrors(d){
  const errs = [];
  const bad = s => { const t = String(s).trim(); if(t==='') return true; const n = Number(t); return !(n>=1 && n<=999999999); };
  if(d.preset!=='tracker'){
    if(d.preset==='oneTime'){
      if(bad(d.count)) errs.push({sec:'target', msg:'Enter a positive total target.'});
    } else if(d.timing.mode==='prayer'){
      if(d.timing.prayers.length===0) errs.push({sec:'timing', msg:'Pick at least one prayer.'});
      else if(d.timing.uniform){ if(bad(d.timing.uniformCount)) errs.push({sec:'target', msg:'Enter a positive count per prayer.'}); }
      else {
        const badOnes = d.timing.prayers.filter(p=>bad(d.timing.perPrayer[p]));
        if(badOnes.length) errs.push({sec:'target', msg:'Enter a positive count for ' + badOnes.map(p=>PRAYER_NAME[p]).join(', ') + '.'});
      }
    } else if(d.timing.mode==='custom'){
      if(d.timing.sessions.length===0) errs.push({sec:'timing', msg:'Add at least one session.'});
      else { const badS = d.timing.sessions.filter(s=>bad(s.count)); if(badS.length) errs.push({sec:'target', msg:'Every session needs a positive count.'}); }
    } else if(bad(d.count)){
      errs.push({sec:'target', msg: d.schedule.mode==='weekly' ? 'Enter how many per day on your chosen days.' : (d.schedule.mode==='season' ? 'Enter how many per day during the season.' : 'Enter how many per day — at least 1.')});
    }
  }
  if(d.schedule.mode==='weekly' && d.schedule.days.length===0) errs.push({sec:'schedule', msg:'Pick at least one day of the week.'});
  if(d.duration.enabled && bad(d.duration.days)) errs.push({sec:'finetune', msg:'Duration must be a positive number of days.'});
  if(d.streak.enabled && bad(d.streak.count)) errs.push({sec:'finetune', msg:'Minimum streak must be a positive number.'});
  return errs;
}

const DAYS = [['mon','Mon'],['tue','Tue'],['wed','Wed'],['thu','Thu'],['fri','Fri'],['sat','Sat'],['sun','Sun']];
const DAY_NAMES = {mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'};

/* ============================== HOOKS ============================== */

function useHoldRepeat(fn, delay=420, interval=70){
  const t = useRef(null);
  const cb = useRef(fn); cb.current = fn;
  const stop = useCallback(()=>{ clearTimeout(t.current); clearInterval(t.current); t.current=null; },[]);
  const start = useCallback(()=>{
    cb.current();
    stop();
    t.current = setTimeout(()=>{ t.current = setInterval(()=>cb.current(), interval); }, delay);
  },[delay, interval, stop]);
  useEffect(()=>stop, [stop]);
  return {onPointerDown:start, onPointerUp:stop, onPointerLeave:stop, onPointerCancel:stop};
}

/* ============================== SMALL PARTS ============================== */

function Stepper({value, onChange, chips, error, ariaLabel}){
  const holdMinus = useHoldRepeat(()=>{ const n = parseInt(value,10); if(!isNaN(n) && n>1) onChange(String(n-1)); });
  const holdPlus  = useHoldRepeat(()=>{ const n = parseInt(value,10)||0; onChange(String(Math.min(n+1, 999999999))); });
  return html`
    <div>
      <div class="stepper">
        <button aria-label=${'Decrease '+(ariaLabel||'count')} ${holdMinus}>−</button>
        <input value=${value} aria-label=${ariaLabel||'count'}
          inputmode="numeric" pattern="[0-9]*" ${error ? 'aria-invalid=true' : ''}
          onInput=${e=>{ const v = e.target.value.replace(/[^0-9]/g,''); onChange(v); }}/>
        <button aria-label=${'Increase '+(ariaLabel||'count')} ${holdPlus}>+</button>
      </div>
      ${chips && chips.length ? html`
        <div class="chips">
          ${chips.map(c=>html`<button class=${'chip'+(value===''+c?' on':'')} onClick=${()=>onChange(''+c)}>${fmt(''+c)}</button>`)}
        </div>` : null}
      ${error ? html`<div class="err" role="alert"><span class="dot">⚠</span>${error}</div>` : null}
    </div>`;
}

function Toggle({label, checked, onChange, sub}){
  return html`
    <div class="toggle" role="switch" aria-checked=${checked} tabindex="0"
      onClick=${()=>onChange(!checked)} onKeyDown=${e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); onChange(!checked);} }}>
      <div>
        <div class="tlabel">${label}</div>
        ${sub ? html`<div class="subtle">${sub}</div>` : null}
      </div>
      <div class=${'switch'+(checked?' on':'')}><div class="knob"/></div>
    </div>`;
}

function Section({n, name, summary, expanded, onToggle, children, id, error}){
  return html`
    <div class="card ${error?'':''}" id=${id}>
      <div class="cardhead">
        <div class="step">${n}</div>
        <div class="name">${name}</div>
        <button class="expand" onClick=${onToggle}>${expanded?'Hide':'Edit'}</button>
      </div>

    </div>`;
}

                    onChange=${c=>upd({timing:Object.assign({},d.timing,{uniformCount:c})})}
                    chips=${[3,33,100,313]} error=${errsBySec.target}/></div>`
                : html`<div style=${{marginTop:6}}>
                  <div class="fieldlabel">Count after each prayer</div>
                  ${d.timing.prayers.map(p=>html`
                    <div class="prayrow" key=${p}>
                      <span class="pname">${PRAYER_NAME[p]}</span>
                      <div class="mini"><${Stepper} value=${d.timing.perPrayer[p]||''} ariaLabel=${'count after '+PRAYER_NAME[p]}
                        onChange=${c=>setPrayerCount(p,c)} chips=${null}/></div>
                    </div>`)}
                  ${errsBySec.target ? html`<div class="err" role="alert"><span class="dot">⚠</span>${errsBySec.target[0]}</div>` : null}
                </div>`}`}`
          : d.timing.mode==='custom' ? html`
            ${d.timing.sessions.length===0 ? html`<div class="note">⏱ <span>Add a session under <b>Timing</b> — each session gets its own target here.</span></div>` : html`
              <div class="fieldlabel">How much in each session</div>
              ${d.timing.sessions.map((s, i)=>html`
                <div class="session" key=${s.id}>
                  <div class="shead"><b>${s.name || ('Session '+(i+1))}</b></div>
                  <div class="subtle" style=${{margin:'-2px 0 8px'}}>${fmtWindow(s)}</div>
                  <${Stepper} value=${s.count} ariaLabel=${'target for '+(s.name||('session '+(i+1)))}
                    onChange=${c=>upd({timing:Object.assign({},d.timing,{sessions:d.timing.sessions.map(x=>x.id===s.id?Object.assign({},x,{count:c}):x)})})}
                    chips=${null}/>
                </div>`)}
              ${errsBySec.target ? html`<div class="err" role="alert"><span class="dot">⚠</span>${errsBySec.target[0]}</div>` : null}
              <div class="note">🧮 <span><b>${fmt(''+totalOfSessions)}</b> per day in total across ${d.timing.sessions.length} session${d.timing.sessions.length===1?'':'s'}.</span></div>`}`
          : html`
            <${Stepper} value=${d.count} ariaLabel="daily count" onChange=${setCount}
              chips=${PRESET[d.preset].chips} error=${errsBySec.target}/>
            ${d.schedule.mode==='season' ? html`<div class="note" style=${{marginTop:8}}>🌙 <span>That’s the amount for each day of the season — the season itself is set under <b>Schedule</b>.</span></div>` : null}`}
        </${Section}>

        <${Section} id="sec-finetune" n=${4} name="Fine-tune" error=${errsBySec.finetune}
          summary=${html`<b>Reminders, duration, streak</b>`}
          expanded=${open.finetune} onToggle=${()=>setOpen(Object.assign({},open,{finetune:!open.finetune}))}>
          <${Toggle} label="Daily reminder" sub=${d.reminders.enabled ? 'At ' + (d.reminders.hour%12||12) + ':00' : 'A gentle ping — asked at create time, not mid-flow'}
            checked=${d.reminders.enabled}
            onChange=${v=>upd({reminders:Object.assign({},d.reminders,{enabled:v})})}/>
          ${d.reminders.enabled ? html`
            <div class="selectrow" style=${{margin:'4px 0 10px'}}><label>At</label>
              <select value=${d.reminders.hour} aria-label="reminder hour"
                onChange=${e=>upd({reminders:Object.assign({},d.reminders,{hour:+e.target.value})})}>
                ${[5,6,7,8,9,10,12,15,18,20,21,22].map(h=>html`<option value=${h}>${h%12||12}:00 ${h<12?'AM':'PM'}</option>`)}
              </select>
            </div>` : null}
          <hr style=${{border:'none',borderTop:'1px solid var(--border)',margin:'8px 0'}}/>
          <${Toggle} label="End after a set number of days" sub=${d.duration.enabled ? fmt(d.duration.days)+' days' : 'Optional — e.g. 40 days'}
            checked=${d.duration.enabled}
            onChange=${v=>upd({duration:Object.assign({},d.duration,{enabled:v})})}/>
          ${d.duration.enabled ? html`<div style=${{margin:'6px 0 2px'}}><${Stepper} value=${d.duration.days} ariaLabel="duration days"
            onChange=${c=>upd({duration:Object.assign({},d.duration,{days:c})})} chips=${[7,30,40,100]} error=${errsBySec.finetune && d.duration.enabled ? errsBySec.finetune[0] : null}/></div>` : null}
          <hr style=${{border:'none',borderTop:'1px solid var(--border)',margin:'8px 0'}}/>
          <${Toggle} label="Minimum streak" sub=${d.streak.enabled ? fmt(d.streak.count)+' per day' : 'Require a minimum before the day counts'}
            checked=${d.streak.enabled}
            onChange=${v=>upd({streak:Object.assign({},d.streak,{enabled:v})})}/>
          ${d.streak.enabled ? html`<div style=${{margin:'6px 0 2px'}}><${Stepper} value=${d.streak.count} ariaLabel="minimum streak"
            onChange=${c=>upd({streak:Object.assign({},d.streak,{count:c})})} chips=${[10,33,100]} error=${errsBySec.finetune && d.streak.enabled ? errsBySec.finetune[0] : null}/></div>` : null}
          <div class="note" style=${{marginTop:6}}>🔔 <span>Notification permission is requested only when you tap <b>Create goal</b> — with an explanation — never while you are editing.</span></div>
        </${Section}>
        <div style=${{height:8}}/>
      </div>
    </div>
    <div class="createbar">
      ${errors.length ? html`
        <div class="errlist" aria-live="polite">
          ${errors.map((e,i)=>html`<button key=${i} onClick=${()=>scrollTo(e.sec)}>⚠ <span>${e.msg} — tap to fix</span></button>`)}
        </div>` : null}
      <button class="createbtn" onClick=${onCreate} aria-label="Create goal">
        ${dirty ? '● Create goal' : 'Create goal'}  ›
      </button>
    </div>`;
}

function SuccessScreen({dhikr, draft, onStart, onDone, onAnother}){
  const total = draft.timing.sessions.reduce((a,s)=>{ const n=parseInt(s.count,10); return a+(isNaN(n)?0:n); },0);
  const sentence = draft.preset==='tracker' ? `“${dhikr.tr}” — just count`
    : draft.preset==='oneTime' ? `“${dhikr.tr}” ${fmt(draft.count)} total`
    : draft.preset==='prayer' ? `“${dhikr.tr}” ${draft.timing.uniform ? fmt(draft.timing.uniformCount)+' after each prayer' : 'per prayer'}`
    : draft.timing.mode==='custom' ? `“${dhikr.tr}” ${fmt(''+total)} across ${draft.timing.sessions.length} sessions`
    : `“${dhikr.tr}” ${fmt(draft.count)}${draft.preset==='weekly' ? ' weekly' : ' every day'}`;
  return html`
    <div class="scroll">
      <div class="success">
        <div class="checkwrap"><span>✓</span></div>
        <h2>Goal created</h2>
        <div class="subtle">Saved to your goals. Reminders are ${draft.reminders.enabled ? 'on' : 'off'}${draft.reminders.enabled ? ' and notifications enabled' : ''}.</div>
        <div class="chipsrow">
          <span class="pill">${PRESET[draft.preset].icon} ${PRESET[draft.preset].title}</span>
          <span class="pill">${sentence}</span>
        </div>
        <button class="bigbtn btn-primary" onClick=${onStart}>▶ Start counting now</button>
        <button class="bigbtn btn-ghost" onClick=${onDone}>Done — back to goals</button>
        <button class="bigbtn" style=${{background:'transparent',color:'var(--primary)',border:'1px solid var(--primary)'}}"
          onClick=${onAnother}>+ Create another goal</button>
        <div class="subtle" style=${{marginTop:6}}>No more forced jump into counting — you choose what happens next.</div>
      </div>
    </div>`;
}

function CountingScreen({dhikr, draft, onBack}){
  const total = draft.timing.sessions.reduce((a,s)=>{ const n=parseInt(s.count,10); return a+(isNaN(n)?0:n); },0);
  const target = draft.preset==='tracker' ? null : parseInt(draft.timing.mode==='custom' ? total : draft.count,10) || null;
  const [count, setCount] = useState(0);
  const pct = target ? Math.min(100, Math.round(count/target*100)) : 0;
  const done = target ? count>=target : false;
  const r = 100, c = 2*Math.PI*r;
  return html`
    <div class="scroll">
      <div class="ringwrap">
        <div class="ring">
          <svg width="230" height="230" viewBox="0 0 230 230">
            <circle cx="115" cy="115" r=${r} fill="none" stroke="var(--primary-soft)" stroke-width="16"/>
            <circle cx="115" cy="115" r=${r} fill="none" stroke="var(--primary)" stroke-width="16"
              stroke-linecap="round" stroke-dasharray=${c} stroke-dashoffset=${c*(1-pct/100)} style=${{transition:'stroke-dashoffset .2s'}}/>
          </svg>
          <div class="center"><div class="n">${count.toLocaleString()}</div><div class="l">${target?('of '+fmt(''+target)):'counted'}</div></div>
        </div>
        <button class="countbtn" onClick=${()=>{ if(done) return; const n=count+1; setCount(n); if(target && n>=target){ setTimeout(()=>alert && null,0); } }}
          aria-label="count one">
          ${done ? '🎉 Target reached!' : 'Tap to count'}
        </button>
        <div class="subtle" style=${{textAlign:'center'}}>“${dhikr.tr}” · ${PRESET[draft.preset].title} · wireframe counting screen</div>
      </div>
    </div>`;
}

/* ============================== APP ============================== */

const STORAGE_KEY = 'awrad-demo-draft-v1';

function App(){
  const [stack, setStack] = useState(['pick']);
  const [dhikr, setDhikr] = useState(null);
  const [draft, setDraft] = useState(null);
  const [baseline, setBaseline] = useState(null);
  const [library, setLibrary] = useState(LIBRARY);
  const [toasts, setToasts] = useState([]);
  const [notifModal, setNotifModal] = useState(false);
  const [discard, setDiscard] = useState(false);
  const [restored, setRestored] = useState(false);
  const toastId = useRef(0);

  const toast = useCallback((msg)=>{
    const id = ++toastId.current;
    setToasts(t=>[...t, {id, msg}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 2800);
  },[]);

  /* Autosave the draft so it survives a reload (process-death simulation). */
  useEffect(()=>{
    if(stack[stack.length-1]==='composer' && draft && dhikr){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({dhikrId:dhikr.id, draft})); }catch(e){}
    }
  },[stack, draft, dhikr]);

  useEffect(()=>{
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const saved = JSON.parse(raw);
        const d = library.find(x=>x.id===saved.dhikrId);
        if(d && saved.draft){
          setDhikr(d); setDraft(saved.draft); setBaseline(JSON.stringify(saved.draft));
          setStack(['pick','presets','composer']); setRestored(true);
        }
      }
    }catch(e){}
  },[]);

  useEffect(()=>{ if(restored) toast('Autosaved draft restored — your work survived the reload.'); },[restored]);

  const current = stack[stack.length-1];
  const dirty = draft && baseline && JSON.stringify(draft)!==baseline;

  const errors = draft ? getErrors(draft) : [];
  const hasComposer = stack.includes('composer');

  const push = s=>setStack(st=>[...st, s]);
  const pop = ()=>setStack(st=>st.slice(0,-1));

  const reset = ()=>{
    localStorage.removeItem(STORAGE_KEY);
    setStack(['pick']); setDhikr(null); setDraft(null); setBaseline(null);
    setLibrary(LIBRARY); setNotifModal(false); setDiscard(false);
    toast('Demo reset — fresh start.');
  };

  const goBack = ()=>{
    if(current==='composer'){ if(dirty) setDiscard(true); else pop(); return; }
    if(current==='pick'){ if(stack.length>1) pop(); else toast('Left goal creation — nothing was saved.'); return; }
    pop();
  };

  const pickDhikr = d=>{
    setDhikr(d);
    if(stack.length>1){ pop(); toast(`Dhikr changed to “${d.tr}” — your draft is untouched.`); }
    else { push('presets'); }
  };
  const pickPreset = pid=>{
    const next = draft ? applyPreset(draft, pid) : draftForPreset(pid);
    setDraft(next); setBaseline(JSON.stringify(next));
    if(draft) toast(`${PRESET[pid].title} applied — your extras were kept.`);
    if(hasComposer) pop(); else push('composer');
  };
  const createGoal = ()=>{
    if(errors.length){ toast('Fix the highlighted issues — tap an error to jump to it.'); return; }
    if(draft.reminders.enabled) setNotifModal(true); else finishCreate();
  };
  const finishCreate = (remindersOn=true)=>{
    setNotifModal(false);
    if(draft && !remindersOn) setDraft(Object.assign({}, draft, {reminders:Object.assign({}, draft.reminders, {enabled:false})}));
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    push('success');
    toast('Goal created ✓');
  };

  const titles = {pick:'Choose a dhikr', presets:'What kind of goal?', composer:'Set your goal', success:'Goal created', counting:'Counting'};

  const screen = (()=>{
    switch(current){
      case 'pick': return html`<${DhikrPicker} library=${library} onPick=${pickDhikr}
          onBack=${goBack} exit=${()=>{}} onCreateNew=${d=>{ setLibrary(l=>[...l, d]); setDhikr(d); if(stack.length>1) pop(); else push('presets'); toast(`“${d.tr}” added to the library and selected.`); }}/>`;
      case 'presets': return html`<${PresetGallery} draft=${draft} onPick=${pickPreset} onBack=${goBack}/>`;
      case 'composer': return html`<${Composer} dhikr=${dhikr} draft=${draft} setDraft=${d=>{ setDraft(d); }}
          errors=${errors} dirty=${dirty} onCreate=${createGoal} onBack=${goBack}
          onChangeDhikr=${()=>push('pick')} onShapeChange=${()=>push('presets')}/>`;
      case 'success': return html`<${SuccessScreen} dhikr=${dhikr} draft=${draft}
          onStart=${()=>push('counting')} onDone=${()=>{ setDraft(null); setBaseline(null); setStack(['presets']); }}
          onAnother=${()=>{ setDraft(null); setBaseline(null); setStack(['presets']); toast('Fresh goal — same dhikr kept.'); }}/>`;
      case 'counting': return html`<${CountingScreen} dhikr=${dhikr} draft=${draft} onBack=${goBack}/>`;
    }
  })();

  return html`
    <div class="stage">
      <div class="phone" aria-label="Phone preview">
        <div class="notch"><div class="statusbar"><span>9:41</span><span>WIREFRAME</span></div></div>
        <div class="phone-screen">
          <div class="appbar">
            <button class="backbtn" aria-label="Back" onClick=${goBack}>←</button>
            <div class="title">${titles[current]}</div>
            ${current==='composer' && draft ? html`<span class="saveddot" title="Autosaved"/>` : html`<span class="badge">DEMO</span>`}
          </div>
          ${screen}
          <div class="toasts" aria-live="polite">
            ${toasts.map(t=>html`<div class="toast" key=${t.id}>${t.msg}</div>`)}
          </div>
          ${discard ? html`
            <div class="overlay">
              <div class="modal" role="alertdialog" aria-label="Discard draft">
                <h3>Discard this goal?</h3>
                <p>Your configuration is unsaved. Autosave keeps drafts across app restarts, but this copy hasn’t been created yet.</p>
                <div class="btns">
                  <button class="btn-ghost" onClick=${()=>setDiscard(false)}>Keep editing</button>
                  <button class="btn-danger" onClick=${()=>{ setDiscard(false); setDraft(null); setBaseline(null); pop(); toast('Draft discarded.'); }}>Discard</button>
                </div>
              </div>
            </div>` : null}
          ${notifModal ? html`
            <div class="overlay">
              <div class="modal" role="alertdialog" aria-label="Notification permission">
                <h3>Allow reminders?</h3>
                <p>This goal uses <b>daily reminders</b> so you don’t forget your dhikr. We ask once, here — not while you’re editing. You can change this anytime in Settings.</p>
                <div class="btns" style=${{flexDirection:'column'}}>
                  <button class="btn-primary" onClick=${()=>{ finishCreate(true); toast('Notifications enabled ✓'); }}>Allow notifications</button>
                  <button class="btn-ghost" onClick=${()=>finishCreate(false)}>Create without reminders</button>
                  <button style=${{background:'none',color:'var(--muted)'}} onClick=${()=>setNotifModal(false)}>Not now — keep editing</button>
                </div>
              </div>
            </div>` : null}
        </div>
      </div>

      <div class="aside">
        <h1>Improved Goal Creation Flow</h1>
        <p class="lede">Interactive wireframe of the redesigned flow for the Android app. Every improvement below is <b>implemented and testable in the phone preview</b> — this is a simulation, not the real app.</p>

        <div class="improve"><div class="ititle"><span class="n">1</span>One composer — no dead UI, no two flows</div>
          <div class="test">The old “simple vs advanced” split and the hidden goal-type grid are gone. Every preset opens the same editor. <b>Test:</b> pick “Every day”, then “Change shape” → “After prayers”.</div></div>

        <div class="improve"><div class="ititle"><span class="n">2</span>All 8 presets surfaced</div>
          <div class="test">Weekly, Ramadan/season, morning &amp; evening and after-prayers are now one tap, not buried behind “Advanced”. <b>Test:</b> open the “Seasonal” card.</div></div>

        <div class="improve"><div class="ititle"><span class="n">3</span>Real back stack</div>
          <div class="test">Back always returns to the previous screen, including the change-dhikr detour. <b>Test:</b> Composer → Change dhikr → ←.</div></div>

        <div class="improve"><div class="ititle"><span class="n">4</span>Draft survives process death (autosave)</div>
          <div class="test">The draft is autosaved; reloading the page restores it. <b>Test:</b> edit the composer, press Refresh — “Draft restored”.</div></div>

        <div class="improve"><div class="ititle"><span class="n">5</span>Discard confirmation</div>
          <div class="test">Leaving a non-default draft asks first. <b>Test:</b> set a count, press ←.</div></div>

        <div class="improve"><div class="ititle"><span class="n">6</span>Inline validation — all errors, jump to fix</div>
          <div class="test">Errors appear under the field <i>and</i> in the create bar; tapping one scrolls to it. <b>Test:</b> clear the count, then switch shape to “Weekly” and uncheck every day.</div></div>

        <div class="improve"><div class="ititle"><span class="n">7</span>Notifications asked at create, with rationale</div>
          <div class="test">No mid-flow system dialogs. <b>Test:</b> pick “After prayers” → Create goal → rationale modal.</div></div>

        <div class="improve"><div class="ititle"><span class="n">8</span>Success state — you choose what’s next</div>
          <div class="test">No forced jump into Counting. <b>Test:</b> create a goal → Start counting / Done / Create another.</div></div>

        <div class="improve"><div class="ititle"><span class="n">9</span>No data loss when switching timing</div>
          <div class="test">Per-prayer and per-session targets persist across Anytime ↔ After prayers ↔ Sessions. <b>Test:</b> set per-prayer counts, switch to Anytime, switch back.</div></div>

        <div class="improve"><div class="ititle"><span class="n">10</span>Steppers: hold-to-repeat, clamped, empty allowed</div>
          <div class="test">Press and hold + or − to count fast; values clamp at 999,999,999; clearing a field shows an inline error instead of a silent disable.</div></div>

        <div class="improve"><div class="ititle"><span class="n">11</span>Create-new-dhikr inside the picker</div>
          <div class="test">Search “zzz” for the empty state, or use “Add a new dhikr” at the bottom of the list.</div></div>

        <div class="improve"><div class="ititle"><span class="n">12</span>Clearer naming &amp; separated concerns</div>
          <div class="test">Sections run in a sensible order — <b>Schedule → Timing → Target</b> — so the amount adapts to your timing: one number, per-prayer, or one per session. “No target” is now “Just count”.</div></div>

        <div class="toolbar">
          <button onClick=${()=>localStorage.removeItem(STORAGE_KEY)}>🧹 Clear autosaved draft</button>
          <button onClick=${reset}>↺ Reset demo</button>
          <span class="autosave"><span class="dot"/>Autosave on</span>
        </div>
        <p class="lede" style=${{marginTop:10}}>Built as a single self-contained HTML file — take it into any tool (Figma → HTML plugins, Maze, or the Android team) as a reviewable artifact. The real implementation is a port of this flow into the Compose screens.</p>
      </div>
    </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
