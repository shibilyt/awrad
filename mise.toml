# Pinned toolchains for the rebuild projects (docs/rebuild-plan.md, item 0.5).
# `mise install` in the repo root installs them; mise activates them inside this repo only.
# Bump versions here, in one reviewed change, never per machine.
#
# Not managed by mise:
#   Xcode      -> .xcode-version (checked by scripts/check-toolchain)
#   Postgres   -> compose.yaml (Docker), major version 18 everywhere
#   Android SDK -> Android Studio / sdkmanager; compile SDK is pinned in awrad-android-next/build-logic

[tools]
erlang = "29.1.2"
elixir = "1.20.4-otp-29"
node = "24.22.0"
java = "zulu-17.68.17.0"   # Gradle and AGP; awrad-android-next targets JVM 17

[settings]
# Fail loudly instead of silently falling back to a system install.
not_found_auto_install = false
