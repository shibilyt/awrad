openapi: 3.1.0
info:
  title: Awrad API
  version: 1.0.0-pre
  summary: JSON API served by awrad-server-next to the Android, iOS and web clients.
  description: |
    Follows `contracts/api/STYLE.md` (ADR-2026-10-16). Rules are enforced by
    `contracts/api/spectral.mjs`; run `npm test` in `contracts/`.

    Paths are added slice by slice (`docs/rebuild-plan.md`). Shared building
    blocks live under `components` and are referenced, never copied.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: "{base_url}"
    description: The deployment's API origin. Web clients use their own origin (same site).
    variables:
      base_url:
        default: http://localhost:4000
tags:
  - name: accounts
    description: Registration, email verification, password reset and the signed-in account (slice 2a).
  - name: device_sessions
    description: Mobile sign-in, token refresh and sign-out (ADR-2026-07-12).
  - name: account_settings
    description: Sessions, password, email and deletion for the signed-in account (slice 2b).
  - name: browser
    description: Endpoints only browser (cookie-session) clients use.
  - name: sync
    description: >-
      The change queue: commands and the changes feed for custom dhikrs, tags and personal records (slice 3b,
      contracts/sync/v1).
  - name: audio
    description: >-
      Private recordings for custom dhikrs: reserve an upload, PUT the file straight to storage, confirm it, then
      fetch short-lived download links (slice 3c, contracts/audio/v1, ADR-2026-10-29).

paths:
  /api/v1/accounts:
    $ref: paths/accounts.yaml#/accounts
  /api/v1/accounts/verify_email:
    $ref: paths/accounts.yaml#/verify_email
  /api/v1/accounts/resend_verification_code:
    $ref: paths/accounts.yaml#/resend_verification_code
  /api/v1/accounts/request_password_reset:
    $ref: paths/accounts.yaml#/request_password_reset
  /api/v1/accounts/reset_password:
    $ref: paths/accounts.yaml#/reset_password
  /api/v1/account:
    $ref: paths/accounts.yaml#/current
  /api/v1/account/sessions:
    $ref: paths/account_settings.yaml#/sessions
  /api/v1/account/sessions/{session_id}:
    $ref: paths/account_settings.yaml#/session
  /api/v1/account/sessions/revoke_others:
    $ref: paths/account_settings.yaml#/revoke_others
  /api/v1/account/change_password:
    $ref: paths/account_settings.yaml#/change_password
  /api/v1/account/request_email_change:
    $ref: paths/account_settings.yaml#/request_email_change
  /api/v1/account/confirm_email_change:
    $ref: paths/account_settings.yaml#/confirm_email_change
  /api/v1/account/delete:
    $ref: paths/account_settings.yaml#/delete
  /api/v1/device_sessions:
    $ref: paths/device_sessions.yaml#/device_sessions
  /api/v1/device_sessions/refresh:
    $ref: paths/device_sessions.yaml#/refresh
  /api/v1/device_sessions/sign_out:
    $ref: paths/device_sessions.yaml#/sign_out
  /api/v1/browser/csrf_token:
    $ref: paths/browser.yaml#/csrf_token
  /api/v1/browser/session:
    $ref: paths/browser.yaml#/session
  /api/v1/sync/commands:
    $ref: paths/sync.yaml#/commands
  /api/v1/sync/changes:
    $ref: paths/sync.yaml#/changes
  /api/v1/audio_uploads:
    $ref: paths/audio.yaml#/uploads
  /api/v1/audio_uploads/{asset_id}/complete:
    $ref: paths/audio.yaml#/complete
  /api/v1/audio_assets/usage:
    $ref: paths/audio.yaml#/usage
  /api/v1/audio_assets/{asset_id}/download:
    $ref: paths/audio.yaml#/download

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Mobile clients. Short-lived access token bound to a device session (ADR-2026-07-12).
    cookieAuth:
      type: apiKey
      in: cookie
      name: _awrad_session
      description: >-
        Browser clients. Phoenix session cookie: httpOnly, Secure, SameSite=Lax (ADR-2026-10-15).
        The cookie name is a placeholder until the server scaffold fixes it.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with cookieAuth on every state-changing request. Fetch it from `get_browser_csrf_token`.

  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      description: Lowercase, hyphenated UUID, any version except nil and max. New IDs are UUIDv7, client-generated for user-owned entities (STYLE §4).
      examples: ["017f22e2-79b0-7cc3-98c4-dc0c0c07398f"]
    Instant:
      type: string
      format: date-time
      pattern: "Z$"
      description: RFC 3339 instant in UTC with a `Z` suffix. Field names end in `_at`.
      examples: ["2026-10-16T08:00:00Z"]
    LocalDate:
      type: string
      format: date
      description: Calendar day `YYYY-MM-DD`. Field names end in `_date`; practice days use `local_date`.
      examples: ["2026-10-16"]
    LocalTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: Local time of day, 24-hour `HH:MM`. Field names end in `_time`.
      examples: ["06:15"]
    Timezone:
      type: string
      minLength: 1
      maxLength: 64
      description: IANA timezone name.
      examples: ["Asia/Kolkata"]
    Count:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: A whole-number count (STYLE §5). Never fractional.
      examples: [313]
    CountDelta:
      type: integer
      minimum: -9007199254740991
      maximum: 9007199254740991
      description: A signed whole-number change to a count, for example -3 to undo three taps.
      examples: [-3]
    Revision:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Monotonic resource revision used with `expected_revision` (STYLE §9).
      examples: [12]
    Cursor:
      type: string
      minLength: 1
      maxLength: 512
      description: Opaque pagination cursor. Clients must not parse or build it.
      examples: ["c2lnbmVkLWN1cnNvcg"]
    Problem:
      type: object
      description: RFC 9457 problem details (STYLE §7). Clients switch on `code` only.
      additionalProperties: true
      required: [type, title, status, code, detail, errors]
      properties:
        type:
          type: string
          pattern: "^urn:awrad:problem:[a-z][a-z0-9_]*$"
        title:
          type: string
          description: English, for logs. Never shown to users.
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: Stable machine code. Clients map it to localized text.
        detail:
          type: string
          description: English, for logs. Never shown to users.
        errors:
          type: array
          description: Field validation errors. Empty when the problem isn't about specific fields.
          items:
            $ref: "#/components/schemas/FieldError"
    Email:
      type: string
      minLength: 3
      maxLength: 160
      description: >-
        An email address, trimmed by the client (contracts/account-model/v1 email_input). Compared
        case-insensitively. Invalid ones are `validation_failed` with field code `email_invalid`.
      examples: ["amina@example.com"]
    Password:
      type: string
      minLength: 1
      maxLength: 1024
      description: >-
        12 to 128 Unicode code points after NFC normalisation, no composition rules
        (contracts/account-model/v1 password_policy). The server also rejects common passwords. Failures are
        `validation_failed` with field code `password_too_short`, `password_too_long` or `password_too_common`.
      examples: ["a long passphrase"]
    EmailCode:
      type: string
      pattern: "^[0-9]{6}$"
      description: >-
        A 6-digit emailed code, ASCII digits only. Clients normalise what the user typed first
        (contracts/account-model/v1 email_code_input). Valid for 15 minutes and 5 tries. A malformed code is
        `validation_failed` with field code `code_invalid`; clients never send one.
      examples: ["482913"]
    EmailOnly:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"
    RefreshTokenOnly:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 16
          maxLength: 512
    Account:
      type: object
      additionalProperties: false
      required: [id, email, created_at]
      description: A signed-in account. Its email is always verified (verification-first).
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          type: string
          maxLength: 160
        created_at:
          $ref: "#/components/schemas/Instant"
    CurrentPassword:
      type: string
      minLength: 1
      maxLength: 1024
      description: The account's current password, re-entered to confirm a sensitive change. A wrong one is
        `validation_failed` with field code `current_password_incorrect`.
    AccountSession:
      type: object
      additionalProperties: false
      required: [id, kind, name, platform, created_at, last_seen_at, is_current]
      description: One place the account is signed in.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
          description: For a device session, the same `id` as `DeviceSession.id` in its sign-in grant.
        kind:
          type: string
          enum: [device, browser]
        name:
          type: ["string", "null"]
          maxLength: 120
          description: >-
            Device model for a device session ("Pixel 9"); a browser and system summary for a browser session
            ("Firefox on Windows"), or null when it couldn't be told. Clients show a generic label for null.
        platform:
          type: string
          enum: [android, ios, web]
        created_at:
          $ref: "#/components/schemas/Instant"
        last_seen_at:
          $ref: "#/components/schemas/Instant"
        is_current:
          type: boolean
          description: True for the session making this request.
    DeviceInfo:
      type: object
      additionalProperties: false
      required: [installation_id, name, platform]
      description: >-
        Invalid values are `validation_failed` with field codes `installation_id_invalid`, `device_name_invalid`
        or `platform_invalid` under `/device/...`.
      properties:
        installation_id:
          $ref: "#/components/schemas/Uuid"
          description: Random UUID the app creates once per installation and keeps in secure storage (UUIDv7 since ADR-2026-10-28).
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: The device model, for example "Pixel 9" or "iPhone 16". Shown in the device list.
        platform:
          type: string
          enum: [android, ios]
    DeviceSession:
      type: object
      additionalProperties: false
      required: [id, device_name, platform, created_at, last_seen_at, idle_expires_at, absolute_expires_at]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        device_name:
          type: string
        platform:
          type: string
          enum: [android, ios]
        created_at:
          $ref: "#/components/schemas/Instant"
        last_seen_at:
          $ref: "#/components/schemas/Instant"
        idle_expires_at:
          $ref: "#/components/schemas/Instant"
          description: Ends after 30 days without a refresh; each refresh moves it.
        absolute_expires_at:
          $ref: "#/components/schemas/Instant"
          description: Ends 180 days after sign-in, whatever happens.
    DeviceSessionGrant:
      type: object
      additionalProperties: false
      required: [account, session, access_token, access_token_expires_at, refresh_token]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        session:
          $ref: "#/components/schemas/DeviceSession"
        access_token:
          type: string
          minLength: 16
          maxLength: 4096
          description: Bearer token, valid for 15 minutes. Keep it in memory only.
        access_token_expires_at:
          $ref: "#/components/schemas/Instant"
        refresh_token:
          type: string
          minLength: 16
          maxLength: 512
          description: Single use. Keep it in secure storage (Android Keystore, iOS Keychain).
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, detail]
      properties:
        field:
          type: string
          description: JSON Pointer into the request body, for example `/daily_target`.
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        detail:
          type: string

    SyncEntityType:
      type: string
      enum: [custom_dhikr, user_tag, dhikr_personal]
      description: What a sync entity is (contracts/sync/v1/README.md).
    SyncVersion:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Per-entity version. 0 means the entity doesn't exist yet; every applied change adds one.
      examples: [3]
    SyncOptionalTitleText:
      description: Non-blank text of at most 120 code points, or null.
      oneOf:
        - type: string
          minLength: 1
          maxLength: 120
          pattern: "\\S"
        - type: "null"
    SyncOptionalLongText:
      description: Non-blank text of at most 5,000 code points, or null.
      oneOf:
        - type: string
          minLength: 1
          maxLength: 5000
          pattern: "\\S"
        - type: "null"
    CustomDhikrDocument:
      type: object
      additionalProperties: false
      required: [kind, arabic, title, transliteration, translation, audio, references]
      description: >-
        A user's own dhikr (sync.schema.json `custom_dhikr_document`): the catalog dhikr shape without id (the
        entity_id is the ID), key, aliases, virtues or catalog tags. Lengths are Unicode code points. Invalid ones
        are rejected per command (custom_dhikr_validity.json).
      properties:
        kind:
          type: string
          enum: [quran, dhikr, dua, salawat, name_of_allah]
        arabic:
          type: string
          minLength: 1
          maxLength: 5000
          pattern: "\\S"
        title:
          type: object
          additionalProperties: false
          required: [en, ar, ml]
          description: Every key present, null when not given (STYLE §3); at least one is text.
          properties:
            en:
              $ref: "#/components/schemas/SyncOptionalTitleText"
            ar:
              $ref: "#/components/schemas/SyncOptionalTitleText"
            ml:
              $ref: "#/components/schemas/SyncOptionalTitleText"
        transliteration:
          type: object
          additionalProperties: false
          required: [en, ml]
          description: Arabic has none.
          properties:
            en:
              $ref: "#/components/schemas/SyncOptionalLongText"
            ml:
              $ref: "#/components/schemas/SyncOptionalLongText"
        translation:
          type: object
          additionalProperties: false
          required: [en, ar, ml]
          properties:
            en:
              $ref: "#/components/schemas/SyncOptionalLongText"
            ar:
              $ref: "#/components/schemas/SyncOptionalLongText"
            ml:
              $ref: "#/components/schemas/SyncOptionalLongText"
        audio:
          description: >-
            null (no recording), `{"local_only": true}` (a recording kept only on the device that imported it), or an
            uploaded recording (slice 3c). Any other shape is a field error `invalid` on /audio.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [local_only]
              properties:
                local_only:
                  type: boolean
                  const: true
            - $ref: "#/components/schemas/UploadedAudio"
        references:
          type: array
          maxItems: 20
          items:
            description: >-
              A reference exactly as in contracts/dhikr-catalog/v1 `$defs/reference`: `quran` (surah, ayah_start,
              ayah_end), `hadith`, `book`, `shaykh` or `other`, each with an `id`. Not restated here; the catalog
              schema is the single definition.
    UserTagDocument:
      type: object
      additionalProperties: false
      required: [name, normalized_name]
      description: >-
        A user's tag. `name` is trimmed, collapsed and NFC, with 1-40 graphemes and at most 128 UTF-8 bytes;
        `normalized_name` is its case fold (tag_name_normalization.json). The server recomputes it.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "\\S"
        normalized_name:
          type: string
          minLength: 1
          maxLength: 384
          pattern: "\\S"
    DhikrPersonalDocument:
      type: object
      additionalProperties: false
      required: [tag_ids]
      description: >-
        A user's own data about one dhikr; its entity_id is the dhikr's ID, built-in or custom. Clients clear tags with
        an empty list and never delete it.
      properties:
        tag_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
    SyncDocument:
      description: The entity's whole document; which one depends on entity_type.
      oneOf:
        - $ref: "#/components/schemas/CustomDhikrDocument"
        - $ref: "#/components/schemas/UserTagDocument"
        - $ref: "#/components/schemas/DhikrPersonalDocument"
    SyncCommand:
      description: >-
        One change. `put` creates (base_version 0) or replaces the whole document; `delete` makes a final tombstone.
        command_id is a new UUIDv7 per command.
      oneOf:
        - type: object
          additionalProperties: false
          required: [command_id, entity_type, entity_id, op, base_version, document]
          properties:
            command_id:
              $ref: "#/components/schemas/Uuid"
            entity_type:
              $ref: "#/components/schemas/SyncEntityType"
            entity_id:
              $ref: "#/components/schemas/Uuid"
            op:
              type: string
              const: put
            base_version:
              $ref: "#/components/schemas/SyncVersion"
            document:
              $ref: "#/components/schemas/SyncDocument"
        - type: object
          additionalProperties: false
          required: [command_id, entity_type, entity_id, op, base_version]
          properties:
            command_id:
              $ref: "#/components/schemas/Uuid"
            entity_type:
              $ref: "#/components/schemas/SyncEntityType"
            entity_id:
              $ref: "#/components/schemas/Uuid"
            op:
              type: string
              const: delete
            base_version:
              $ref: "#/components/schemas/SyncVersion"
    SyncCurrent:
      type: object
      additionalProperties: false
      required: [version, state, document]
      description: The server's copy of a command's entity. document is null when deleted.
      properties:
        version:
          $ref: "#/components/schemas/SyncVersion"
        state:
          type: string
          enum: [active, deleted]
        document:
          oneOf:
            - $ref: "#/components/schemas/SyncDocument"
            - type: "null"
    SyncFieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
          description: JSON Pointer into the command, for example /document/title/en.
        code:
          type: string
          enum: [required, blank, too_long, too_many, duplicate, not_allowed, invalid, mismatch, not_found, range]
          description: >-
            `range`: a value is out of order with another, such as a Qur'an reference whose ayah_end is below its
            ayah_start (reported on ayah_end).
    SyncCascadedChange:
      type: object
      additionalProperties: false
      required: [entity_type, entity_id, state, version, revision]
      description: >-
        An entity the server changed as a cascade of the receipt's command, at the same revision: a dhikr_personal a
        user_tag delete removed the tag from (active), or the dhikr_personal of a deleted custom_dhikr (deleted).
      properties:
        entity_type:
          $ref: "#/components/schemas/SyncEntityType"
        entity_id:
          $ref: "#/components/schemas/Uuid"
        state:
          type: string
          enum: [active, deleted]
        version:
          $ref: "#/components/schemas/SyncVersion"
        revision:
          $ref: "#/components/schemas/Revision"
    SyncAppliedReceipt:
      type: object
      additionalProperties: false
      required: [command_id, status, version, revision, cascaded]
      properties:
        command_id:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          const: applied
        version:
          $ref: "#/components/schemas/SyncVersion"
        revision:
          $ref: "#/components/schemas/Revision"
        cascaded:
          description: >-
            An array exactly when the command is a user_tag or custom_dhikr delete: every other entity the server
            changed at the same revision, ordered by entity_type, then entity_id, and empty when nothing cascaded.
            Phones set those entities' known versions from it straight away, so the next edit doesn't conflict. null
            for every other command.
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/SyncCascadedChange"
            - type: "null"
    SyncConflictReceipt:
      type: object
      additionalProperties: false
      required: [command_id, status, current]
      properties:
        command_id:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          const: conflict
        current:
          $ref: "#/components/schemas/SyncCurrent"
    SyncMergedReceipt:
      type: object
      additionalProperties: false
      required: [command_id, status, merged_into, current]
      properties:
        command_id:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          const: merged
        merged_into:
          $ref: "#/components/schemas/Uuid"
        current:
          $ref: "#/components/schemas/SyncCurrent"
    SyncGoneReceipt:
      type: object
      additionalProperties: false
      required: [command_id, status]
      properties:
        command_id:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          const: gone
    SyncRejectedReceipt:
      type: object
      additionalProperties: false
      required: [command_id, status, code, fields, current]
      properties:
        command_id:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          const: rejected
        code:
          type: string
          enum:
            - document_invalid
            - document_too_large
            - custom_dhikr_limit_reached
            - tag_limit_reached
            - tag_name_taken
            - tag_not_found
            - dhikr_not_found
            - entity_not_found
            - delete_not_allowed
            - command_id_reused
            - audio_not_found
            - audio_mismatch
        fields:
          type: array
          items:
            $ref: "#/components/schemas/SyncFieldError"
        current:
          description: The server's copy to undo to, or null when it has none.
          oneOf:
            - $ref: "#/components/schemas/SyncCurrent"
            - type: "null"
    SyncOutcome:
      description: A receipt as first decided.
      oneOf:
        - $ref: "#/components/schemas/SyncAppliedReceipt"
        - $ref: "#/components/schemas/SyncConflictReceipt"
        - $ref: "#/components/schemas/SyncMergedReceipt"
        - $ref: "#/components/schemas/SyncGoneReceipt"
        - $ref: "#/components/schemas/SyncRejectedReceipt"
    SyncReceipt:
      oneOf:
        - $ref: "#/components/schemas/SyncAppliedReceipt"
        - $ref: "#/components/schemas/SyncConflictReceipt"
        - $ref: "#/components/schemas/SyncMergedReceipt"
        - $ref: "#/components/schemas/SyncGoneReceipt"
        - $ref: "#/components/schemas/SyncRejectedReceipt"
        - type: object
          additionalProperties: false
          required: [command_id, status, original]
          properties:
            command_id:
              $ref: "#/components/schemas/Uuid"
            status:
              type: string
              const: duplicate
            original:
              $ref: "#/components/schemas/SyncOutcome"
    SyncChange:
      type: object
      additionalProperties: false
      required: [entity_type, entity_id, state, version, revision, document]
      description: An entity's latest state. document is null when deleted.
      properties:
        entity_type:
          $ref: "#/components/schemas/SyncEntityType"
        entity_id:
          $ref: "#/components/schemas/Uuid"
        state:
          type: string
          enum: [active, deleted]
        version:
          $ref: "#/components/schemas/SyncVersion"
        revision:
          $ref: "#/components/schemas/Revision"
        document:
          oneOf:
            - $ref: "#/components/schemas/SyncDocument"
            - type: "null"

    AudioContentType:
      description: >-
        The recording's media type, exactly as written: MP3 is `audio/mpeg`, M4A/AAC is `audio/mp4`. Lowercase, no
        parameters (audio.schema.json `content_type`).
      oneOf:
        - type: string
          const: audio/mpeg
        - type: string
          const: audio/mp4
      examples: ["audio/mpeg"]
    AudioByteSize:
      type: integer
      minimum: 1
      maximum: 10000000
      description: File size in bytes, 1 to 10,000,000 (10 MB, decimal).
      examples: [4182733]
    AudioDurationMs:
      description: Length in milliseconds as the importing client measured it, or null. The server never decodes audio.
      oneOf:
        - type: integer
          minimum: 1
          maximum: 9007199254740991
        - type: "null"
    Sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: SHA-256 of the file's bytes, as 64 lowercase hex digits.
      examples: ["7959650f9fa69b6279b3694e2506059cb67062cc0f7e9ad27a346528d341e5bc"]
    UploadedAudio:
      type: object
      additionalProperties: false
      required: [asset_id, byte_size, content_type, duration_ms]
      description: >-
        A recording uploaded to the account's private storage (sync.schema.json `uploaded_audio`). Every member is
        present. A put naming an `asset_id` that isn't a ready asset of the account is `rejected` with
        `audio_not_found`; one whose `byte_size` or `content_type` differs from the asset's is `rejected` with
        `audio_mismatch`.
      properties:
        asset_id:
          $ref: "#/components/schemas/Uuid"
        byte_size:
          $ref: "#/components/schemas/AudioByteSize"
        content_type:
          $ref: "#/components/schemas/AudioContentType"
        duration_ms:
          $ref: "#/components/schemas/AudioDurationMs"
    AudioAsset:
      type: object
      additionalProperties: false
      required: [asset_id, byte_size, content_type, status, created_at]
      description: A confirmed recording of the account (audio.schema.json `asset`). A pending upload isn't an asset.
      properties:
        asset_id:
          $ref: "#/components/schemas/Uuid"
        byte_size:
          $ref: "#/components/schemas/AudioByteSize"
        content_type:
          $ref: "#/components/schemas/AudioContentType"
        status:
          type: string
          const: ready
        created_at:
          $ref: "#/components/schemas/Instant"
    AudioAssetResult:
      type: object
      additionalProperties: false
      required: [asset]
      description: A ready asset (audio.schema.json `asset_response`).
      properties:
        asset:
          $ref: "#/components/schemas/AudioAsset"
    AudioUpload:
      type: object
      additionalProperties: false
      required: [asset_id, upload_url, upload_headers, expires_at]
      description: A pending upload's signed PUT link (audio.schema.json `upload`).
      properties:
        asset_id:
          $ref: "#/components/schemas/Uuid"
        upload_url:
          type: string
          format: uri
          description: Signed R2 PUT link, valid until `expires_at` (15 minutes). Treat it as opaque.
        upload_headers:
          type: object
          required: [content-type, x-amz-checksum-sha256]
          additionalProperties:
            type: string
          description: >-
            Headers to send, verbatim and all of them, with the PUT: lowercase header names to values. Today
            `content-type` (the upload's content_type) and `x-amz-checksum-sha256` (the base64 SHA-256 the link is
            signed with, so R2 refuses any other bytes). Clients pass the map through rather than building it.
        expires_at:
          $ref: "#/components/schemas/Instant"

  parameters:
    AwradAccount:
      name: X-Awrad-Account
      in: header
      required: true
      description: >-
        The account this request's data belongs to: on a phone, the active local profile's account; on the web, the
        signed-in account. If it isn't the authenticated account, the request is refused with `409 account_mismatch`
        and nothing is read or written. Missing or not a UUID is `400 malformed_request`.
      schema:
        $ref: "#/components/schemas/Uuid"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: A UUID (clients generate UUIDv7). Replays the stored result for 24 hours (STYLE §10). Clients send it on every retryable POST.
      schema:
        $ref: "#/components/schemas/Uuid"
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: >-
        Language for any email this request sends: `en`, `ar` or `ml` (the first supported one wins;
        default `en`). Clients send the app's current language.
      schema:
        type: string
        maxLength: 256
      example: ar
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A UUID (clients generate UUIDv7), required on this operation. A retry with the same key gets the same result.
      schema:
        $ref: "#/components/schemas/Uuid"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Cursor"
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Each list operation documents its own default and maximum.
      schema:
        type: integer
        minimum: 1
        maximum: 200

  headers:
    CacheControl:
      description: Every response states its caching (STYLE §12).
      schema:
        type: string
      example: no-store
    RequestId:
      description: Correlates the request in server logs. Include it in bug reports.
      schema:
        type: string
      example: F-8kq2Yc3xVf1QAAABx
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
        maximum: 86400
      example: 30

  responses:
    NoContent:
      description: Done.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        x-request-id:
          $ref: "#/components/headers/RequestId"
    CodeSent:
      description: >-
        Accepted. If the email qualifies, a code is on its way. The response is the same either way, so it
        doesn't reveal whether the email has an account. Clients offer "send a new code" 60 seconds after this
        response; a `429` with `Retry-After` overrides that.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        x-request-id:
          $ref: "#/components/headers/RequestId"
    DeviceSessionGranted:
      description: The device session and its tokens.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeviceSessionGrant"
          example:
            account:
              id: 0b6f6a1e-6c1f-4b8e-9a51-2f3d7c1e8a90
              email: amina@example.com
              created_at: "2026-10-26T08:00:00Z"
            session:
              id: 9a7d1c42-3e5b-4f60-8a19-0c2d4e6f8b13
              device_name: Pixel 9
              platform: android
              created_at: "2026-10-26T08:05:00Z"
              last_seen_at: "2026-10-26T08:05:00Z"
              idle_expires_at: "2026-11-25T08:05:00Z"
              absolute_expires_at: "2027-04-24T08:05:00Z"
            access_token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIwYjZmIn0.c2lnbmF0dXJlLWV4YW1wbGU
            access_token_expires_at: "2026-10-26T08:20:00Z"
            refresh_token: Q2hhbmdlTWVJbkEtcmVmcmVzaC10b2tlbi1leGFtcGxlMTIz
    BadRequest:
      description: Malformed request, wrong types, or unknown fields.
      headers: &problem_headers
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:malformed_request
            title: Malformed request
            status: 400
            code: malformed_request
            detail: unknown field "daily_targett"
            errors: []
    Unauthorized:
      description: Not authenticated, credential expired, or the wrong scheme for this pipeline.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:unauthenticated
            title: Authentication required
            status: 401
            code: unauthenticated
            detail: no valid session
            errors: []
    Forbidden:
      description: Authenticated but not allowed, including an unverified email.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:email_verification_required
            title: Email verification required
            status: 403
            code: email_verification_required
            detail: verify the account email first
            errors: []
    NotFound:
      description: Doesn't exist, or isn't visible to this caller. Doesn't say which.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:not_found
            title: Not found
            status: 404
            code: not_found
            detail: no such resource
            errors: []
    UnprocessableContent:
      description: Well-formed but fails validation.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:validation_failed
            title: Request validation failed
            status: 422
            code: validation_failed
            detail: email is not a valid address
            errors:
              - field: /email
                code: email_invalid
                detail: not a valid email address
    InvalidCredentials:
      description: Wrong email or password. Doesn't say which.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:invalid_credentials
            title: Invalid credentials
            status: 401
            code: invalid_credentials
            detail: wrong email or password
            errors: []
    CsrfTokenInvalid:
      description: The CSRF token is missing or doesn't match the session.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:csrf_token_invalid
            title: CSRF token invalid
            status: 403
            code: csrf_token_invalid
            detail: missing or stale X-CSRF-Token
            errors: []
    VerificationCodeInvalid:
      description: >-
        `verification_code_invalid` (wrong, expired or used code, or unknown email), or `validation_failed`
        for a malformed email or code.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:verification_code_invalid
            title: Verification code invalid
            status: 422
            code: verification_code_invalid
            detail: the code is wrong, expired or already used
            errors: []
    PasswordRejected:
      description: >-
        `validation_failed`. Field codes: `email_invalid` on `/email`; `password_too_short`,
        `password_too_long` or `password_too_common` on `/password`.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:validation_failed
            title: Request validation failed
            status: 422
            code: validation_failed
            detail: password must be at least 12 characters
            errors:
              - field: /password
                code: password_too_short
                detail: must be at least 12 characters
    CurrentPasswordRejected:
      description: >-
        `validation_failed`. Field codes: `current_password_incorrect` on `/current_password`; on operations
        that take a new password, also `password_too_short`, `password_too_long` or `password_too_common`
        on `/new_password`.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:validation_failed
            title: Request validation failed
            status: 422
            code: validation_failed
            detail: the current password is incorrect
            errors:
              - field: /current_password
                code: current_password_incorrect
                detail: incorrect
    AccountMismatch:
      description: >-
        `account_mismatch`: X-Awrad-Account names a different account from the one signed in. Nothing was read or
        written. A phone stops syncing that profile until the right account signs in.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:account_mismatch
            title: Account mismatch
            status: 409
            code: account_mismatch
            detail: X-Awrad-Account is not the signed-in account
            errors: []
    TooManyRequests:
      description: Rate limited.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        x-request-id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:rate_limited
            title: Too many requests
            status: 429
            code: rate_limited
            detail: retry later
            errors: []
