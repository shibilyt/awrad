openapi: 3.1.0
info:
  title: Awrad API
  version: 1.0.0-pre
  summary: JSON API served by awrad-server-next to the Android, iOS and web clients.
  description: |
    Follows `contracts/api/STYLE.md` (ADR-2026-10-16). Rules are enforced by
    `contracts/api/spectral.mjs`; run `npm test` in `contracts/`.

    Paths are added slice by slice (`docs/rebuild-plan.md`). Shared building
    blocks live under `components` and are referenced, never copied.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: "{base_url}"
    description: The deployment's API origin. Web clients use their own origin (same site).
    variables:
      base_url:
        default: http://localhost:4000
tags:
  - name: accounts
    description: Registration, email verification, password reset and the signed-in account (slice 2a).
  - name: device_sessions
    description: Mobile sign-in, token refresh and sign-out (ADR-2026-07-12).
  - name: account_settings
    description: Sessions, password, email and deletion for the signed-in account (slice 2b).
  - name: browser
    description: Endpoints only browser (cookie-session) clients use.

paths:
  /api/v1/accounts:
    $ref: paths/accounts.yaml#/accounts
  /api/v1/accounts/verify_email:
    $ref: paths/accounts.yaml#/verify_email
  /api/v1/accounts/resend_verification_code:
    $ref: paths/accounts.yaml#/resend_verification_code
  /api/v1/accounts/request_password_reset:
    $ref: paths/accounts.yaml#/request_password_reset
  /api/v1/accounts/reset_password:
    $ref: paths/accounts.yaml#/reset_password
  /api/v1/account:
    $ref: paths/accounts.yaml#/current
  /api/v1/account/sessions:
    $ref: paths/account_settings.yaml#/sessions
  /api/v1/account/sessions/{session_id}:
    $ref: paths/account_settings.yaml#/session
  /api/v1/account/sessions/revoke_others:
    $ref: paths/account_settings.yaml#/revoke_others
  /api/v1/account/change_password:
    $ref: paths/account_settings.yaml#/change_password
  /api/v1/account/request_email_change:
    $ref: paths/account_settings.yaml#/request_email_change
  /api/v1/account/confirm_email_change:
    $ref: paths/account_settings.yaml#/confirm_email_change
  /api/v1/account/delete:
    $ref: paths/account_settings.yaml#/delete
  /api/v1/device_sessions:
    $ref: paths/device_sessions.yaml#/device_sessions
  /api/v1/device_sessions/refresh:
    $ref: paths/device_sessions.yaml#/refresh
  /api/v1/device_sessions/sign_out:
    $ref: paths/device_sessions.yaml#/sign_out
  /api/v1/browser/csrf_token:
    $ref: paths/browser.yaml#/csrf_token
  /api/v1/browser/session:
    $ref: paths/browser.yaml#/session

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Mobile clients. Short-lived access token bound to a device session (ADR-2026-07-12).
    cookieAuth:
      type: apiKey
      in: cookie
      name: _awrad_session
      description: >-
        Browser clients. Phoenix session cookie: httpOnly, Secure, SameSite=Lax (ADR-2026-10-15).
        The cookie name is a placeholder until the server scaffold fixes it.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with cookieAuth on every state-changing request. Fetch it from `get_browser_csrf_token`.

  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      description: Lowercase, hyphenated UUID. User-owned entities use client-generated UUIDv4 (STYLE §4).
      examples: ["3285e014-551b-46a4-aedc-8b6664b59bc7"]
    Instant:
      type: string
      format: date-time
      pattern: "Z$"
      description: RFC 3339 instant in UTC with a `Z` suffix. Field names end in `_at`.
      examples: ["2026-10-16T08:00:00Z"]
    LocalDate:
      type: string
      format: date
      description: Calendar day `YYYY-MM-DD`. Field names end in `_date`; practice days use `local_date`.
      examples: ["2026-10-16"]
    LocalTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      description: Local time of day, 24-hour `HH:MM`. Field names end in `_time`.
      examples: ["06:15"]
    Timezone:
      type: string
      minLength: 1
      maxLength: 64
      description: IANA timezone name.
      examples: ["Asia/Kolkata"]
    Count:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: A whole-number count (STYLE §5). Never fractional.
      examples: [313]
    CountDelta:
      type: integer
      minimum: -9007199254740991
      maximum: 9007199254740991
      description: A signed whole-number change to a count, for example -3 to undo three taps.
      examples: [-3]
    Revision:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Monotonic resource revision used with `expected_revision` (STYLE §9).
      examples: [12]
    Cursor:
      type: string
      minLength: 1
      maxLength: 512
      description: Opaque pagination cursor. Clients must not parse or build it.
      examples: ["c2lnbmVkLWN1cnNvcg"]
    Problem:
      type: object
      description: RFC 9457 problem details (STYLE §7). Clients switch on `code` only.
      additionalProperties: true
      required: [type, title, status, code, detail, errors]
      properties:
        type:
          type: string
          pattern: "^urn:awrad:problem:[a-z][a-z0-9_]*$"
        title:
          type: string
          description: English, for logs. Never shown to users.
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: Stable machine code. Clients map it to localized text.
        detail:
          type: string
          description: English, for logs. Never shown to users.
        errors:
          type: array
          description: Field validation errors. Empty when the problem isn't about specific fields.
          items:
            $ref: "#/components/schemas/FieldError"
    Email:
      type: string
      minLength: 3
      maxLength: 160
      description: >-
        An email address, trimmed by the client (contracts/account-model/v1 email_input). Compared
        case-insensitively. Invalid ones are `validation_failed` with field code `email_invalid`.
      examples: ["amina@example.com"]
    Password:
      type: string
      minLength: 1
      maxLength: 1024
      description: >-
        12 to 128 Unicode code points after NFC normalisation, no composition rules
        (contracts/account-model/v1 password_policy). The server also rejects common passwords. Failures are
        `validation_failed` with field code `password_too_short`, `password_too_long` or `password_too_common`.
      examples: ["a long passphrase"]
    EmailCode:
      type: string
      pattern: "^[0-9]{6}$"
      description: >-
        A 6-digit emailed code, ASCII digits only. Clients normalise what the user typed first
        (contracts/account-model/v1 email_code_input). Valid for 15 minutes and 5 tries. A malformed code is
        `validation_failed` with field code `code_invalid`; clients never send one.
      examples: ["482913"]
    EmailOnly:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: "#/components/schemas/Email"
    RefreshTokenOnly:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 16
          maxLength: 512
    Account:
      type: object
      additionalProperties: false
      required: [id, email, created_at]
      description: A signed-in account. Its email is always verified (verification-first).
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          type: string
          maxLength: 160
        created_at:
          $ref: "#/components/schemas/Instant"
    CurrentPassword:
      type: string
      minLength: 1
      maxLength: 1024
      description: The account's current password, re-entered to confirm a sensitive change. A wrong one is
        `validation_failed` with field code `current_password_incorrect`.
    AccountSession:
      type: object
      additionalProperties: false
      required: [id, kind, name, platform, created_at, last_seen_at, is_current]
      description: One place the account is signed in.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
          description: For a device session, the same `id` as `DeviceSession.id` in its sign-in grant.
        kind:
          type: string
          enum: [device, browser]
        name:
          type: ["string", "null"]
          maxLength: 120
          description: >-
            Device model for a device session ("Pixel 9"); a browser and system summary for a browser session
            ("Firefox on Windows"), or null when it couldn't be told. Clients show a generic label for null.
        platform:
          type: string
          enum: [android, ios, web]
        created_at:
          $ref: "#/components/schemas/Instant"
        last_seen_at:
          $ref: "#/components/schemas/Instant"
        is_current:
          type: boolean
          description: True for the session making this request.
    DeviceInfo:
      type: object
      additionalProperties: false
      required: [installation_id, name, platform]
      description: >-
        Invalid values are `validation_failed` with field codes `installation_id_invalid`, `device_name_invalid`
        or `platform_invalid` under `/device/...`.
      properties:
        installation_id:
          $ref: "#/components/schemas/Uuid"
          description: Random UUIDv4 the app creates once per installation and keeps in secure storage.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: The device model, for example "Pixel 9" or "iPhone 16". Shown in the device list.
        platform:
          type: string
          enum: [android, ios]
    DeviceSession:
      type: object
      additionalProperties: false
      required: [id, device_name, platform, created_at, last_seen_at, idle_expires_at, absolute_expires_at]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        device_name:
          type: string
        platform:
          type: string
          enum: [android, ios]
        created_at:
          $ref: "#/components/schemas/Instant"
        last_seen_at:
          $ref: "#/components/schemas/Instant"
        idle_expires_at:
          $ref: "#/components/schemas/Instant"
          description: Ends after 30 days without a refresh; each refresh moves it.
        absolute_expires_at:
          $ref: "#/components/schemas/Instant"
          description: Ends 180 days after sign-in, whatever happens.
    DeviceSessionGrant:
      type: object
      additionalProperties: false
      required: [account, session, access_token, access_token_expires_at, refresh_token]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        session:
          $ref: "#/components/schemas/DeviceSession"
        access_token:
          type: string
          minLength: 16
          maxLength: 4096
          description: Bearer token, valid for 15 minutes. Keep it in memory only.
        access_token_expires_at:
          $ref: "#/components/schemas/Instant"
        refresh_token:
          type: string
          minLength: 16
          maxLength: 512
          description: Single use. Keep it in secure storage (Android Keystore, iOS Keychain).
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, detail]
      properties:
        field:
          type: string
          description: JSON Pointer into the request body, for example `/daily_target`.
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        detail:
          type: string

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: UUIDv4. Replays the stored result for 24 hours (STYLE §10). Clients send it on every retryable POST.
      schema:
        $ref: "#/components/schemas/Uuid"
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: >-
        Language for any email this request sends: `en`, `ar` or `ml` (the first supported one wins;
        default `en`). Clients send the app's current language.
      schema:
        type: string
        maxLength: 256
      example: ar
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUIDv4, required on this operation. A retry with the same key gets the same result.
      schema:
        $ref: "#/components/schemas/Uuid"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Cursor"
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Each list operation documents its own default and maximum.
      schema:
        type: integer
        minimum: 1
        maximum: 200

  headers:
    CacheControl:
      description: Every response states its caching (STYLE §12).
      schema:
        type: string
      example: no-store
    RequestId:
      description: Correlates the request in server logs. Include it in bug reports.
      schema:
        type: string
      example: F-8kq2Yc3xVf1QAAABx
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
        maximum: 86400
      example: 30

  responses:
    NoContent:
      description: Done.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        x-request-id:
          $ref: "#/components/headers/RequestId"
    CodeSent:
      description: >-
        Accepted. If the email qualifies, a code is on its way. The response is the same either way, so it
        doesn't reveal whether the email has an account. Clients offer "send a new code" 60 seconds after this
        response; a `429` with `Retry-After` overrides that.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        x-request-id:
          $ref: "#/components/headers/RequestId"
    DeviceSessionGranted:
      description: The device session and its tokens.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeviceSessionGrant"
          example:
            account:
              id: 0b6f6a1e-6c1f-4b8e-9a51-2f3d7c1e8a90
              email: amina@example.com
              created_at: "2026-10-26T08:00:00Z"
            session:
              id: 9a7d1c42-3e5b-4f60-8a19-0c2d4e6f8b13
              device_name: Pixel 9
              platform: android
              created_at: "2026-10-26T08:05:00Z"
              last_seen_at: "2026-10-26T08:05:00Z"
              idle_expires_at: "2026-11-25T08:05:00Z"
              absolute_expires_at: "2027-04-24T08:05:00Z"
            access_token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIwYjZmIn0.c2lnbmF0dXJlLWV4YW1wbGU
            access_token_expires_at: "2026-10-26T08:20:00Z"
            refresh_token: Q2hhbmdlTWVJbkEtcmVmcmVzaC10b2tlbi1leGFtcGxlMTIz
    BadRequest:
      description: Malformed request, wrong types, or unknown fields.
      headers: &problem_headers
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:malformed_request
            title: Malformed request
            status: 400
            code: malformed_request
            detail: unknown field "daily_targett"
            errors: []
    Unauthorized:
      description: Not authenticated, credential expired, or the wrong scheme for this pipeline.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:unauthenticated
            title: Authentication required
            status: 401
            code: unauthenticated
            detail: no valid session
            errors: []
    Forbidden:
      description: Authenticated but not allowed, including an unverified email.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:email_verification_required
            title: Email verification required
            status: 403
            code: email_verification_required
            detail: verify the account email first
            errors: []
    NotFound:
      description: Doesn't exist, or isn't visible to this caller. Doesn't say which.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:not_found
            title: Not found
            status: 404
            code: not_found
            detail: no such resource
            errors: []
    UnprocessableContent:
      description: Well-formed but fails validation.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:validation_failed
            title: Request validation failed
            status: 422
            code: validation_failed
            detail: email is not a valid address
            errors:
              - field: /email
                code: email_invalid
                detail: not a valid email address
    InvalidCredentials:
      description: Wrong email or password. Doesn't say which.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:invalid_credentials
            title: Invalid credentials
            status: 401
            code: invalid_credentials
            detail: wrong email or password
            errors: []
    CsrfTokenInvalid:
      description: The CSRF token is missing or doesn't match the session.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:csrf_token_invalid
            title: CSRF token invalid
            status: 403
            code: csrf_token_invalid
            detail: missing or stale X-CSRF-Token
            errors: []
    VerificationCodeInvalid:
      description: >-
        `verification_code_invalid` (wrong, expired or used code, or unknown email), or `validation_failed`
        for a malformed email or code.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:verification_code_invalid
            title: Verification code invalid
            status: 422
            code: verification_code_invalid
            detail: the code is wrong, expired or already used
            errors: []
    PasswordRejected:
      description: >-
        `validation_failed`. Field codes: `email_invalid` on `/email`; `password_too_short`,
        `password_too_long` or `password_too_common` on `/password`.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:validation_failed
            title: Request validation failed
            status: 422
            code: validation_failed
            detail: password must be at least 12 characters
            errors:
              - field: /password
                code: password_too_short
                detail: must be at least 12 characters
    CurrentPasswordRejected:
      description: >-
        `validation_failed`. Field codes: `current_password_incorrect` on `/current_password`; on operations
        that take a `new_password`, also `password_too_short`, `password_too_long` or `password_too_common`
        on `/new_password`.
      headers: *problem_headers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:validation_failed
            title: Request validation failed
            status: 422
            code: validation_failed
            detail: the current password is incorrect
            errors:
              - field: /current_password
                code: current_password_incorrect
                detail: incorrect
    TooManyRequests:
      description: Rate limited.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        x-request-id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:awrad:problem:rate_limited
            title: Too many requests
            status: 429
            code: rate_limited
            detail: retry later
            errors: []
