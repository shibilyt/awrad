                  status: gone
                - command_id: 0192f0c0-0000-7000-8000-000000000006
                  status: rejected
                  code: document_invalid
                  fields:
                    - field: /document/normalized_name
                      code: mismatch
                  current: null
                - command_id: 0192f0c0-0000-7000-8000-000000000007
                  status: applied
                  version: 3
                  revision: 13
                  cascaded:
                    - entity_type: dhikr_personal
                      entity_id: 6f04f77e-dcb6-4a29-9dc5-fcd3649c2961
                      state: active
                      version: 3
                      revision: 13
                - command_id: 0192f0c0-0000-7000-8000-000000000008
                  status: applied
                  version: 1
                  revision: 14
                  cascaded: null
                - command_id: 0192f0c0-0000-7000-8000-000000000009
                  status: applied
                  version: 1
                  revision: 15
                  cascaded: null
                - command_id: 0192f0c0-0000-7000-8000-00000000000a
                  status: applied
                  version: 1
                  revision: 16
                  cascaded: null
                - command_id: 0192f0c0-0000-7000-8000-000000000001
                  status: duplicate
                  original:
                    command_id: 0192f0c0-0000-7000-8000-000000000001
                    status: applied
