                      "on": "2026-10-14"
                      reason: user
                - entity_type: goal_order
                  entity_id: 0b6f6a1e-6c1f-4b8e-9a51-2f3d7c1e8a90
                  state: active
                  version: 1
                  revision: 16
                  document:
                    goal_ids:
                      - 0192f300-0000-7000-8000-000000000001
                      - 0192f300-0000-7000-8000-000000000002
              next_after: 16
              has_more: false
              head_revision: 16
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "409":
        $ref: "../openapi.yaml#/components/responses/AccountMismatch"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
