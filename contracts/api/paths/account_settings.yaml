# Account settings for a signed-in account (slice 2b). Every operation accepts either credential; each pipeline
# checks only its own (ADR-2026-10-15). Cookie requests that change state also send X-CSRF-Token.

sessions:
  get:
    operationId: list_account_sessions
    tags: [account_settings]
    summary: Every place the account is signed in
    description: >-
      Mobile device sessions and browser sessions together, most recently used first, with the caller's
      own marked `is_current`. Only active sessions are listed. An account rarely has more than a page.
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Cursor"
      - name: limit
        in: query
        required: false
        description: Page size. Default 50, maximum 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
    x-error-codes: [malformed_request, unauthenticated]
    responses:
      "200":
        description: The sessions.
        headers:
          Cache-Control:
            $ref: "../openapi.yaml#/components/headers/CacheControl"
          x-request-id:
            $ref: "../openapi.yaml#/components/headers/RequestId"
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items, next_cursor]
              properties:
                items:
                  type: array
                  items:
                    $ref: "../openapi.yaml#/components/schemas/AccountSession"
                next_cursor:
                  oneOf:
                    - $ref: "../openapi.yaml#/components/schemas/Cursor"
                    - type: "null"
            example:
              items:
                - id: 9a7d1c42-3e5b-4f60-8a19-0c2d4e6f8b13
                  kind: device
                  name: Pixel 9
                  platform: android
                  created_at: "2026-10-26T08:05:00Z"
                  last_seen_at: "2026-10-27T06:40:00Z"
                  is_current: true
                - id: 4c2e8f10-7b3a-4d5e-9f61-2a8b0c1d3e45
                  kind: browser
                  name: Firefox on Windows
                  platform: web
                  created_at: "2026-10-20T18:00:00Z"
                  last_seen_at: "2026-10-26T21:15:00Z"
                  is_current: false
              next_cursor: null
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"

session:
  delete:
    operationId: revoke_account_session
    tags: [account_settings]
    summary: Sign out one device or browser
    description: >-
      Ends that session; its next request is `401`. Revoking the caller's own session is the same as signing
      out. Another account's session, or one already ended, is `404`.
    security:
      - bearerAuth: []
      - cookieAuth: []
        csrfToken: []
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: "../openapi.yaml#/components/schemas/Uuid"
    x-error-codes: [unauthenticated, csrf_token_invalid, not_found]
    responses:
      "204":
        $ref: "../openapi.yaml#/components/responses/NoContent"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/CsrfTokenInvalid"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"

revoke_others:
  post:
    operationId: revoke_other_account_sessions
    tags: [account_settings]
    summary: Sign out of all other devices and browsers
    description: Ends every session of the account except the caller's own.
    security:
      - bearerAuth: []
      - cookieAuth: []
        csrfToken: []
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
    x-error-codes: [unauthenticated, csrf_token_invalid]
    responses:
      "204":
        $ref: "../openapi.yaml#/components/responses/NoContent"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/CsrfTokenInvalid"

change_password:
  post:
    operationId: change_password
    tags: [account_settings]
    summary: Change the password while signed in
    description: >-
      Needs the current password. Signs out every other device and browser and keeps the caller signed in.
      The account's email gets a notice that the password changed.
    security:
      - bearerAuth: []
      - cookieAuth: []
        csrfToken: []
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
      - $ref: "../openapi.yaml#/components/parameters/AcceptLanguage"
    x-error-codes: [malformed_request, unauthenticated, csrf_token_invalid, validation_failed, rate_limited]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [current_password, new_password]
            properties:
              current_password:
                $ref: "../openapi.yaml#/components/schemas/CurrentPassword"
              new_password:
                $ref: "../openapi.yaml#/components/schemas/Password"
          example:
            current_password: a long passphrase
            new_password: another long passphrase
    responses:
      "204":
        $ref: "../openapi.yaml#/components/responses/NoContent"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/CsrfTokenInvalid"
      "422":
        $ref: "../openapi.yaml#/components/responses/CurrentPasswordRejected"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"

request_email_change:
  post:
    operationId: request_email_change
    tags: [account_settings]
    summary: Start changing the account's email
    description: >-
      Needs the current password. Emails a 6-digit code to the NEW address; nothing changes until
      `confirm_email_change`. Always `202` for a valid request: if the new address already belongs to another
      account, that address gets a notice instead of a code, so the response doesn't reveal it. A new request
      cancels the previous code.
    security:
      - bearerAuth: []
      - cookieAuth: []
        csrfToken: []
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
      - $ref: "../openapi.yaml#/components/parameters/AcceptLanguage"
    x-error-codes: [malformed_request, unauthenticated, csrf_token_invalid, validation_failed, rate_limited]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [current_password, new_email]
            properties:
              current_password:
                $ref: "../openapi.yaml#/components/schemas/CurrentPassword"
              new_email:
                $ref: "../openapi.yaml#/components/schemas/Email"
          example:
            current_password: a long passphrase
            new_email: amina.new@example.com
    responses:
      "202":
        $ref: "../openapi.yaml#/components/responses/CodeSent"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/CsrfTokenInvalid"
      "422":
        description: >-
          `validation_failed`. Field codes: `current_password_incorrect` on `/current_password`;
          `email_invalid` or `email_unchanged` on `/new_email`.
        headers:
          Cache-Control:
            $ref: "../openapi.yaml#/components/headers/CacheControl"
          x-request-id:
            $ref: "../openapi.yaml#/components/headers/RequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Problem"
            example:
              type: urn:awrad:problem:validation_failed
              title: Request validation failed
              status: 422
              code: validation_failed
              detail: new_email is the account's current email
              errors:
                - field: /new_email
                  code: email_unchanged
                  detail: already the account's email
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"

confirm_email_change:
  post:
    operationId: confirm_email_change
    tags: [account_settings]
    summary: Confirm the new email with the code sent to it
    description: >-
      Switches the account to the new address and returns the account. The old address gets a notice of the
      change. Sessions stay signed in. A wrong, expired or used code is `email_change_code_invalid` (5 tries).
      If the new address was taken by another account in the meantime, `409 email_taken`.
    security:
      - bearerAuth: []
      - cookieAuth: []
        csrfToken: []
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
      - $ref: "../openapi.yaml#/components/parameters/AcceptLanguage"
    x-error-codes: [malformed_request, unauthenticated, csrf_token_invalid, validation_failed, email_change_code_invalid, email_taken, rate_limited]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code]
            properties:
              code:
                $ref: "../openapi.yaml#/components/schemas/EmailCode"
          example:
            code: "519274"
    responses:
      "200":
        description: The account with its new email.
        headers:
          Cache-Control:
            $ref: "../openapi.yaml#/components/headers/CacheControl"
          x-request-id:
            $ref: "../openapi.yaml#/components/headers/RequestId"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Account"
            example:
              id: 0b6f6a1e-6c1f-4b8e-9a51-2f3d7c1e8a90
              email: amina.new@example.com
              created_at: "2026-10-26T08:00:00Z"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/CsrfTokenInvalid"
      "409":
        description: The new address now belongs to another account.
        headers:
          Cache-Control:
            $ref: "../openapi.yaml#/components/headers/CacheControl"
          x-request-id:
            $ref: "../openapi.yaml#/components/headers/RequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Problem"
            example:
              type: urn:awrad:problem:email_taken
              title: Email taken
              status: 409
              code: email_taken
              detail: the new email now belongs to another account
              errors: []
      "422":
        description: "`email_change_code_invalid`, or `validation_failed` with `code_invalid` on `/code`."
        headers:
          Cache-Control:
            $ref: "../openapi.yaml#/components/headers/CacheControl"
          x-request-id:
            $ref: "../openapi.yaml#/components/headers/RequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Problem"
            example:
              type: urn:awrad:problem:email_change_code_invalid
              title: Email change code invalid
              status: 422
              code: email_change_code_invalid
              detail: the code is wrong, expired or already used
              errors: []
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"

delete:
  post:
    operationId: delete_account
    tags: [account_settings]
    summary: Delete the account now
    description: >-
      Needs the current password. Immediately and permanently deletes the account and everything the server
      keeps for it (sessions, settings, synced data), and ends every session; a browser's cookies are cleared.
      Practice data stored on devices isn't touched: the apps keep working offline. The address gets a
      confirmation email. There is no undo.
    security:
      - bearerAuth: []
      - cookieAuth: []
        csrfToken: []
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
      - $ref: "../openapi.yaml#/components/parameters/AcceptLanguage"
    x-error-codes: [malformed_request, unauthenticated, csrf_token_invalid, validation_failed, rate_limited]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [current_password]
            properties:
              current_password:
                $ref: "../openapi.yaml#/components/schemas/CurrentPassword"
          example:
            current_password: a long passphrase
    responses:
      "204":
        $ref: "../openapi.yaml#/components/responses/NoContent"
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/CsrfTokenInvalid"
      "422":
        $ref: "../openapi.yaml#/components/responses/CurrentPasswordRejected"
      "429":
        $ref: "../openapi.yaml#/components/responses/TooManyRequests"
