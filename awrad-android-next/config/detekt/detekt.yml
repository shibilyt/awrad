# Builds on detekt's default config (buildUponDefaultConfig = true).
# Only deliberate deviations live here. Every one is a standard, not a silencer.

config:
  validation: true
  warningsAsErrors: true

complexity:
  LongMethod:
    threshold: 60
    ignoreAnnotated: ['Preview']
  LongParameterList:
    functionThreshold: 7
    constructorThreshold: 7
    ignoreDefaultParameters: true
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 15
    ignorePrivate: true
  CyclomaticComplexMethod:
    threshold: 12
    ignoreSimpleWhenEntries: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes: ['**/test/**', '**/androidTest/**']
  MaxLineLength:
    maxLineLength: 120
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenImport:
    active: true
    # These Material components draw `primary` as text, focus or progress (unreadable on a dark background) or
    # draw lines; the design has no outlines (contracts/design-tokens/v1/README.md). Use the :core:designsystem
    # component that picks the role.
    excludes: ['**/core/designsystem/**']
    imports:
      - value: 'androidx.compose.material3.TextButton'
        reason: 'Use AwradTextButton (accent or error text).'
      - value: 'androidx.compose.material3.Button'
        reason: 'Use AwradButton or AwradRowButton (components.md, "Buttons").'
      - value: 'androidx.compose.material3.IconButton'
        reason: 'Use AwradIconButton or AwradBackButton (no ripple fill, a required label).'
      - value: 'androidx.compose.material3.AlertDialog'
        reason: 'Use AwradDialog (surfaceBar, the scrim, buttons at the end).'
      - value: 'androidx.compose.material3.ModalBottomSheet'
        reason: 'Use AwradBottomSheet (the sheet motion).'
      - value: 'androidx.compose.material3.Checkbox'
        reason: 'Use AwradCheckbox.'
      - value: 'androidx.compose.material3.Switch'
        reason: 'Use AwradSwitch.'
      - value: 'androidx.compose.material3.TopAppBar'
        reason: 'Use AwradTopBar.'
      - value: 'androidx.compose.material3.CenterAlignedTopAppBar'
        reason: 'Use AwradTopBar.'
      - value: 'androidx.compose.material3.NavigationBar'
        reason: 'Use AwradBottomBar (floating, the navPill motion).'
      - value: 'androidx.compose.material3.OutlinedButton'
        reason: 'Use AwradSecondaryButton (filled, no border).'
      - value: 'androidx.compose.material3.OutlinedIconButton'
        reason: 'The design has no outlines; use a filled or plain IconButton.'
      - value: 'androidx.compose.material3.OutlinedTextField'
        reason: 'Use AwradTextField (filled, no border).'
      - value: 'androidx.compose.material3.TextField'
        reason: 'Use AwradTextField (filled, no indicator line).'
      - value: 'androidx.compose.material3.Card'
        reason: 'Use AwradCard (surface fill; fields inside fill with background).'
      - value: 'androidx.compose.material3.OutlinedCard'
        reason: 'Use AwradCard (no border).'
      - value: 'androidx.compose.material3.HorizontalDivider'
        reason: 'Separate rows with spacing, not divider lines.'
      - value: 'androidx.compose.material3.VerticalDivider'
        reason: 'Separate content with spacing, not divider lines.'
      - value: 'androidx.compose.material3.Divider'
        reason: 'Separate rows with spacing, not divider lines.'
      - value: 'androidx.compose.foundation.border'
        reason: 'The design has no outlines; the exceptions live in :core:designsystem components.'
      - value: 'androidx.compose.foundation.BorderStroke'
        reason: 'The design has no outlines; the exceptions live in :core:designsystem components.'
      - value: 'androidx.compose.material3.LinearProgressIndicator'
        reason: 'Use AwradLinearProgress (the progress role).'
      - value: 'androidx.compose.material3.CircularProgressIndicator'
        reason: 'Use AwradCircularProgress (the progress role).'
      - value: 'androidx.compose.material.icons.*'
        reason: 'Use AwradIcons, the shared icon set (contracts/design-tokens/v1/icons.json), never Material Icons.'
  ForbiddenComment:
    active: true
    comments:
      - reason: 'Track work in issues, not in code.'
        value: 'TODO:'
      - reason: 'Track work in issues, not in code.'
        value: 'FIXME:'

formatting:
  MaximumLineLength:
    maxLineLength: 120
  TrailingCommaOnCallSite:
    active: true
    useTrailingCommaOnCallSite: true
  TrailingCommaOnDeclarationSite:
    active: true
    useTrailingCommaOnDeclarationSite: true
  FunctionNaming:
    active: false # naming>FunctionNaming owns this, with the Composable exception.

Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableParamOrder:
    active: true
  CompositionLocalAllowlist:
    active: true
    # The design system's colour roles that Material's ColorScheme lacks (AwradTheme.colors), and the container
    # a field or secondary button sits on, which picks its fill since the design has no outlines (AwradCard sets
    # it; like Material's LocalContentColor, it's ambient by nature). The motion for the system's reduced-motion
    # setting (AwradTheme.motion), and the page transitions of the NavHost around a page (its screen depth). The
    # shadows resolved for the theme's colours (AwradTheme.elevation), like the colours.
    allowedCompositionLocals: LocalAwradColors,LocalAwradContainer,LocalAwradElevation,LocalAwradMotion,LocalAwradPageTransitions
  ContentEmitterReturningValues:
    active: true
  ModifierClickableOrder:
    active: true
  ModifierComposable:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
  RememberMissing:
    active: true
  RememberContentMissing:
    active: true
  UnstableCollections:
    active: false
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
