# Builds on detekt's default config (buildUponDefaultConfig = true).
# Only deliberate deviations live here. Every one is a standard, not a silencer.

config:
  validation: true
  warningsAsErrors: true

complexity:
  LongMethod:
    threshold: 60
    ignoreAnnotated: ['Preview']
  LongParameterList:
    functionThreshold: 7
    constructorThreshold: 7
    ignoreDefaultParameters: true
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 15
    ignorePrivate: true
  CyclomaticComplexMethod:
    threshold: 12
    ignoreSimpleWhenEntries: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes: ['**/test/**', '**/androidTest/**']
  MaxLineLength:
    maxLineLength: 120
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ForbiddenImport:
    active: true
    # These Material components draw `primary` as text, focus or progress (unreadable on a dark background) or
    # the decorative `outline` as a control border. Use the :core:designsystem component that picks the role.
    excludes: ['**/core/designsystem/**']
    imports:
      - value: 'androidx.compose.material3.TextButton'
        reason: 'Use AwradTextButton (accent or error text).'
      - value: 'androidx.compose.material3.OutlinedButton'
        reason: 'Use AwradSecondaryButton (outlineStrong border).'
      - value: 'androidx.compose.material3.OutlinedTextField'
        reason: 'Use AwradTextField (outlineStrong border, accent focus).'
      - value: 'androidx.compose.material3.TextField'
        reason: 'Use AwradTextField (outlineStrong border, accent focus).'
      - value: 'androidx.compose.material3.LinearProgressIndicator'
        reason: 'Use AwradLinearProgress (the progress role).'
      - value: 'androidx.compose.material3.CircularProgressIndicator'
        reason: 'Use AwradCircularProgress (the progress role).'
  ForbiddenComment:
    active: true
    comments:
      - reason: 'Track work in issues, not in code.'
        value: 'TODO:'
      - reason: 'Track work in issues, not in code.'
        value: 'FIXME:'

formatting:
  MaximumLineLength:
    maxLineLength: 120
  TrailingCommaOnCallSite:
    active: true
    useTrailingCommaOnCallSite: true
  TrailingCommaOnDeclarationSite:
    active: true
    useTrailingCommaOnDeclarationSite: true
  FunctionNaming:
    active: false # naming>FunctionNaming owns this, with the Composable exception.

Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableParamOrder:
    active: true
  CompositionLocalAllowlist:
    active: true
    # The design system's colour roles that Material's ColorScheme lacks (AwradTheme.colors).
    allowedCompositionLocals: LocalAwradColors
  ContentEmitterReturningValues:
    active: true
  ModifierClickableOrder:
    active: true
  ModifierComposable:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
  RememberMissing:
    active: true
  RememberContentMissing:
    active: true
  UnstableCollections:
    active: false
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
